<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="../manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yozuryu · Activity</title>
    <link rel="icon" href="../assets/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/icon-192.png">
    <link rel="stylesheet" href="../assets/motion.css">
    <link rel="stylesheet" href="../assets/ui.css">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body { background-color: #171a21; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { overflow-x: clip; }

        @keyframes shimmer {
            0%   { background-position: -800px 0; }
            100% { background-position:  800px 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, #1b2838 25%, #2a3f52 50%, #1b2838 75%);
            background-size: 800px 100%;
            animation: shimmer 1.6s infinite linear;
            border-radius: 2px;
        }

        /* Summary card: stats + platform split, last 14 days + streak, the year heatmap */
        .asum { background: #1b2838; border: 1px solid #2a475e; border-radius: 3px; overflow: hidden; }
        .asum-sec { padding: 12px 14px; min-width: 0; }
        .asum-sec + .asum-sec, .asum-top + .asum-sec { border-top: 1px solid #22344a; }
        @media (min-width: 768px) {
            .asum-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
            .asum-top > .asum-sec + .asum-sec { border-top: 0; border-left: 1px solid #22344a; }
        }
        .asum-less { position: absolute; top: 12px; right: 12px; z-index: 1; display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 2px;
                     font-size: 11.5px; color: #66c0f4; background: none; border: 0; }
        .asum-less:hover { color: #c6d4df; }
        /* Folded: stats, then the 14 days at a fixed shape (never stretched flat), then the toggle */
        .asum-fold { display: flex; align-items: center; gap: 14px; padding: 10px 8px 10px 14px; }
        .afold-stats { display: flex; gap: 18px; flex-shrink: 0; padding: 0; background: none; border: 0; text-align: left; }
        .afold-stats .astat b { font-size: 19px; }
        .afold-stats .astat > span { margin-top: 2px; font-size: 10.5px; white-space: nowrap; }
        .afold-stats .astat em { font-style: normal; color: #546270; font-size: inherit; }
        .afold-year { padding-left: 18px; border-left: 1px solid #22344a; }
        .afold-days { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
        .afold-days .rdays { width: 100%; max-width: 336px; }
        .afold-days > span { font-size: 10px; color: #546270; white-space: nowrap; }
        .rdays.slim .rday-bar { height: 28px; }
        .afold-btn { flex-shrink: 0; align-self: stretch; display: grid; place-items: center; width: 28px; color: #66c0f4; background: none; border: 0; border-radius: 2px; }
        .afold-btn:hover { color: #c6d4df; background: #202d39; }
        .rdays.slim { gap: 2px; }
        .rdays.slim .rday-bar { height: 34px; }
        .asum-h { display: flex; align-items: center; gap: 8px; min-height: 22px; margin-bottom: 8px; }
        .asum-h > span { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #8f98a0; }
        .asum-h > em { font-style: normal; font-size: 11px; color: #546270; }
        .asum-h > :nth-child(2) { margin-left: auto; }
        .astats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .astat { display: flex; flex-direction: column; min-width: 0; }
        .astat b { font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .astat span { font-size: 11px; color: #8f98a0; margin-top: 3px; }
        .astat em { font-style: normal; font-size: 10.5px; color: #546270; }
        .split { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
        .split-bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: #101214; }
        .split-bar i { display: block; height: 100%; transition: opacity 200ms; }
        .split-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: #8f98a0; }
        .split-legend > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        .split-legend > span.dim { opacity: 0.4; }
        .split-legend i { width: 7px; height: 7px; border-radius: 2px; }
        .split-legend b { color: #c6d4df; font-weight: 600; font-variant-numeric: tabular-nums; }

        /* Last 14 days: one bar per day */
        .rdays { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
        .rday { display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 0; background: none; border: 0; min-width: 0; }
        .rday:disabled { cursor: default; }
        .rday-v { height: 12px; font-size: 9px; line-height: 12px; text-align: center; color: #546270; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
        .rday-bar { position: relative; height: 46px; background: #151f2a; border-radius: 2px; overflow: hidden; }
        .rday-bar i { position: absolute; left: 0; right: 0; bottom: 0; background: #2a475e; border-radius: 2px 2px 0 0; transition: height 300ms; }
        .rday.on .rday-bar i { background: #3d7fb0; }
        .rday.streak .rday-bar i { background: linear-gradient(180deg, #e5b143, #9a7020); }
        .rday.streak .rday-v { color: #e5b143; }
        .rday.on .rday-v { color: #8fb8d4; }
        .rday.today .rday-bar { box-shadow: inset 0 0 0 1px #2a475e; }
        .rday.sel .rday-bar { box-shadow: 0 0 0 1.5px #c6d4df; }
        .rday-l { font-size: 9.5px; text-align: center; color: #546270; }
        .rday.today .rday-l { color: #c6d4df; font-weight: 700; }
        .rday:not(:disabled):hover .rday-bar { background: #1b2838; }
        .sktiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
        .sktile { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 7px 10px 7px 7px; background: #172231; border: 1px solid #22344a; border-radius: 3px; }
        .sktile-ic { flex-shrink: 0; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #3d5060; background: #131c26; }
        .sktile.on { border-color: rgba(229,177,67,0.35); background: linear-gradient(135deg, rgba(229,177,67,0.12), rgba(229,177,67,0.02)); }
        .sktile.on .sktile-ic { color: #e5b143; background: rgba(229,177,67,0.14); box-shadow: 0 0 10px rgba(229,177,67,0.25); }
        .sktile.best .sktile-ic { color: #b8c4ce; background: #22303e; }
        .sktile-txt { display: flex; flex-direction: column; min-width: 0; }
        .sktile-txt b { font-size: 14px; font-weight: 600; color: #c6d4df; line-height: 1.2; white-space: nowrap; }
        .sktile.on .sktile-txt b { color: #e5b143; }
        .sktile:not(.on):not(.best) .sktile-txt b { color: #546270; }
        .sktile-txt span { font-size: 10.5px; color: #546270; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Timelines: sticky day heading, one card per game run */
        .tday { position: sticky; top: env(safe-area-inset-top); z-index: 20; display: flex; align-items: baseline; gap: 8px;
                padding: 8px 2px 6px; margin-bottom: 4px; background: #171a21; }
        @media (min-width: 768px) { .tday { top: 26px; } }
        .tday-name { font-size: 12.5px; font-weight: 600; color: #c6d4df; white-space: nowrap; }
        .tday-name em { font-style: normal; font-weight: 500; color: #66c0f4; margin-left: 7px; }
        .tday-meta { margin-left: auto; font-size: 11px; color: #546270; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .tday-meta b { color: #8f98a0; font-weight: 600; }
        .tcard { background: #1b2838; border: 1px solid #2a475e; border-left: 3px solid #2a475e; border-radius: 3px; overflow: hidden; }
        /* Unlock card header: a band with the game's art, a small icon and a bold title, so it
           reads as the heading of the achievements under it (they carry the bigger badges) */
        .tcard-head { position: relative; display: flex; align-items: center; gap: 9px; padding: 9px 12px 9px 9px; background: #23384d; border-bottom: 1px solid #101820;
                      text-decoration: none; overflow: hidden; transition: background-color 150ms; }
        a.tcard-head:hover { background: #29425a; }
        .tcard-head > * { position: relative; }
        .tcard-head > .tcard-art { position: absolute; top: 0; right: 0; bottom: 0; width: min(65%, 380px); overflow: hidden; pointer-events: none;
                                   -webkit-mask-image: linear-gradient(90deg, transparent, #000 75%); mask-image: linear-gradient(90deg, transparent, #000 75%); }
        .tcard-art img { width: 100%; height: 100%; max-width: none; object-fit: cover; opacity: 0.35; border: 0; border-radius: 0; }
        .tcard-art img.art-icon { filter: blur(10px) saturate(1.3); transform: scale(1.5); opacity: 0.45; }
        .tcard-head > .tcard-icon { width: 28px; height: 28px; }
        .tcard-head .tcard-title { font-size: 13.5px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
        .tcard-head .tcard-sub { color: #a9b6c2; }
        .tcard-subset { font-size: 11.5px; color: #e0bd6a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,0.6); margin-top: -1px; }
        .tcard-head .tcard-n { font-size: 11px; }
        .tcard-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .tcard-title { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; font-weight: 500; color: #fff; }
        .tcard-sub { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 11px; color: #8f98a0; white-space: nowrap; }
        .tcard-sub > * { flex-shrink: 0; }
        .tcard-sub > .shrink { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .tcard-n { display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; font-size: 11.5px; font-weight: 600; color: #e5b143; font-variant-numeric: tabular-nums; }
        .ptag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
        .subset-tag { flex-shrink: 0; font-size: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 1px 4px; border-radius: 2px;
                      border: 1px solid rgba(229,177,67,0.3); background: rgba(229,177,67,0.1); color: #c8a84b; }
        .trow-ph { flex-shrink: 0; width: 32px; height: 32px; border-radius: 2px; background: #2a475e; }
        img + .trow-ph, .tcard img, .trow > img { flex-shrink: 0; border-radius: 2px; border: 1px solid #101214; background: #101214; object-fit: cover; }
        .tlist > .trow + .trow { border-top: 1px solid #1f2d3b; }
        .trow { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 9px; }
        .trow > img, .trow > .trow-ph { width: 36px; height: 36px; }
        .trow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
        .trow-title { font-size: 12.5px; font-weight: 500; color: #c6d4df; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .trow-sub { font-size: 11px; color: #8f98a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .trow-end { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 11px; color: #8f98a0; font-variant-numeric: tabular-nums; }
        .trow-end em { font-style: normal; font-size: 10px; color: #546270; }
        .tmore { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 7px; font-size: 11.5px; color: #66c0f4; background: #18232f; border-top: 1px solid #1f2d3b; }
        .tmore:hover { color: #c6d4df; }

        /* Playtime day: per game, a 24-hour track under the title */
        .pday { border-left-width: 1px; }
        .paxis, .prow { display: grid; grid-template-columns: 32px minmax(0, 1fr) 62px; column-gap: 10px; }
        .paxis { padding: 6px 12px 0 10px; }
        .paxis > div { position: relative; height: 11px; }
        .paxis i { position: absolute; top: 0; transform: translateX(-50%); font-style: normal; font-size: 9px; line-height: 11px; color: #3d5060; font-variant-numeric: tabular-nums; }
        .paxis i:first-child { transform: none; }
        .paxis i:last-child { transform: translateX(-100%); }
        .prow { align-items: center; padding: 8px 12px 9px 10px; text-decoration: none; transition: background-color 150ms; }
        .prow + .prow { border-top: 1px solid #1f2d3b; }
        .prow:hover { background: #202d39; }
        .prow > img, .prow > .trow-ph { width: 32px; height: 32px; }
        .prow-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .ptrack { position: relative; height: 8px; border-radius: 2px; background:
                  linear-gradient(90deg, transparent calc(25% - 0.5px), #22344a calc(25% - 0.5px), #22344a calc(25% + 0.5px), transparent calc(25% + 0.5px),
                                         transparent calc(50% - 0.5px), #22344a calc(50% - 0.5px), #22344a calc(50% + 0.5px), transparent calc(50% + 0.5px),
                                         transparent calc(75% - 0.5px), #22344a calc(75% - 0.5px), #22344a calc(75% + 0.5px), transparent calc(75% + 0.5px)), #131c26; }
        .ptrack i { position: absolute; top: 0; bottom: 0; min-width: 2px; border-radius: 1px; }
        .ptrack i.approx { opacity: 0.55; background-image: repeating-linear-gradient(135deg, transparent 0 2px, rgba(0,0,0,0.35) 2px 4px) !important; }
        .prow-end { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
        .prow-end b { font-size: 12.5px; font-weight: 600; color: #c6d4df; white-space: nowrap; font-variant-numeric: tabular-nums; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#171a21]">
    <div id="root"></div>
    <script type="text/babel" data-type="module" src="./app.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/gaming-hub/sw.js', { scope: '/gaming-hub/' });</script>
    <script src="../assets/mobile-nav.js"></script>
</body>
</html>
