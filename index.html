<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title id="page-title">Gaming Hub</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./assets/motion.css">
  <link rel="stylesheet" href="./assets/ui.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background-color: #171a21; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

    @keyframes shimmer {
      0%   { background-position: -800px 0; }
      100% { background-position:  800px 0; }
    }
    /* Content fades in as it replaces the skeletons: innerHTML inserts new nodes, which
       replays the animation (keyframes in assets/motion.css) */
    #ra-stats > *, #steam-stats > *, #xbox-stats > *, #hub-totals > *,
    #ra-recent > *, #steam-recent > *, #xbox-recent > *,
    #activity-feed > *, #playing-list > *, #completions-strip-latest > *, #completions-strip-stats > *, #analytics-strip-stats > *, #header-tags > * {
      animation: motion-fade 200ms ease-out backwards;
    }
    .hub-plats { display: inline-flex; align-items: center; }
    .hub-plats img { width: 16px; height: 16px; padding: 2px; object-fit: contain; border-radius: 50%; background: #15202b; border: 1px solid #253a4e; }
    .hub-plats img + img { margin-left: -4px; }
    #completions-strip, #analytics-strip, #activity-section, #activity-toggle-btn, #playing-more {
      animation: motion-fade 200ms ease-out backwards;
    }
    @media (prefers-reduced-motion: reduce) {
      #completions-strip, #analytics-strip, #activity-section, #activity-toggle-btn, #playing-more { animation: none; }
      #ra-stats > *, #steam-stats > *, #xbox-stats > *, #hub-totals > *,
      #ra-recent > *, #steam-recent > *, #xbox-recent > *,
      #activity-feed > *, #playing-list > *, #completions-strip-latest > *, #completions-strip-stats > *, #analytics-strip-stats > *, #header-tags > * { animation: none; }
    }

    .skeleton {
      background: linear-gradient(90deg, #1b2838 25%, #2a3f52 50%, #1b2838 75%);
      background-size: 800px 100%;
      animation: shimmer 1.6s infinite linear;
      border-radius: 2px;
      display: inline-block;
    }

    /* Platform strip: one cell per platform. Phone: a row of icon, three numbers, chevron.
       Desktop: cells side by side, name on top, the three latest covers below the numbers. */
    .pstrip { display: grid; grid-template-columns: var(--platform-cols, repeat(3, 1fr)); background: #1b2838; border: 1px solid #2a475e; border-radius: 2px; overflow: hidden; }
    .pcell { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; text-decoration: none; transition: background-color 0.15s; }
    .pcell + .pcell { border-left: 1px solid #22344a; }
    .pcell:hover { background: #202d39; }
    .pcell:hover .pc-chev { color: #66c0f4; }
    .pc-head { display: flex; align-items: center; gap: 8px; }
    .pc-icon { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
    .pc-name { font-size: 13px; font-weight: 600; color: #fff; flex: 1; min-width: 0; }
    .pc-chev { color: #546270; flex-shrink: 0; margin-left: auto; transition: color 0.15s; }
    .pc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-val { font-size: 16px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: 11px; color: #8f98a0; margin-top: 1px; }
    .pc-covers { display: flex; gap: 5px; height: 26px; }
    .pc-covers img { height: 26px; border-radius: 2px; border: 1px solid #101214; background: #2a475e; object-fit: cover; }
    .pc-covers img.sq { width: 26px; }
    .pc-covers img.px { image-rendering: pixelated; }
    @media (max-width: 767px) {
      .pstrip { grid-template-columns: 1fr !important; }
      .pcell { display: grid; grid-template-columns: 30px 1fr 14px; align-items: center; column-gap: 12px; padding: 12px 14px; }
      .pcell + .pcell { border-left: none; border-top: 1px solid #22344a; }
      .pc-head { display: contents; }
      .pc-icon { grid-column: 1; grid-row: 1; width: 28px; height: 28px; }
      .pc-name, .pc-covers { display: none; }
      .pc-chev { grid-column: 3; grid-row: 1; }
      .pc-stats { grid-column: 2; grid-row: 1; }
    }

    /* Genre tags */
    .tag { flex-shrink: 0; white-space: nowrap; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 3px 7px; border-radius: 2px; border: 1px solid; display: inline-block; text-shadow: none; }
    /* Analytics strip body: a row on tablets (numbers, the 30 days, top game), stacked in the rail */
    #analytics-strip-stats { display: flex; align-items: center; gap: 16px; }
    .ast-nums { display: flex; gap: 18px; flex-shrink: 0; }
    .ast-nums > div { display: flex; flex-direction: column; }
    .ast-nums b { font-size: 20px; line-height: 1.15; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
    .ast-nums span { font-size: 10.5px; color: #8f98a0; white-space: nowrap; }
    .ast-d { font-style: normal; font-weight: 600; color: #8f98a0; margin-left: 2px; }
    .ast-d.up { color: #8fbf6a; } .ast-d.down { color: #c87a6a; }
    .ast-spark { flex: 1; min-width: 80px; height: 30px; display: flex; align-items: flex-end; gap: 2px; }
    .ast-spark > span { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px;
      background: linear-gradient(to top, #2a3a4c 0 1px, transparent 1px); }
    .ast-spark i { display: block; min-height: 2px; border-radius: 1px 1px 0 0; }
    .ast-spark i + i { border-radius: 0; }
    .ast-parts { display: none; flex-direction: column; gap: 5px; }
    .ast-pbar { display: flex; gap: 2px; height: 8px; }
    .ast-pbar i { min-width: 3px; }
    .ast-pbar i:first-child { border-radius: 2px 0 0 2px; } .ast-pbar i:last-child { border-radius: 0 2px 2px 0; }
    .ast-parts > span { font-size: 10.5px; color: #8f98a0; } .ast-parts b { color: #fff; font-weight: 600; }
    .ast-top { display: flex; align-items: center; gap: 9px; min-width: 0; max-width: 220px; }
    .ast-top > img, .ast-top > span:first-child { width: 28px; height: 28px; flex-shrink: 0; border-radius: 2px; object-fit: cover; border: 1px solid #101214; background: #2a475e; }
    .ast-top-t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .ast-top-t > span { font-size: 10px; color: #546270; }
    .ast-top-t > b { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ast-top-v { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
    .ast-top-v b { font-size: 12px; color: #c6d4df; font-weight: 600; } .ast-top-v span { font-size: 10px; color: #546270; }
    .ast-none { font-size: 11px; color: #546270; }

    .tag-blue { color: #66c0f4; border-color: rgba(102,192,244,0.35); background: rgba(16,18,20,0.65); }
    .tag-grey { color: #8f98a0; border-color: rgba(143,152,160,0.3); background: rgba(16,18,20,0.65); }

    /* Mobile: flatten platform cards to header + stats only */
    @media (max-width: 767px) {
      #completions-strip, #analytics-strip { display: none !important; }
      .activity-view-all { display: none !important; }

      /* Activity feed collapse */
      .activity-row-hidden { display: none !important; }
    }

    /* Recent activity: one row per game per day, under a day label */
    .aday { padding: 6px 12px 5px; font-size: 11px; font-weight: 600; color: #8f98a0; background: #172333; border-bottom: 1px solid #22344a; }
    .aday:not(:first-child) { border-top: 1px solid #22344a; }
    .arow { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px 10px 10px; border-left: 3px solid; text-decoration: none; transition: background-color 150ms; }
    .arow + .arow { border-top: 1px solid #1a2535; }
    .arow:hover { background: #1e2d3a; }
    .arow.done { background: linear-gradient(90deg, rgba(229,177,67,0.09), rgba(229,177,67,0) 60%); }
    .aicon { width: 40px; height: 40px; flex-shrink: 0; border-radius: 2px; border: 1px solid #101214; background: #101214; object-fit: cover; image-rendering: pixelated; }
    .amain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .atitle { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .atitle .t { min-width: 0; font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .atitle .when { margin-left: auto; padding-left: 6px; flex-shrink: 0; font-size: 11px; color: #546270; font-variant-numeric: tabular-nums; }
    .atag { flex-shrink: 0; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 1px 4px; border: 1px solid; border-radius: 2px; }
    .asubset { flex-shrink: 1; min-width: 0; font-size: 11px; color: #c8a84b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .asub { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8f98a0; white-space: nowrap; }
    .asub img { width: 12px; height: 12px; object-fit: contain; }
    .asub .n { color: #e5b143; }
    .asub i { font-style: normal; color: #3d5060; }
    .astrip { display: flex; align-items: center; gap: 3px; min-width: 0; margin-top: 2px; }
    .astrip img { width: 22px; height: 22px; flex-shrink: 0; border-radius: 2px; border: 1px solid #101214; background: #101214; object-fit: cover; }
    .astrip .more { flex-shrink: 0; font-size: 10px; color: #8f98a0; padding: 0 2px; }
    .astrip .last { min-width: 0; margin-left: 5px; font-size: 11px; color: #c6d4df; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Header icon buttons after "Last change" */
    .hub-sub { display: flex; align-items: center; flex-wrap: wrap; }   /* text and icons centred on each other */
    /* The text box trimmed to its letters (cap height to baseline), so centring uses the visible text, not the
       descender space under it; browsers without text-box keep the plain box centre */
    .hub-sub > span:first-child { text-box: trim-both cap alphabetic; }
    .hub-icons { display: flex; align-items: center; gap: 2px; margin-left: 6px; }
    .hub-icons > * { display: inline-flex; padding: 6px; margin: -6px 0; border-radius: 50%; color: #c6d4df; transition: color 150ms, background-color 150ms; }
    .hub-icons > *:hover { color: #66c0f4; background: rgba(16, 18, 20, 0.5); }
    .hub-icons > .spin svg { animation: hub-spin 700ms linear infinite; }
    @keyframes hub-spin { to { transform: rotate(360deg); } }
    @media (min-width: 768px) { .hub-icons > .md\:hidden { display: none; } }

    /* Hub series cards (.scard in assets/ui.css): phone 3 without the icon strip, desktop 4 in two columns */
    #series-list > * { animation: motion-fade 220ms ease-out backwards; }
    @media (max-width: 767px) {
      .hub-slist .sicons { display: none; }
      .hub-slist .hub-desk { display: none; }
    }

    #activity-toggle-btn {
      display: none; /* shown by JS only on mobile after feed loads */
      width: 100%;
      padding: 7px 14px;
      background: #1b2838;
      border: none;
      border-top: 1px solid #2a475e;
      color: #8f98a0;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #activity-toggle-btn:active { background: #202d39; }

    /* Wide screens: main column + rail */
    @media (min-width: 1024px) {
      .hub-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto auto 1fr; column-gap: 28px; }
      #playing-section { grid-column: 1; grid-row: 1; }
      #series-section { grid-column: 1; grid-row: 2; }
      #activity-section { grid-column: 1; grid-row: 3; align-self: start; }
      #activity-section > :first-child { margin-top: 0; }
      .hub-rail { grid-column: 2; grid-row: 1 / span 3; align-self: start; }
      /* Platforms stacked: name, numbers, latest covers */
      .hub-rail .pstrip { grid-template-columns: 1fr !important; }
      .hub-rail .pcell + .pcell { border-left: none; border-top: 1px solid #22344a; }
      /* Completions and Analytics become cards: title row, then their lines */
      .hub-rail #completions-strip, .hub-rail #analytics-strip { flex-wrap: wrap; row-gap: 10px; margin-top: 12px; padding: 12px 14px; }
      .hub-rail #completions-strip > .w-px, .hub-rail #analytics-strip > .w-px { display: none !important; }
      .hub-rail #completions-strip > :last-child, .hub-rail #analytics-strip > :last-child { order: 1; }
      #completions-strip-stats, #analytics-strip-stats { order: 2; flex-basis: 100%; }
      #completions-strip-latest { order: 3; flex-basis: 100%; padding-top: 10px; border-top: 1px solid #22344a; }
      #completions-strip-latest > img { width: 32px !important; height: 32px !important; }
      /* Analytics in the rail: numbers, the 30 days, time of day and the top game stacked */
      #analytics-strip-stats { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
      #analytics-strip-stats .ast-spark { flex: none; height: 34px; }
      #analytics-strip-stats .ast-parts { display: flex; }
      #analytics-strip-stats .ast-top { padding-top: 10px; border-top: 1px solid #22344a; max-width: none; }
    }
  </style>
</head>
<body class="bg-[#171a21] text-[#c6d4df] min-h-screen flex flex-col">

  <!-- Topbar -->
  <div class="page-topbar sticky top-0 z-50 bg-[#131a22] border-b border-[#101214] px-4 md:px-8 py-1.5 flex items-center gap-2 text-[10px]">
    <span id="topbar-username" class="text-[#546270] font-bold tracking-[0.15em] uppercase"></span>
    <span class="text-[#2a475e]">›</span>
    <span class="text-[#c6d4df]">Gaming Hub</span>
  </div>

  <!-- Header -->
  <!-- Header: same pattern as the profile headers (assets/ui.css .phead); the latest played game's
       art (RA or Steam, whichever is newer) fades in behind it once the stats load -->
  <header class="phead">
    <div id="hub-art" class="art-bg art-header"></div>
    <div class="phead-in art-shadow">
      <div class="phead-main">
        <div class="phead-top">
          <div class="phead-av"><img id="avatar-img" src="./assets/avatar.png" alt="" /></div>
          <div class="phead-id">
            <div class="phead-name"><h1 id="header-username"><span class="skeleton" style="width:150px;height:22px"></span></h1></div>
            <div class="phead-sub hub-sub"><span>Last change <b id="hub-updated" class="text-[#c6d4df]"><span class="skeleton align-middle" style="width:72px;height:10px"></span></b></span>
              <!-- The changelog has no bottom-nav tab, and the footer is hidden on mobile -->
              <!-- Icon buttons: Changelog (phone only, the footer has it on desktop) and Refresh app (fetches
                   the latest app files, data untouched). Padded to a finger-sized target -->
              <span class="hub-icons">
                <a href="./changelog/" class="md:hidden" aria-label="Changelog" title="Changelog"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg></a>
                <button id="refresh-app-btn" type="button" aria-label="Refresh app" title="Refresh app: fetch the latest app files. Your data is not affected."><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
              </span>
            </div>
          </div>
        </div>
        <p id="header-motto" class="phead-motto"><span class="skeleton align-middle" style="width:220px;height:10px"></span></p>
        <!-- Genre tags: one row that scrolls sideways -->
        <div id="header-tags" class="phead-tags"></div>
      </div>
      <!-- Totals across platforms, filled in by the three stat loaders (fillHubTotals) -->
      <div class="phead-side">
        <div id="hub-totals" class="phead-stats">
          <div class="phead-stat"><b><span class="skeleton" style="width:56px;height:18px"></span></b><span>Hours played</span></div>
          <div class="phead-stat"><b><span class="skeleton" style="width:48px;height:18px"></span></b><span>Unlocks</span></div>
          <div class="phead-stat"><b><span class="skeleton" style="width:28px;height:18px"></span></b><span>Completed</span></div>
        </div>
        <div class="phead-meta crits" style="justify-content:flex-end"><span class="crit"><img src="./assets/icon-ra.png" alt="">RetroAchievements</span><span class="crit"><img src="./assets/icon-steam.png" alt="">Steam</span><span class="crit"><img src="./assets/icon-xbox.png" alt="">Xbox</span></div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-5xl lg:max-w-[79rem] mx-auto px-4 md:px-8 py-6 flex-1 w-full">
    <!-- Wide screens: Playing and Recent activity on the left, a rail with platforms, Completions and
         Analytics on the right (.hub-grid). Phone and tablet: one column in this order -->
    <div class="hub-grid">

    <!-- Playing: the most recent games in rotation (assets/playing.js). First on the page: it's what
         you open the app for. The full tiles with stats, On hold and Drifting live in Activity's Playing view -->
    <div id="playing-section" class="mb-8">
    <div class="flex items-center gap-2 border-b border-[#2a475e] pb-[7px] mb-4">
      <span class="w-[3px] h-[14px] bg-[#66c0f4] rounded-[1px] flex-shrink-0"></span>
      <span class="text-[13px] text-white uppercase tracking-[0.1em] font-semibold">Playing</span>
      <a href="./activity/?view=playing" class="ml-auto flex p-1 -m-1 text-[#546270] hover:text-[#66c0f4] transition-colors" aria-label="All games in rotation" title="All games in rotation"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
    </div>
    <!-- Top 4 Playing games as tiles: 2×2 on a phone, one row on desktop -->
    <div id="playing-list" class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-2.5">
      <div class="flex flex-col bg-[#1b2838] border border-[#2a475e] rounded-[2px] overflow-hidden">
        <div class="skeleton" style="aspect-ratio:460/215;border-radius:0"></div>
        <div class="flex flex-col gap-2 p-2"><div class="skeleton h-2.5 rounded" style="width:70%"></div><div class="skeleton h-1 rounded"></div><div class="skeleton rounded" style="height:9px"></div></div>
      </div>
      <div class="flex flex-col bg-[#1b2838] border border-[#2a475e] rounded-[2px] overflow-hidden">
        <div class="skeleton" style="aspect-ratio:460/215;border-radius:0"></div>
        <div class="flex flex-col gap-2 p-2"><div class="skeleton h-2.5 rounded" style="width:55%"></div><div class="skeleton h-1 rounded"></div><div class="skeleton rounded" style="height:9px"></div></div>
      </div>
      <div class="flex flex-col bg-[#1b2838] border border-[#2a475e] rounded-[2px] overflow-hidden">
        <div class="skeleton" style="aspect-ratio:460/215;border-radius:0"></div>
        <div class="flex flex-col gap-2 p-2"><div class="skeleton h-2.5 rounded" style="width:80%"></div><div class="skeleton h-1 rounded"></div><div class="skeleton rounded" style="height:9px"></div></div>
      </div>
      <div class="flex flex-col bg-[#1b2838] border border-[#2a475e] rounded-[2px] overflow-hidden">
        <div class="skeleton" style="aspect-ratio:460/215;border-radius:0"></div>
        <div class="flex flex-col gap-2 p-2"><div class="skeleton h-2.5 rounded" style="width:60%"></div><div class="skeleton h-1 rounded"></div><div class="skeleton rounded" style="height:9px"></div></div>
      </div>
    </div>
    <a id="playing-more" href="./activity/?view=playing" style="display:none;"
      class="flex items-center gap-2 mt-2 px-3 py-2 text-[10px] text-[#546270] bg-[#172333] border border-[#2a475e] rounded-[2px] hover:text-[#66c0f4] transition-colors"></a>
    </div><!-- /playing-section -->

    <!-- Series across platforms (data/hub/series.json, admin Shared Series): the most recently active ones;
         one column on a phone (no icon strip), two on desktop. Each card opens its sheet on series/ -->
    <div id="series-section" class="mb-8">
    <div class="flex items-center gap-2 border-b border-[#2a475e] pb-[7px] mb-4">
      <span class="w-[3px] h-[14px] bg-[#66c0f4] rounded-[1px] flex-shrink-0"></span>
      <span class="text-[13px] text-white uppercase tracking-[0.1em] font-semibold">Series</span>
      <a href="./series/" class="ml-auto flex p-1 -m-1 text-[#546270] hover:text-[#66c0f4] transition-colors" aria-label="All series" title="All series"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
    </div>
    <div id="series-list" class="slist hub-slist">
      <span class="scard" style="border-left-color:#2a475e;"><span class="skeleton block h-[48px] rounded"></span><span class="skeleton block h-[5px] rounded"></span></span>
      <span class="scard" style="border-left-color:#2a475e;"><span class="skeleton block h-[48px] rounded"></span><span class="skeleton block h-[5px] rounded"></span></span>
      <span class="scard hub-desk" style="border-left-color:#2a475e;"><span class="skeleton block h-[48px] rounded"></span><span class="skeleton block h-[5px] rounded"></span></span>
    </div>
    <a id="series-more" href="./series/" style="display:none;"
      class="flex items-center gap-2 mt-2 px-3 py-2 text-[10px] text-[#546270] bg-[#172333] border border-[#2a475e] rounded-[2px] hover:text-[#66c0f4] transition-colors"></a>

  <script>
    // Times are stored in UTC. RA uses "YYYY-MM-DD HH:MM:SS" with no zone marker (a bare
    // string like that parses as local time, and Safari rejects it); Steam/Xbox use ISO.
    // Same parsing as assets/time.js, which this classic script can't import.
    // Header art: the most recently played game across RA and Steam; each loader offers its latest
    // game and the newer one wins. Tries each URL in turn, fades in once loaded (assets/ui.css .art-bg)
    // Header totals: each platform loader reports { minutes, unlocks, completed }; the strip fills in
    // once all three have answered (a failed platform reports zeros, so the totals still show)
    const hubTotals = {};
    function reportHubTotals(platform, t) {
      hubTotals[platform] = t;
      if (!['ra', 'steam', 'xbox'].every(p => hubTotals[p])) return;
      const sum = k => Object.values(hubTotals).reduce((n, x) => n + (x[k] || 0), 0);
      const hrs = Math.round(sum('minutes') / 60);
      document.getElementById('hub-totals').innerHTML = [
        [hrs >= 10000 ? `${(hrs / 1000).toFixed(1)}k` : hrs.toLocaleString(), 'Hours played', '#66c0f4'],
        [sum('unlocks').toLocaleString(), 'Unlocks', '#66c0f4'],
        [sum('completed').toLocaleString(), 'Completed', '#e5b143'],
      ].map(([v, l, c]) => `<div class="phead-stat"><b style="color:${c}">${v}</b><span>${l}</span></div>`).join('');
    }

    let headerArtTs = 0;
    function offerHeaderArt(ts, urls, isIcon) {
      const t = toDate(ts).getTime();
      if (!t || t <= headerArtTs || !urls.filter(Boolean).length) return;
      headerArtTs = t;
      const box = document.getElementById('hub-art');
      const img = new Image();
      const list = urls.filter(Boolean);
      img.alt = '';
      if (isIcon) img.className = 'px art-icon';
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => { list.shift(); if (list.length) img.src = list[0]; else img.remove(); };
      img.src = list[0];
      box.replaceChildren(img);
    }
    const toDate = (s) => new Date(typeof s === 'string' && /^\d{4}-\d{2}-\d{2} \d/.test(s) ? s.replace(' ', 'T') + 'Z' : s);
    // Whole calendar days between a timestamp and today, in the viewer's timezone
    const daysAgo = (s) => {
      const d = toDate(s), n = new Date();
      return Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    };

    // Shared title parser + badge helpers (used by RA card, activity feed, and completions strip)
    const _TILDE_COLORS = {
      'Homebrew':  { bg: 'rgba(102,192,244,0.08)', border: 'rgba(102,192,244,0.3)',  color: '#66c0f4' },
      'Demo':      { bg: 'rgba(87,203,222,0.08)',  border: 'rgba(87,203,222,0.3)',   color: '#57cbde' },
      'Prototype': { bg: 'rgba(143,152,160,0.08)', border: 'rgba(143,152,160,0.3)',  color: '#8f98a0' },
      'Hack':      { bg: 'rgba(255,107,107,0.08)', border: 'rgba(255,107,107,0.3)',  color: '#ff6b6b' },
    };
    const _BADGE_BASE = 'font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;padding:1px 4px;border-radius:2px;flex-shrink:0;';
    const _parseTitle = (title) => {
      if (!title) return { baseTitle: title, subsetName: null, isSubset: false, tags: [] };
      const tags = [];
      const withoutTags = title.replace(/~([^~]+)~\s*/g, (_, tag) => { tags.push(tag); return ''; }).trim();
      const subsetMatch = withoutTags.match(/^(.+?)\s*\[Subset\s*[-–]\s*(.+?)\]$/);
      if (subsetMatch) return { baseTitle: subsetMatch[1].trim(), subsetName: subsetMatch[2].trim(), isSubset: true, tags };
      return { baseTitle: withoutTags, subsetName: null, isSubset: false, tags };
    };
    const _tildeBadgesHtml = (tags) => tags.map(tag => {
      const s = _TILDE_COLORS[tag] || _TILDE_COLORS['Prototype'];
      return `<span style="${_BADGE_BASE}border:1px solid ${s.border};background:${s.bg};color:${s.color};">${tag}</span>`;
    }).join(' ');

    // Replaces a skeleton with text and fades it in (text nodes can't match the `#x > *` fade rules)
    const setText = (id, text) => { const el = document.getElementById(id); el.textContent = text; el.classList.add('anim-fade'); };

    // One request per URL, shared by the activity feed and the Analytics strip; null when missing
    const _jsonCache = {};
    const fetchJsonOnce = (url) => (_jsonCache[url] ??= fetch(url).then(r => r.ok ? r.json() : null).catch(() => null));

    async function loadHubProfile() {
      try {
        const res = await fetch('./data/hub/config.json');
        if (!res.ok) throw new Error('not found');
        const p = await res.json();

        const username = p.username ?? '';
        document.title = `${username} · Gaming Hub`;
        setText('topbar-username', username);
        setText('header-username', username);
        document.getElementById('avatar-img').alt = username;
        setText('header-motto', `"${p.motto ?? ''}"`);

        const tagsEl = document.getElementById('header-tags');
        const genreTags = (p.tags?.genre ?? []).map(t => `<span class="tag tag-blue">${t}</span>`);
        const styleTags = (p.tags?.style ?? []).map(t => `<span class="tag tag-grey">${t}</span>`);
        tagsEl.innerHTML = [...genreTags, ...styleTags].join('');

        // Show/hide platform cards based on visible flag
        const platformMap = p.platforms ?? {};
        for (const [key, cfg] of Object.entries(platformMap)) {
          const el = document.getElementById(`card-${key}`);
          if (el) el.style.display = cfg.visible ? '' : 'none';
        }

        // Fewer columns when fewer than 3 platforms are visible
        const visibleCount = Object.values(platformMap).filter(c => c.visible).length;
        const strip = document.querySelector('.pstrip');
        if (strip && visibleCount < 3) {
          strip.classList.add('anim-fade');   // the strip re-flows once config arrives
          strip.style.setProperty('--platform-cols', `repeat(${Math.max(visibleCount, 1)}, 1fr)`);
        }
        setText('footer-site-url', p.siteUrl ?? '');

        // Activity section
        if (p.activity?.visible !== false) {
          document.getElementById('activity-section').style.display = '';
          loadActivityFeed();
        }

        // Completions strip
        // Both strips show at once with skeletons (so nothing below jumps when they fill) and
        // hide again if they have nothing to show
        if (p.completions?.visible !== false) {
          document.getElementById('completions-strip').style.display = '';
          loadCompletionsStrip();
        }
        document.getElementById('analytics-strip').style.display = '';
        loadAnalyticsStrip();
      } catch (e) {
        console.warn('Could not load hub profile:', e);
      }
    }

    // Platform strip: three headline numbers and the three latest covers per platform
    const statCells = cells => cells.map(([val, label, color]) =>
      `<div><div class="stat-val" style="color:${color};">${val}</div><div class="stat-lbl">${label}</div></div>`).join('');
    const statError = '<div style="grid-column:span 3;font-size:11px;color:#546270;">Could not load stats</div>';
    const escAttr = str => String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const coverImg = (src, title, cls = '') =>
      `<img src="${src}" alt="" title="${escAttr(title)}" class="${cls}" loading="lazy" onerror="this.removeAttribute('src')" />`;

    async function loadRAStats() {
      try {
        const d = await fetchJsonOnce('./data/ra/profile.json');
        if (!d) throw new Error('not found');

        // Timestamp
        const ts = d.metadata?.extractionTimestamp;
        if (ts) {
          setText('hub-updated', new Date(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }));
        }

        // Stats
        const totalPoints  = d.coreProfile?.totalPoints ?? 0;
        const results      = d.gameAwardsAndProgress?.results ?? [];
        const mastered     = results.filter(g => g.highestAwardKind === 'mastered').length;
        const achievements = results.reduce((sum, g) => sum + (g.numAwarded ?? 0), 0);
        reportHubTotals('ra', { minutes: results.reduce((sum, g) => sum + (g.playtime ?? 0), 0), unlocks: achievements, completed: mastered });
        document.getElementById('ra-stats').innerHTML = statCells([
          [totalPoints.toLocaleString(), 'Points', '#e5b143'],
          [mastered, 'Mastered', '#e5b143'],
          [achievements.toLocaleString(), 'Unlocks', '#66c0f4'],
        ]);

        // Latest covers (desktop) — pipeline pre-sorts recentlyPlayedGames
        const MEDIA = 'https://media.retroachievements.org';
        const latestRA = (d.recentlyPlayedGames ?? [])[0];
        if (latestRA) {
          // RA's "no image" placeholder counts as no screenshot: use the icon, zoomed and blurred
          const shot = [latestRA.imageIngame, latestRA.imageTitle].find(x => x && !x.endsWith('/Images/000002.png'));
          // Wide art picked in the admin (data/ra/art.json): its hero (else banner), like the RA profile header
          const wide = (await fetchJsonOnce('./data/ra/art.json'))?.games?.[latestRA.gameId];
          if (wide?.grid) offerHeaderArt(latestRA.lastPlayed, [wide.hero?.url, wide.grid.url, shot && MEDIA + shot], false);
          else offerHeaderArt(latestRA.lastPlayed, [shot ? MEDIA + shot : MEDIA + latestRA.imageIcon], !shot);
        }
        document.getElementById('ra-recent').innerHTML = (d.recentlyPlayedGames ?? []).slice(0, 3)
          .map(g => coverImg(`${MEDIA}${g.imageIcon}`, `${g.title} · ${g.consoleName}`, 'sq px')).join('');

      } catch (e) {
        setText('hub-updated', 'unavailable');
        reportHubTotals('ra', { minutes: 0, unlocks: 0, completed: 0 });
        document.getElementById('ra-stats').innerHTML = statError;
        document.getElementById('ra-recent').innerHTML = '';
      }
    }

    // Xbox images are full-size originals; resize on request (images-eds only accepts certain widths)
    const EDS_WIDTHS = [64, 128, 150, 200, 208, 300, 424];
    const xboxImg = (url, width) => {
        if (!url) return url;
        if (url.includes('store-images.s-microsoft.com')) return `${url}${url.includes('?') ? '&' : '?'}w=${width}`;
        if (url.includes('images-eds')) return `${url}&w=${EDS_WIDTHS.find(w => w >= width) ?? 424}`;
        return url;
    };

    async function loadSteamStats() {
      try {
        const d = await fetchJsonOnce('./data/steam/profile.json');
        if (!d) throw new Error('not found');

        const fmtHrs = (min) => {
          const h = Math.floor(min / 60);
          return h >= 1000 ? `${(h/1000).toFixed(1)}k` : h.toLocaleString();
        };

        const s = d.stats ?? {};
        reportHubTotals('steam', { minutes: s.totalPlaytimeMin ?? 0, unlocks: s.unlockedAchievements ?? 0, completed: s.perfectCount ?? 0 });
        document.getElementById('steam-stats').innerHTML = statCells([
          [fmtHrs(s.totalPlaytimeMin ?? 0), 'Hours', '#66c0f4'],
          [(s.perfectCount ?? 0).toLocaleString(), 'Perfect', '#e5b143'],
          [(s.unlockedAchievements ?? 0).toLocaleString(), 'Unlocks', '#66c0f4'],
        ]);

        const latestSteam = (d.recentlyPlayed ?? [])[0];
        if (latestSteam?.lastPlayedTs) offerHeaderArt(latestSteam.lastPlayedTs, [
          `https://cdn.akamai.steamstatic.com/steam/apps/${latestSteam.appId}/library_hero.jpg`,
          `https://cdn.akamai.steamstatic.com/steam/apps/${latestSteam.appId}/header.jpg`,
        ], false);

        document.getElementById('steam-recent').innerHTML = (d.recentlyPlayed ?? []).slice(0, 3)
          .map(g => coverImg(`https://cdn.akamai.steamstatic.com/steam/apps/${g.appId}/header.jpg`, g.name)).join('');

      } catch (e) {
        reportHubTotals('steam', { minutes: 0, unlocks: 0, completed: 0 });
        document.getElementById('steam-stats').innerHTML = statError;
        document.getElementById('steam-recent').innerHTML = '';
      }
    }

    async function loadXboxStats() {
      try {
        const d = await fetchJsonOnce('./data/xbox/profile.json');
        if (!d) throw new Error('not found');

        const s = d.stats ?? {};
        reportHubTotals('xbox', { minutes: 0, unlocks: s.unlockedAchievements ?? 0, completed: s.perfectCount ?? 0 });
        document.getElementById('xbox-stats').innerHTML = statCells([
          [(s.gamerscore ?? 0).toLocaleString(), 'Gamerscore', '#e5b143'],
          [(s.perfectCount ?? 0).toLocaleString(), 'Completed', '#e5b143'],
          [(s.unlockedAchievements ?? 0).toLocaleString(), 'Unlocks', '#66c0f4'],
        ]);

        document.getElementById('xbox-recent').innerHTML = (d.recentlyPlayed ?? []).slice(0, 3)
          .map(g => coverImg(xboxImg(g.iconUrl, 64) || '', g.name, 'sq')).join('');

      } catch (e) {
        reportHubTotals('xbox', { minutes: 0, unlocks: 0, completed: 0 });
        document.getElementById('xbox-stats').innerHTML = statError;
        document.getElementById('xbox-recent').innerHTML = '';
      }
    }

    let _activityExpanded = false;
    function toggleActivityFeed() {
      _activityExpanded = !_activityExpanded;
      const extras = document.querySelectorAll('[data-activity-extra]');
      const btn = document.getElementById('activity-toggle-btn');
      extras.forEach(el => el.classList.toggle('activity-row-hidden', !_activityExpanded));
      btn.textContent = _activityExpanded ? 'Show less' : 'Show more';
    }

    async function loadActivityFeed() {
      const RA_MEDIA = 'https://media.retroachievements.org';

      const TILDE_TAG_COLORS = {
        'Homebrew':  { bg: 'rgba(102,192,244,0.08)', border: 'rgba(102,192,244,0.3)',  color: '#66c0f4' },
        'Demo':      { bg: 'rgba(87,203,222,0.08)',  border: 'rgba(87,203,222,0.3)',   color: '#57cbde' },
        'Prototype': { bg: 'rgba(143,152,160,0.08)', border: 'rgba(143,152,160,0.3)',  color: '#8f98a0' },
        'Hack':      { bg: 'rgba(255,107,107,0.08)', border: 'rgba(255,107,107,0.3)',  color: '#ff6b6b' },
      };

      const parseTitle = (title) => {
        if (!title) return { baseTitle: title, subsetName: null, isSubset: false, tags: [] };
        const tags = [];
        const withoutTags = title.replace(/~([^~]+)~\s*/g, (_, tag) => { tags.push(tag); return ''; }).trim();
        const subsetMatch = withoutTags.match(/^(.+?)\s*\[Subset\s*[-–]\s*(.+?)\]$/);
        if (subsetMatch) return { baseTitle: subsetMatch[1].trim(), subsetName: subsetMatch[2].trim(), isSubset: true, tags };
        return { baseTitle: withoutTags, subsetName: null, isSubset: false, tags };
      };

      const timeAgo = (iso) => {
        const ms   = Date.now() - toDate(iso).getTime();
        const mins = Math.floor(ms / 60000);
        const hrs  = Math.floor(ms / 3600000);
        const days = Math.floor(ms / 86400000);
        if (mins < 1)   return 'just now';
        if (hrs  < 1)   return `${mins}m ago`;
        if (hrs  < 24)  return `${hrs}h ago`;
        if (days === 1) return 'yesterday';
        if (days < 7)   return `${days}d ago`;
        if (days < 30)  return `${Math.floor(days / 7)}w ago`;
        return `${Math.floor(days / 30)}mo ago`;
      };

      // One row per game per local day: play time (RA, Steam sessions) + the unlocks of that day,
      // and a completion tag when the game was mastered / beaten / perfected that day
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const localKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
      const dayLabel = (key) => {
        const now = new Date();
        if (key === localKey(now.getTime())) return 'Today';
        if (key === localKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1).getTime())) return 'Yesterday';
        const [y, m, d] = key.split('-').map(Number);
        const date = new Date(y, m - 1, d);
        return date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', ...(y !== now.getFullYear() ? { year: 'numeric' } : {}) });
      };
      const clock = (ms) => { const d = new Date(ms); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
      const fmtMin = (m) => m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ` ${String(m % 60).padStart(2, '0')}m` : ''}`;
      const ROWS = 6, PHONE_ROWS = 4;
      const PLATFORM = {
        ra:    { color: '#e5b143', icon: './assets/icon-ra.png',    url: id => `https://retroachievements.org/game/${id}` },
        steam: { color: '#66c0f4', icon: './assets/icon-steam.png', url: id => `https://store.steampowered.com/app/${id}` },
        xbox:  { color: '#52b043', icon: './assets/icon-xbox.png',  url: (id, name) => `https://www.xbox.com/en-US/Search/Results?q=${encodeURIComponent(name)}` },
      };

      try {
        const now = new Date();
        const years = [...new Set([now.getFullYear() - 1, now.getFullYear()])].filter(y => y === now.getFullYear() || now.getMonth() < 3);
        const [raProfile, steamProfile, xboxProfile, ...playFiles] = await Promise.all([
          fetchJsonOnce('./data/ra/profile.json'),
          fetchJsonOnce('./data/steam/profile.json'),
          fetchJsonOnce('./data/xbox/profile.json'),
          ...['ra', 'steam'].flatMap(p => years.map(y => fetchJsonOnce(`./data/${p}/playtime/${y}.json`).then(f => ({ p, f })))),
        ]);

        const games = { ra: {}, steam: {}, xbox: {} };
        for (const { p, f } of playFiles) for (const [id, g] of Object.entries(f?.games ?? {})) games[p][id] = { ...games[p][id], name: g.name, icon: g.icon ? (p === 'ra' ? RA_MEDIA + g.icon : g.icon) : null };

        const groups = new Map();
        const group = (platform, gameId, ms) => {
          const key = `${platform}:${gameId}:${localKey(ms)}`;
          if (!groups.has(key)) groups.set(key, { platform, gameId, day: localKey(ms), lastMs: 0, minutes: 0, unlocks: [], done: null });
          const g = groups.get(key); g.lastMs = Math.max(g.lastMs, ms); return g;
        };
        for (const { p, f } of playFiles) for (const s of f?.sessions ?? []) {
          const ms = Date.parse(s.end);
          if (now - ms < 91 * 86400000) group(p, String(s.gameId), ms).minutes += s.minutes;
        }

        // Unlocks: chunk 1 (91 days), older chunks only when that leaves fewer rows than shown
        const addChunk = async (i) => {
          const [ra, steam, xbox] = await Promise.all(['ra', 'steam', 'xbox'].map(p => fetchJsonOnce(`./data/${p}/achievements/${i}.json`)));
          for (const a of ra?.recentAchievements ?? []) {
            const g = group('ra', String(a.gameId), toDate(a.date).getTime());
            games.ra[a.gameId] ??= { name: a.gameTitle, icon: a.gameIcon ? RA_MEDIA + a.gameIcon : null };
            g.unlocks.push({ name: a.title, icon: `${RA_MEDIA}/Badge/${a.badgeName}.png`, ms: toDate(a.date).getTime() });
          }
          for (const a of steam?.recentAchievements ?? []) {
            const g = group('steam', String(a.appId), Date.parse(a.unlockedAt));
            games.steam[a.appId] ??= { name: a.gameName, icon: null };
            g.unlocks.push({ name: a.displayName, icon: a.iconUrl, ms: Date.parse(a.unlockedAt) });
          }
          for (const a of xbox?.recentAchievements ?? []) {
            const g = group('xbox', String(a.titleId), Date.parse(a.unlockedAt));
            games.xbox[a.titleId] ??= { name: a.gameName, icon: null };
            g.unlocks.push({ name: a.displayName, icon: xboxImg(a.iconUrl, 64), ms: Date.parse(a.unlockedAt) });
          }
        };
        await addChunk(1);
        for (let i = 2; i <= 4 && groups.size < ROWS; i++) await addChunk(i);

        // Completions on the day they happened
        const mark = (platform, gameId, iso, label, color) => {
          const g = groups.get(`${platform}:${gameId}:${localKey(Date.parse(iso))}`);
          if (g && (!g.done || label !== 'Beaten')) g.done = { label, color };
        };
        for (const a of raProfile?.pageAwards?.visibleUserAwards ?? []) {
          if (a.awardType === 'Mastery/Completion') mark('ra', a.awardData, a.awardedAt, a.awardDataExtra === 1 ? 'Mastered' : 'Completed', '#e5b143');
          else if (a.awardType === 'Game Beaten') mark('ra', a.awardData, a.awardedAt, 'Beaten', '#b8c4ce');
        }
        for (const g of steamProfile?.perfectGames ?? []) if (g.completedAt) mark('steam', g.appId, g.completedAt, 'Perfect', '#e5b143');
        for (const g of xboxProfile?.perfectGames ?? []) if (g.completedAt) mark('xbox', g.titleId, g.completedAt, 'Completed', '#e5b143');

        const rows = [...groups.values()].sort((a, b) => b.lastMs - a.lastMs).slice(0, ROWS);
        const todayKey = localKey(Date.now());
        let html = '', lastDay = null;
        rows.forEach((r, idx) => {
          const extra = idx >= PHONE_ROWS ? ' data-activity-extra="1"' : '';
          // A day header belongs to the phone's hidden part when its first row does
          if (r.day !== lastDay) { html += `<div class="aday"${extra}>${dayLabel(r.day)}</div>`; lastDay = r.day; }
          const P = PLATFORM[r.platform];
          const info = games[r.platform][r.gameId] ?? {};
          const unlocks = r.unlocks.sort((a, b) => b.ms - a.ms);
          const icon = info.icon || unlocks[0]?.icon || '';
          let title = esc(info.name), tags = '';
          if (r.platform === 'ra') {
            const { baseTitle, subsetName, isSubset, tags: tt } = parseTitle(info.name);
            title = esc(baseTitle);
            if (isSubset) tags = `<span class="asubset">${esc(subsetName ?? 'Subset')}</span>`;
            else tags = tt.map(t => { const s = TILDE_TAG_COLORS[t] || TILDE_TAG_COLORS.Prototype; return `<span class="atag" style="border-color:${s.border};background:${s.bg};color:${s.color};">${esc(t)}</span>`; }).join('');
          }
          if (r.done) tags += `<span class="atag" style="border-color:${r.done.color}55;background:${r.done.color}14;color:${r.done.color};">${r.done.label}</span>`;
          const facts = [
            r.minutes ? `<span>${fmtMin(r.minutes)} played</span>` : '',
            unlocks.length ? `<span class="n">${unlocks.length} unlock${unlocks.length > 1 ? 's' : ''}</span>` : '',
          ].filter(Boolean).join('<i>·</i>');
          const strip = unlocks.length ? `<div class="astrip">${unlocks.slice(0, 10).map(u => `<img src="${esc(u.icon)}" alt="" title="${esc(u.name)}" loading="lazy" onerror="this.style.visibility='hidden'">`).join('')}${unlocks.length > 10 ? `<span class="more">+${unlocks.length - 10}</span>` : ''}<span class="last">${esc(unlocks[0].name)}</span></div>` : '';
          html += `
            <a${extra} class="arow${r.done ? ' done' : ''}" style="border-left-color:${P.color};" href="${P.url(r.gameId, info.name)}" target="_blank" rel="noreferrer">
              <img class="aicon" src="${esc(icon)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
              <div class="amain">
                <div class="atitle"><span class="t">${title}</span>${tags}<span class="when">${r.day === todayKey ? timeAgo(new Date(r.lastMs).toISOString()) : clock(r.lastMs)}</span></div>
                <div class="asub"><img src="${P.icon}" alt="">${facts}</div>
                ${strip}
              </div>
            </a>`;
        });

        document.getElementById('activity-feed').innerHTML = html ||
          '<div style="padding:16px;text-align:center;font-size:11px;color:#546270;">No recent activity</div>';

        // Mobile collapse: hide rows 5+ and show toggle button
        if (window.innerWidth < 768 && rows.length > PHONE_ROWS) {
          document.querySelectorAll('[data-activity-extra]').forEach(el => el.classList.add('activity-row-hidden'));
          const btn = document.getElementById('activity-toggle-btn');
          btn.style.display = 'block';
          btn.textContent = 'Show more';
        }

      } catch (e) {
        document.getElementById('activity-feed').innerHTML =
          '<div style="padding:16px;text-align:center;font-size:11px;color:#546270;">Could not load activity</div>';
      }
    }

    async function loadCompletionsStrip() {
      try {
        const [ra, steam, xbox] = (await Promise.all(['ra', 'steam', 'xbox'].map(p => fetchJsonOnce(`./data/${p}/profile.json`)))).map(d => d ?? {});

        const awards = ra.pageAwards?.visibleUserAwards ?? [];
        const mastered = awards.filter(a => a.awardType === 'Mastery/Completion').length;
        const raBeaten = awards.filter(a => a.awardType === 'Game Beaten' && a.awardDataExtra === 1).length;
        const perfect  = (steam.perfectGames ?? []).length + (xbox.perfectGames ?? []).length;

        // Count beaten Steam games from win conditions (exclude already-perfect games)
        let steamBeatenCount = 0;
        try {
          const wcRes = await fetch('./data/steam/win-conditions.json');
          if (wcRes.ok) {
            const winConds = await wcRes.json();
            const perfectAppIds = new Set((steam.perfectGames ?? []).map(g => String(g.appId)));
            const wcEntries = Object.entries(winConds).filter(([id]) => !perfectAppIds.has(id));
            if (wcEntries.length) {
              const checks = await Promise.all(wcEntries.map(async ([appId, wc]) => {
                try {
                  const isArr = Array.isArray(wc);
                  const mode  = isArr ? 'or' : (wc.mode || 'or');
                  const names = isArr ? wc : (wc.achievements || []);
                  const game = await fetch(`./data/steam/games/${appId}.json`).then(r => r.json());
                  const achs = game.achievements || [];
                  if (mode === 'and') return names.every(n => achs.some(a => a.apiName === n && a.unlocked));
                  return achs.some(a => names.includes(a.apiName) && a.unlocked);
                } catch { return false; }
              }));
              steamBeatenCount = checks.filter(Boolean).length;
            }
          }
        } catch { /* ignore, steamBeatenCount stays 0 */ }

        let xboxBeatenCount = 0;
        try {
          const wcRes = await fetch('./data/xbox/win-conditions.json');
          if (wcRes.ok) {
            const winConds = await wcRes.json();
            const perfectIds = new Set((xbox.perfectGames ?? []).map(g => String(g.titleId)));
            const wcEntries = Object.entries(winConds).filter(([id]) => !perfectIds.has(id));
            if (wcEntries.length) {
              const checks = await Promise.all(wcEntries.map(async ([titleId, wc]) => {
                try {
                  const isArr = Array.isArray(wc);
                  const mode  = isArr ? 'or' : (wc.mode || 'or');
                  const names = isArr ? wc : (wc.achievements || []);
                  const game = await fetch(`./data/xbox/games/${titleId}.json`).then(r => r.json());
                  const achs = game.achievements || [];
                  if (mode === 'and') return names.every(n => achs.some(a => a.apiName === n && a.unlocked));
                  return achs.some(a => names.includes(a.apiName) && a.unlocked);
                } catch { return false; }
              }));
              xboxBeatenCount = checks.filter(Boolean).length;
            }
          }
        } catch { /* ignore, xboxBeatenCount stays 0 */ }

        const beaten = raBeaten + steamBeatenCount + xboxBeatenCount;
        const completed = mastered + perfect;
        const total = completed + beaten;
        if (total === 0) { document.getElementById('completions-strip').style.display = 'none'; return; }

        const pill = (val, label, color) =>
          `<span style="color:${color};font-weight:700;font-size:12px;">${val}</span><span style="color:#546270;"> ${label}</span>`;
        const dot = `<span style="color:#3a5068;">·</span>`;

        const parts = [];
        parts.push(pill(total, 'total', '#ffffff'));
        if (completed > 0) parts.push(pill(completed, 'Completed', '#e5b143'));
        if (beaten    > 0) parts.push(pill(beaten,    'Beaten',    '#b8c4ce'));

        // Most recent completion across both platforms
        const RA_MEDIA_BASE = 'https://media.retroachievements.org';
        const raLatest    = awards.filter(a => a.awardType === 'Mastery/Completion')
                                  .sort((a, b) => new Date(b.awardedAt) - new Date(a.awardedAt))[0];
        const steamLatest = (steam.perfectGames ?? []).sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt))[0];
        const xboxLatest  = (xbox.perfectGames ?? []).sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt))[0];
        const candidates  = [
          raLatest    && { ..._parseTitle(raLatest.title), name: raLatest.title, date: raLatest.awardedAt, icon: RA_MEDIA_BASE + raLatest.imageIcon, type: 'Completed' },
          steamLatest && { name: steamLatest.gameName, date: steamLatest.completedAt, icon: steamLatest.lastAchIconUrl || steamLatest.iconUrl, type: 'Completed' },
          xboxLatest  && { name: xboxLatest.gameName,  date: xboxLatest.completedAt,  icon: xboxImg(xboxLatest.iconUrl, 64), type: 'Completed' },
        ].filter(Boolean).sort((a, b) => new Date(b.date) - new Date(a.date));
        const latest = candidates[0];

        if (latest) {
          const diff = daysAgo(latest.date);
          const ago  = diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : diff < 7 ? `${diff}d ago` : diff < 30 ? `${Math.floor(diff/7)}w ago` : `${Math.floor(diff/30)}mo ago`;
          const typeColor = latest.type === 'Beaten' ? '#b8c4ce' : '#e5b143';
          const latestDisplayName = latest.baseTitle || latest.name;
          const latestBadges = latest.isSubset
            ? `<span style="${_BADGE_BASE}border:1px solid rgba(229,177,67,0.3);background:rgba(229,177,67,0.08);color:#c8a84b;">Subset</span>`
            : (latest.tags?.length ? _tildeBadgesHtml(latest.tags) : '');
          const latestSubset = latest.isSubset && latest.subsetName
            ? `<span style="font-size:10px;color:#c8a84b;flex-shrink:0;">${latest.subsetName}</span>`
            : '';
          document.getElementById('completions-strip-latest').innerHTML = `
            <img src="${latest.icon}" style="width:22px;height:22px;border-radius:2px;border:1px solid #101214;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none'" />
            <div style="display:flex;flex-direction:column;gap:1px;min-width:0;overflow:hidden;">
              <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
                <span style="font-size:12px;font-weight:600;color:#c6d4df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${latestDisplayName}</span>
                ${latestBadges}
              </div>
              ${latestSubset}
            </div>
            <span style="font-size:10px;font-weight:700;color:${typeColor};flex-shrink:0;text-transform:uppercase;letter-spacing:0.06em;">★ ${latest.type}</span>
            <span style="font-size:10px;color:#546270;flex-shrink:0;">${ago}</span>
          `;
        } else {
          document.getElementById('completions-strip-latest').innerHTML = '';
        }

        const mobileParts = [];
        if (completed > 0) mobileParts.push(`<span style="color:#e5b143;font-weight:700;">${completed}</span><span style="color:#8f98a0;"> Completed</span>`);
        if (beaten    > 0) mobileParts.push(`<span style="color:#b8c4ce;font-weight:700;">${beaten}</span><span style="color:#8f98a0;"> Beaten</span>`);
        document.getElementById('completions-strip-total-mobile').innerHTML = mobileParts.join('<span style="color:#3a5068;margin:0 5px;">·</span>');
        document.getElementById('completions-strip-stats').innerHTML = parts.join(` ${dot} `);
      } catch (e) {
        // non-critical: hide the strip
        document.getElementById('completions-strip').style.display = 'none';
      }
    }

    // Last 30 days, computed like the Analytics page's default view (30 days, farms and idle games hidden) in the
    // viewer's timezone: hours = session minutes split into local days; unlocks by local day;
    // time of day and top game from the same sessions. Achievement chunk 1 covers 91 days.
    async function loadAnalyticsStrip() {
      try {
        const localKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
        const now = new Date();
        const startMs = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29).getTime();
        const startKey = localKey(startMs);
        const endKey = localKey(now.getTime());
        const inRange = (ms) => { const k = localKey(ms); return k >= startKey && k <= endKey; };
        // The 30 days before, for the change arrows (like Analytics' "vs previous 30 days")
        const prevMs = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 59).getTime();
        const prevKey = localKey(prevMs);
        const inPrev = (ms) => { const k = localKey(ms); return k >= prevKey && k < startKey; };
        const dayKeys = Array.from({ length: 30 }, (_, i) => localKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29 + i).getTime()));

        // Play sessions (RA + Steam): this year's file, plus last year's when the window crosses New Year
        const years = [...new Set([new Date(prevMs).getUTCFullYear(), now.getUTCFullYear()])];
        const playFiles = await Promise.all(['ra', 'steam'].flatMap(p => years.map(y =>
          fetchJsonOnce(`./data/${p}/playtime/${y}.json`).then(f => ({ p, f })))));
        const names = { ra: {}, steam: {} }, icons = { ra: {}, steam: {} };
        for (const { p, f } of playFiles) for (const [id, g] of Object.entries(f?.games ?? {})) {
          names[p][id] = g.name;
          if (g.icon) icons[p][id] = p === 'ra' ? 'https://media.retroachievements.org' + g.icon : g.icon;
        }
        const sessions = playFiles.flatMap(({ p, f }) => (f?.sessions ?? []).map(s => ({
          platform: p, gameId: String(s.gameId), minutes: s.minutes, startMs: Date.parse(s.start), endMs: Date.parse(s.end),
        })));

        const chunk = async (p, map) => ((await fetchJsonOnce(`./data/${p}/achievements/1.json`))?.recentAchievements ?? []).map(map);
        const unlocks = (await Promise.all([
          chunk('ra',    a => ({ platform: 'ra',    gameId: String(a.gameId),  ms: Date.parse(a.date.replace(' ', 'T') + 'Z') })),
          chunk('steam', a => ({ platform: 'steam', gameId: String(a.appId),   ms: Date.parse(a.unlockedAt) })),
          chunk('xbox',  a => ({ platform: 'xbox',  gameId: String(a.titleId), ms: Date.parse(a.unlockedAt) })),
        ])).flat().filter(u => inRange(u.ms) || inPrev(u.ms));

        // Achievement farms, same rule as Analytics (FARM_* in analytics/utils.js), checked only for
        // the Steam games active in the window, from their small per-game files (the index is 1.8 MB)
        const steamIds = [...new Set([
          ...sessions.filter(s => s.platform === 'steam' && s.endMs >= prevMs - 86400000).map(s => s.gameId),
          ...unlocks.filter(u => u.platform === 'steam').map(u => u.gameId),
        ])];
        // plus the farms marked in the admin, minus the ones overruled there (data/hub/farm-games.json)
        const farmMarks = (await fetchJsonOnce('./data/hub/farm-games.json')) ?? {};
        const notFarm = new Set(farmMarks.notFarms ?? []);
        const farms = new Set([...(await Promise.all(steamIds.map(async id => {
          if (notFarm.has(`steam:${id}`)) return null;
          const g = await fetchJsonOnce(`./data/steam/games/${id}.json`);
          return g && g.unlocked >= 10 && g.unlocked / Math.max((g.playtimeForever ?? 0) / 60, 0.1) > 15 ? `steam:${id}` : null;
        }))).filter(Boolean), ...(farmMarks.farms ?? [])]);
        // Idle games marked in the admin (data/hub/idle-games.json), hidden like Analytics' default view
        const idle = new Set((await fetchJsonOnce('./data/hub/idle-games.json'))?.games ?? []);
        const keep = (x) => !farms.has(`${x.platform}:${x.gameId}`) && !idle.has(`${x.platform}:${x.gameId}`);

        // Session minutes spread over local days (hours, top game) and local hours (time of day),
        // like Analytics' sessionDays and hourGrid
        const spread = (s, nextStep) => {
          const span = s.endMs - s.startMs;
          if (!(span > 0)) return [{ t: s.endMs, minutes: s.minutes }];
          const out = [];
          for (let t = s.startMs; t < s.endMs;) { const next = Math.min(nextStep(new Date(t)), s.endMs); out.push({ t, minutes: s.minutes * ((next - t) / span) }); t = next; }
          return out;
        };
        const nextDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
        const nextHour = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1).getTime();
        const partOf = (h) => (h >= 5 && h < 12 ? 'morning' : h < 17 && h >= 12 ? 'afternoon' : h < 22 && h >= 17 ? 'evening' : 'night');
        let minutes = 0, prevMinutes = 0;
        const perGame = {};
        const perDay = Object.fromEntries(dayKeys.map(k => [k, { ra: 0, steam: 0 }]));
        const parts = { morning: 0, afternoon: 0, evening: 0, night: 0 };
        for (const s of sessions.filter(keep)) {
          for (const d of spread(s, nextDay)) {
            if (inPrev(d.t)) { prevMinutes += d.minutes; continue; }
            if (!inRange(d.t)) continue;
            minutes += d.minutes;
            perDay[localKey(d.t)][s.platform] += d.minutes;
            perGame[`${s.platform}:${s.gameId}`] = (perGame[`${s.platform}:${s.gameId}`] ?? 0) + d.minutes;
          }
          // Time of day takes the sessions that ended in the window, whole (as Analytics does)
          if (inRange(s.endMs)) for (const h of spread(s, nextHour)) parts[partOf(new Date(h.t).getHours())] += h.minutes;
        }
        const kept = unlocks.filter(keep);
        const unlockCount = kept.filter(u => inRange(u.ms)).length;
        const prevUnlocks = kept.filter(u => inPrev(u.ms)).length;
        const partTotal = Object.values(parts).reduce((a, v) => a + v, 0);
        const topPart = Object.entries(parts).reduce((m, e) => (e[1] > m[1] ? e : m), ['', 0]);
        const top = Object.entries(perGame).filter(([, m]) => m >= 1).reduce((m, e) => (!m || e[1] > m[1] ? e : m), null);

        const fmtHours = (m) => { const min = Math.round(m); return min >= 60 ? `${Math.round(min / 60).toLocaleString()}h` : `${min}m`; };
        const fmtHm = (m) => { const min = Math.round(m), h = Math.floor(min / 60), r = min % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
        const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const delta = (cur, prev) => {
          if (!(prev > 0)) return '';
          const v = Math.round(((cur - prev) / prev) * 100);
          return `<i class="ast-d ${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '▲' : v < 0 ? '▼' : '='} ${Math.abs(v)}%</i>`;
        };
        const html = [];
        if (minutes < 1 && unlockCount === 0) {
          html.push('<span class="ast-none">No play or unlocks in the last 30 days</span>');
        } else {
          // Two numbers with their change, then the 30 days as bars (RA gold under Steam blue)
          html.push(`<div class="ast-nums">
            <div><b>${fmtHours(minutes)}</b><span>played ${delta(minutes, prevMinutes)}</span></div>
            <div><b>${unlockCount.toLocaleString()}</b><span>${unlockCount === 1 ? 'unlock' : 'unlocks'} ${delta(unlockCount, prevUnlocks)}</span></div>
          </div>`);
          const dayMax = Math.max(...dayKeys.map(k => perDay[k].ra + perDay[k].steam), 1);
          html.push(`<div class="ast-spark" aria-hidden="true">${dayKeys.map(k => {
            const d = perDay[k], pct = (v) => (v / dayMax) * 100;
            return `<span title="${esc(k)}: ${fmtHours(d.ra + d.steam)}">${d.steam >= 1 ? `<i style="height:${pct(d.steam)}%;background:#66c0f4"></i>` : ''}${d.ra >= 1 ? `<i style="height:${pct(d.ra)}%;background:#e5b143"></i>` : ''}</span>`;
          }).join('')}</div>`);
          // Time of day as one bar (Analytics' DAY_PARTS colours), the busiest part named under it
          if (partTotal > 0) {
            const PARTS = [['morning', 'Morning', '05–12', '#a9dcf8'], ['afternoon', 'Afternoon', '12–17', '#66c0f4'], ['evening', 'Evening', '17–22', '#2a7bba'], ['night', 'Night', '22–05', '#1a5275']];
            const [, label, range] = PARTS.find(p => p[0] === topPart[0]);
            html.push(`<div class="ast-parts"><div class="ast-pbar">${PARTS.filter(p => parts[p[0]] > 0).map(p => `<i style="flex:${parts[p[0]]};background:${p[3]}"></i>`).join('')}</div>
              <span>Mostly <b>${label.toLowerCase()}</b> ${range} · ${Math.round((topPart[1] / partTotal) * 100)}%</span></div>`);
          }
          if (top) {
            const [p, id] = top[0].split(':');
            const name = p === 'ra' ? _parseTitle(names.ra[id] ?? '').baseTitle : names.steam[id];
            if (name) html.push(`<div class="ast-top">${icons[p][id] ? `<img src="${esc(icons[p][id])}" alt="" loading="lazy">` : '<span></span>'}
              <span class="ast-top-t"><span>Top game</span><b>${esc(name)}</b></span>
              <span class="ast-top-v"><b>${fmtHm(top[1])}</b>${minutes ? `<span>${Math.round((top[1] / minutes) * 100)}%</span>` : ''}</span></div>`);
          }
        }

        document.getElementById('analytics-strip-stats').innerHTML = html.join('');
      } catch (e) {
        // non-critical, like the Completions strip: hide it
        document.getElementById('analytics-strip').style.display = 'none';
      }
    }

    // Playing section: games with play or unlocks in the last 2 weeks, from assets/playing.js (an
    // ES module, so import() from this classic script). Shares the chunk and playtime requests
    // with the activity feed and the Analytics strip through fetchJsonOnce
    // Series across platforms: built by scripts/build-series.js (series/ has the same numbers)
    async function loadSeriesSection() {
      const section = document.getElementById('series-section');
      const list = document.getElementById('series-list');
      const more = document.getElementById('series-more');
      const d = await fetchJsonOnce('./data/hub/series-games.json');
      const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const ICON = { ra: './assets/icon-ra.png', steam: './assets/icon-steam.png', xbox: './assets/icon-xbox.png' };
      const img = (g, w) => g?.p === 'xbox' ? xboxImg(g.icon, w) : g?.icon;
      const cards = (d?.series ?? []).map(s => {
        const games = s.games;
        const tracked = games.filter(g => g.total > 0);
        const done = tracked.filter(g => g.unlocked >= g.total).length;
        const started = tracked.filter(g => g.unlocked > 0 && g.unlocked < g.total).length;
        const earned = tracked.reduce((n, g) => n + g.unlocked, 0), total = tracked.reduce((n, g) => n + g.total, 0);
        const split = ['ra', 'steam', 'xbox'].map(p => [p, games.filter(g => g.p === p).length]).filter(([, n]) => n);
        return { s, games, cover: games.find(g => g.key === s.cover) ?? games[0], done, started, tracked: tracked.length, split,
          pct: total ? earned / total * 100 : 0, lastMs: Math.max(0, ...games.map(g => g.lastMs || 0)) };
      }).filter(c => c.games.length >= 3).sort((a, b) => b.lastMs - a.lastMs);
      if (!cards.length) { section.style.display = 'none'; return; }

      const MAX = 4;   // the 4th only shows on desktop (two full rows)
      const pctLabel = p => p > 0 && p < 1 ? '<1%' : `${Math.floor(p)}%`;
      const card = (c, i) => {
        const edge = c.tracked && c.done === c.tracked ? '#e5b143' : c.started || c.done ? '#66c0f4' : '#323f4c';
        const cover = c.cover?.p === 'steam'
          ? `<img src="${esc(c.cover.icon)}" alt="" loading="lazy" class="scard-cover banner" />`
          : `<img src="${esc(img(c.cover, 128))}" alt="" loading="lazy" class="scard-cover" />`;
        const art = c.cover?.art ? `<div class="scard-art"><img src="${esc(c.cover.p === 'xbox' ? xboxImg(c.cover.art, 640) : c.cover.art)}" alt="" loading="lazy" onerror="this.style.display='none'" /></div>` : '';
        const split = c.split.map(([p, n]) => `<span style="display:inline-flex;align-items:center;gap:3px;"><img src="${ICON[p]}" alt="" style="width:12px;height:12px;object-fit:contain;" />${n}</span>`).join(' ');
        const icons = [...c.games].sort((a, b) => (b.unlocked > 0) - (a.unlocked > 0) || b.lastMs - a.lastMs).slice(0, 10)
          .map(g => `<img src="${esc(g.square ?? img(g, 64))}" alt="" loading="lazy" class="${g.total && g.unlocked >= g.total ? 'mastered' : g.unlocked > 0 ? '' : g.total ? 'dim' : 'noach'}" />`).join('');
        const ago = c.lastMs ? (() => { const dd = Math.floor((Date.now() - c.lastMs) / 86400000); return dd < 1 ? 'today' : dd < 7 ? `${dd}d` : dd < 30 ? `${Math.floor(dd / 7)}w` : dd < 365 ? `${Math.floor(dd / 30)}mo` : `${Math.floor(dd / 365)}y`; })() : '';
        return `
          <a href="./series/?open=${encodeURIComponent(c.s.id)}" class="scard smooth${i >= 3 ? ' hub-desk' : ''}" style="border-left-color:${edge};">
            ${art}
            <div class="scard-top">
              ${cover}
              <div class="scard-main">
                <span class="scard-name">${esc(c.s.name)}</span>
                <span class="scard-sub"><span>${c.games.length} games</span><i>·</i>${split}</span>
              </div>
              <span class="scard-end"><span class="scard-pct" style="color:${c.pct > 0 ? '#e5b143' : '#546270'};">${pctLabel(c.pct)}</span>${ago ? `<em>${ago}</em>` : ''}</span>
            </div>
            <div class="gbar"><i style="width:${c.pct}%;background:#e5b143;"></i></div>
            <div class="sicons">${icons}</div>
          </a>`;
      };
      list.innerHTML = cards.slice(0, MAX).map(card).join('');
      if (cards.length > 3) {
        more.innerHTML = `<span class="flex-1 min-w-0 flex items-center gap-2">All <b style="color:#c6d4df;font-weight:600;">${cards.length}</b> series<span class="hub-plats" aria-label="RA, Steam and Xbox"><img src="./assets/icon-ra.png" alt=""><img src="./assets/icon-steam.png" alt=""><img src="./assets/icon-xbox.png" alt=""></span></span><span class="flex shrink-0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>`;
        more.style.display = 'flex';
      }
    }

    async function loadPlayingSection() {
      const section = document.getElementById('playing-section');
      const list = document.getElementById('playing-list');
      const more = document.getElementById('playing-more');
      try {
        const { loadPlaying } = await import('./assets/playing.js');
        const { games, groups } = await loadPlaying(fetchJsonOnce, './');
        if (!games.length) { section.style.display = 'none'; return; }

        const MAX_TILES = 4;
        const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const ago = (d) => d === 0 ? 'Today' : d === 1 ? 'Yesterday' : `${d}d ago`;
        // RA and Steam only (assets/playing.js leaves Xbox out: no playtime)
        const RGB   = { ra: '229,177,67', steam: '102,192,244' };
        const LABEL = { ra: 'RA', steam: 'Steam' };
        const URL_OF = {
          ra:    g => `https://retroachievements.org/game/${g.gameId}`,
          steam: g => `https://store.steampowered.com/app/${g.gameId}`,
        };
        // Same week-cell steps as the Activity tiles
        const alpha = (v) => !v ? 0 : v >= 300 ? 1 : v >= 150 ? 0.75 : v >= 60 ? 0.5 : 0.3;
        const CHIP = 'font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:2px 5px;border-radius:2px;white-space:nowrap;display:block;';

        // Cover: the Steam header; RA (or a missing header) is the icon on the library mosaic (.art-icon)
        const iconCover = (icon) => icon
          ? `<img src="${esc(icon)}" alt="" class="art-icon" style="position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;opacity:0.7;" />
             <img src="${esc(icon)}" alt="" style="position:absolute;top:11%;left:50%;transform:translateX(-50%);height:78%;width:auto;aspect-ratio:1;object-fit:cover;border-radius:3px;border:1px solid rgba(0,0,0,0.6);box-shadow:0 4px 14px rgba(0,0,0,0.6);" />`
          : '<div style="position:absolute;inset:0;background:#2a475e;"></div>';

        const tile = (g) => {
          const rgb = RGB[g.platform];
          const icon = g.icon;
          const wide = g.cover;
          const t = g.platform === 'ra' ? _parseTitle(g.name) : { baseTitle: g.name, isSubset: false, tags: [] };
          const badges = (t.isSubset ? `<span style="${_BADGE_BASE}border:1px solid rgba(229,177,67,0.3);background:rgba(229,177,67,0.1);color:#c8a84b;">Subset</span>` : _tildeBadgesHtml(t.tags))
            + (g.beaten ? `<span style="${_BADGE_BASE}border:1px solid rgba(184,196,206,0.25);background:#2a3440;color:#c6d4df;" title="Beaten, still playing it">Beaten</span>` : '');
          const pct = g.progress?.total ? Math.round(g.progress.unlocked / g.progress.total * 100) : null;
          const cells = g.weeks.map(v => { const a = alpha(v); return `<i style="height:9px;border-radius:1px;background:${a ? `rgba(${rgb},${a})` : '#243444'};"></i>`; }).join('');
          return `
            <a href="${URL_OF[g.platform](g)}" target="_blank" rel="noreferrer" class="flex flex-col min-w-0 bg-[#1b2838] border border-[#2a475e] rounded-[2px] overflow-hidden hover:border-[#4c9be8] transition-colors">
              <div style="position:relative;aspect-ratio:460/215;overflow:hidden;background:#101214;">
                ${wide ? `<img src="${esc(wide)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.outerHTML=this.nextElementSibling.innerHTML" /><template>${iconCover(icon)}</template>` : iconCover(icon)}
                <span style="position:absolute;top:5px;left:5px;border-radius:2px;background:rgba(16,18,20,0.85);"><span style="${CHIP}color:#66c0f4;background:rgba(102,192,244,0.1);border:1px solid rgba(102,192,244,0.35);">Playing</span></span>
                <span style="position:absolute;top:5px;right:5px;font-size:8px;font-weight:600;color:#fff;background:rgba(16,18,20,0.75);padding:2px 5px;border-radius:2px;font-variant-numeric:tabular-nums;">${ago(g.daysAgo)}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:5px;padding:7px 8px 8px;min-width:0;">
                <div style="display:flex;align-items:center;gap:5px;min-width:0;">
                  <span style="font-size:7px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;padding:1px 3px;border-radius:2px;flex-shrink:0;color:rgb(${rgb});background:rgba(${rgb},0.1);border:1px solid rgba(${rgb},0.3);">${LABEL[g.platform]}</span>
                  <span style="font-size:11px;font-weight:500;color:#c6d4df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;" title="${esc(g.name)}">${esc(t.baseTitle)}</span>
                  ${badges}
                </div>
                <div style="display:flex;align-items:center;gap:6px;font-size:9px;font-variant-numeric:tabular-nums;">
                  <div style="flex:1;height:4px;background:#101a24;border-radius:1px;overflow:hidden;">${pct !== null ? `<div style="height:100%;width:${pct}%;background:rgb(${rgb});"></div>` : ''}</div>
                  <span style="color:#c6d4df;font-weight:600;">${pct !== null ? pct + '%' : '–'}</span>
                </div>
                <div style="display:grid;grid-template-columns:repeat(13,1fr);gap:2px;" title="Weeks played, last 13 weeks">${cells}</div>
              </div>
            </a>`;
        };

        const shown = groups.playing.slice(0, MAX_TILES);
        list.innerHTML = shown.length
          ? shown.map(tile).join('')
          : '<div class="col-span-full" style="padding:14px;text-align:center;font-size:10px;color:#546270;background:#1b2838;border:1px solid #2a475e;border-radius:2px;">Nothing played in the last 2 weeks</div>';

        // The rest of the rotation, as one link to Activity's Playing view
        const extra = groups.playing.length - shown.length;
        const parts = [
          extra > 0 && `<span class="crit"><i style="background:#66c0f4"></i><b>+${extra}</b> playing</span>`,
          groups.onhold.length && `<span class="crit"><i style="background:#b8c4ce"></i><b>${groups.onhold.length}</b> on hold</span>`,
          groups.drifting.length && `<span class="crit"><i style="background:#8f98a0"></i><b>${groups.drifting.length}</b> drifting</span>`,
        ].filter(Boolean);
        if (parts.length) {
          more.innerHTML = `<span class="crits flex-1 min-w-0">${parts.join('')}</span><span class="flex shrink-0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>`;
          more.style.display = 'flex';
        }
      } catch (e) {
        section.style.display = 'none';
      }
    }

    loadPlayingSection();
    loadSeriesSection();
    loadHubProfile();
    loadRAStats();
    loadSteamStats();
    loadXboxStats();
  </script>


<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/gaming-hub/sw.js', { scope: '/gaming-hub/' });
  }

  // Refresh app — clear cached app files (not data) and reload
  document.getElementById('refresh-app-btn').addEventListener('click', async e => {
    e.currentTarget.classList.add('spin');   // the icon turns while the cache clears
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      const reg = await navigator.serviceWorker?.getRegistration();
      await reg?.update();
    } catch { /* reload anyway */ }
    location.reload();
  });
</script>
<script src="./assets/mobile-nav.js"></script>
    <script src="./assets/art-fallback.js"></script>
