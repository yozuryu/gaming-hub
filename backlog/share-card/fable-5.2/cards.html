<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share cards · Fable 5.2 set</title>
<!-- Design by Fable 5.2 (2026-11-14). Forty share designs: 10 stories, 10 posts, 10 wide cards, 10 overlays.
     No query string: the design sheet. ?d=<id>: one design alone (transparent page for overlays). Numbers come from data.js (build-data.cjs). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap">
<script src="data.js"></script>
<style>
:root {
  --base: #080c14; --panel: #101724; --line: rgba(255,255,255,.12);
  --ink: #fff; --ink2: #c6d4df; --ink3: #8f98a0;
  --gold: #e5b143; --silver: #b8c4ce; --steam: #66c0f4; --ra: #e5b143; --xbox: #52b043; --hc: #ff6b6b;
  --sans: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --disp: 'Oxanium', 'Segoe UI', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: transparent; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
img { max-width: none; display: block; }
.px { image-rendering: pixelated; }
.num { font-family: var(--disp); font-weight: 700; font-variant-numeric: tabular-nums; line-height: .9; letter-spacing: -.01em; }
.lab { font-family: var(--disp); font-weight: 600; text-transform: uppercase; letter-spacing: .18em; }
.c { color: var(--c); } .gold { color: var(--gold); } .dim { color: var(--ink3); }

/* ── Full cards: story 1080×1920, post 1080×1350, drawn at real size ── */
.card { position: relative; overflow: hidden; background: var(--base); color: var(--ink); --c: var(--steam); }
.story { width: 1080px; height: 1920px; } .post { width: 1080px; height: 1350px; }
.bg { position: absolute; left: -60px; top: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; }
.bg.blur { filter: blur(44px) brightness(.42) saturate(1.25); }
.scrim { position: absolute; inset: 0; }
/* Story text lives between the two 250px bands Instagram covers; posts keep 64px */
.safe { position: absolute; left: 72px; right: 72px; top: 250px; bottom: 250px; display: flex; flex-direction: column; }
.post .safe { left: 64px; right: 64px; top: 64px; bottom: 64px; }
.safe.mid { justify-content: center; } .safe.end { justify-content: flex-end; } .safe.ctr { align-items: center; text-align: center; }
.sp { flex: 1; }
h1 { font-weight: 800; letter-spacing: -.02em; line-height: 1.02; text-wrap: balance; }
.lab { font-size: 28px; }
.id { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 600; white-space: nowrap; }
.id .av { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); }
.id i { width: 2px; height: 30px; background: currentColor; opacity: .3; }
.id .mk { width: 38px; height: 38px; margin-right: -6px; }
.id span { font-family: var(--disp); font-weight: 700; letter-spacing: .02em; }
.id.dark { color: #0b1118; } .id.dark .av { border-color: rgba(0,0,0,.35); }
.bar { height: 12px; background: rgba(255,255,255,.16); border-radius: 6px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--c); border-radius: 6px; min-width: 12px; }
.ring { --p: 50; --t: 18px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,255,255,.16) 0); padding: var(--t); }
.ring > * { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 8px solid var(--base); background: var(--base); }

/* S1 Poster */
.s1 .scrim { background: linear-gradient(rgba(6,9,14,.35), transparent 22%, transparent 46%, rgba(6,9,14,.94) 76%); }
.s1 h1 { font-size: 112px; margin: 18px 0 34px; }
.s1 .row { display: flex; align-items: flex-end; gap: 32px; margin-bottom: 26px; }
.s1 .row .num { font-size: 168px; color: var(--c); } .s1 .row .num small { font-size: 72px; }
.s1 .row p { font-size: 36px; line-height: 1.3; color: var(--ink2); padding-bottom: 8px; } .s1 .row p b { color: #fff; }
.s1 .id { margin-top: 44px; }

/* S2 Window number: the art shows through the numerals */
.s2 { background: #05070b; }
.s2 .bg.blur { filter: blur(60px) brightness(.2) saturate(1.2); }
.s2 .big { font-size: 640px; line-height: .8; letter-spacing: -.05em; margin-top: 70px; background: 78% 30% / auto 210%; -webkit-background-clip: text; background-clip: text; color: transparent; margin-left: -18px; filter: saturate(1.25) brightness(1.2); }
.s2 .pc { font-size: 150px; color: var(--c); margin: -10px 0 0 6px; }
.s2 h1 { font-size: 84px; margin: 40px 0 18px; }
.s2 p { font-size: 38px; color: var(--ink2); } .s2 p b { color: #fff; }

/* S3 Plate */
.s3 .frame { margin: 40px 0 44px; padding: 10px; background: linear-gradient(135deg, #f7dc8a, #e5b143 30%, #8a6516 55%, #f3d37a 75%, #b98a22); box-shadow: 0 0 140px rgba(229,177,67,.4), 0 30px 60px rgba(0,0,0,.5); }
.s3 .frame img { width: 520px; height: 780px; object-fit: cover; }
.s3 h1 { font-size: 64px; max-width: 880px; }
.tri { display: flex; gap: 0; margin: 40px 0 30px; }
.tri div { padding: 0 36px; border-left: 2px solid var(--line); text-align: center; } .tri div:first-child { border: 0; }
.tri .num { font-size: 64px; display: block; white-space: nowrap; } .tri span { font-size: 26px; color: var(--ink3); display: block; margin-top: 12px; }
.s3 .id { margin-top: 44px; }

/* S4 Spotlight */
.s4 .rays { position: absolute; left: 50%; top: 660px; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; background: repeating-conic-gradient(rgba(229,177,67,.2) 0 6deg, transparent 6deg 15deg); -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 78%); mask: radial-gradient(closest-side, #000 20%, transparent 78%); }
.s4 .ach { width: 384px; height: 384px; border-radius: 40px; border: 6px solid var(--gold); box-shadow: 0 0 120px rgba(229,177,67,.55); margin: 70px 0 64px; }
.s4 h1 { font-size: 108px; margin: 22px 0 26px; }
.s4 .of { font-size: 40px; color: var(--ink2); } .s4 .of b { font-family: var(--disp); color: var(--gold); font-size: 64px; margin-right: 10px; }
.scale { position: relative; width: 760px; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--gold), #c8901a 10%, var(--steam) 25%, #8f98a0 50%, #546270); margin: 44px 0 16px; }
.scale i { position: absolute; top: -12px; width: 10px; height: 38px; margin-left: -5px; background: #fff; border-radius: 5px; box-shadow: 0 0 0 5px rgba(0,0,0,.5); }
.scale + div { width: 760px; display: flex; justify-content: space-between; font-size: 24px; color: var(--ink3); }
.s4 .game { display: flex; align-items: center; gap: 22px; font-size: 34px; font-weight: 600; margin-bottom: 40px; }
.s4 .game img { width: 72px; height: 108px; object-fit: cover; }

/* S5 Receipt */
.s5 .paper { position: absolute; left: 150px; top: 272px; width: 780px; background: #f3efe4; color: #15181d; font-family: var(--mono); font-size: 30px; line-height: 1.35; padding: 56px 52px 46px; transform: rotate(-1.6deg); box-shadow: 0 40px 90px rgba(0,0,0,.6); }
.s5 .paper::after { content: ''; position: absolute; left: 0; right: 0; bottom: -28px; height: 28px; background: linear-gradient(135deg, #f3efe4 50%, transparent 50%) 0 0 / 28px 28px, linear-gradient(225deg, #f3efe4 50%, transparent 50%) 0 0 / 28px 28px; }
.s5 .hd { text-align: center; } .s5 .hd img { width: 64px; height: 64px; margin: 0 auto 10px; }
.s5 .hd b { font-family: var(--disp); font-size: 50px; letter-spacing: .12em; display: block; }
.s5 hr { border: 0; border-top: 3px dashed #15181d; margin: 28px 0; opacity: .55; }
.s5 .li { display: flex; align-items: center; gap: 20px; margin: 18px 0; } .s5 .li img { width: 64px; height: 64px; } .s5 .li span { flex: 1; } .s5 .li b { font-size: 34px; }
.s5 .tot { display: flex; justify-content: space-between; font-weight: 700; font-size: 44px; } .s5 .sub { display: flex; justify-content: space-between; }
.s5 .code { margin-top: 26px; height: 64px; background: repeating-linear-gradient(90deg, #15181d 0 6px, transparent 6px 10px, #15181d 10px 12px, transparent 12px 20px, #15181d 20px 28px, transparent 28px 32px); }
.s5 .id { position: absolute; left: 72px; bottom: 262px; }

/* S6 Wall */
.s6 .wall { position: absolute; left: 28px; top: 520px; width: 1024px; display: grid; grid-template-columns: repeat(8, 128px); }
.s6 .wall img { width: 128px; height: 128px; outline: 2px solid var(--base); outline-offset: -1px; }
.s6 .scrim { background: linear-gradient(transparent 0, transparent 1670px, rgba(8,12,20,.85) 1900px); }
.s6 .top { position: absolute; left: 72px; right: 72px; top: 262px; }
.s6 .hrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin-top: 12px; } .s6 .hrow > div:first-child { flex: 1; min-width: 0; }
.s6 h1 { font-size: 80px; white-space: nowrap; } .s6 .hrow .num { font-size: 124px; color: var(--gold); }
.s6 .id { margin-top: 30px; font-size: 26px; } .s6 .id .av { width: 46px; height: 46px; } .s6 .id .mk { width: 32px; height: 32px; }

/* S7 Road */
.s7 h1 { font-size: 88px; margin: 14px 0 50px; }
.road { position: relative; } .road::before { content: ''; position: absolute; left: 213px; top: 64px; bottom: 64px; width: 4px; background: linear-gradient(rgba(255,255,255,.25), var(--gold)); }
.road .st { display: flex; align-items: center; height: 176px; }
.road .dt { width: 170px; font-family: var(--disp); font-weight: 700; font-size: 40px; text-align: right; color: var(--ink2); }
.road .dot { width: 30px; height: 30px; margin: 0 30px; border-radius: 50%; background: var(--base); border: 5px solid #fff; position: relative; }
.road .st:last-child .dot { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 40px var(--gold); }
.road img { width: 128px; height: 128px; margin-right: 28px; }
.road .tx b { font-family: var(--disp); font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink3); display: block; margin-bottom: 6px; }
.road .tx span { font-size: 38px; font-weight: 600; line-height: 1.12; display: block; max-width: 440px; }
.road .st:last-child .tx b { color: var(--gold); }
.s7 .foot { font-size: 36px; color: var(--ink2); margin: 44px 0 40px; } .s7 .foot b { color: #fff; font-family: var(--disp); font-size: 44px; }

/* S8 Diptych: art above, a block of the state colour below */
.s8 .art { position: absolute; left: 0; top: 0; width: 1080px; height: 830px; object-fit: cover; }
.s8 .blk { position: absolute; left: 0; right: 0; top: 830px; bottom: 0; background: var(--c); color: #0b1118; padding: 56px 72px 0; }
.s8 .lab { font-size: 30px; opacity: .7; } .s8 h1 { font-size: 104px; margin: 12px 0 36px; font-weight: 900; }
.s8 .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 40px; }
.s8 .g2 .num { font-size: 92px; display: block; } .s8 .g2 span { font-size: 30px; opacity: .72; display: block; margin-top: 10px; }
.s8 .id { position: absolute; left: 72px; bottom: 262px; }

/* S9 Week */
.s9 .hero { font-size: 230px; margin: 26px 0 16px; } .s9 .hero small { font-size: 110px; color: var(--ink2); margin: 0 26px 0 6px; }
.s9 .sub { font-size: 40px; color: var(--ink2); } .s9 .sub b { color: var(--gold); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 18px; align-items: end; height: 520px; margin: 50px 0 14px; }
.bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.bars u { text-decoration: none; font-family: var(--disp); font-weight: 700; font-size: 32px; color: var(--gold); margin-bottom: 12px; }
.bars b { width: 100%; background: linear-gradient(var(--c), rgba(102,192,244,.35)); border-radius: 10px 10px 0 0; min-height: 8px; }
.bars b.z { background: rgba(255,255,255,.18); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 18px; text-align: center; font-family: var(--disp); font-size: 30px; color: var(--ink3); padding-top: 14px; border-top: 2px solid var(--line); }
.tops { margin-top: 44px; display: flex; flex-direction: column; gap: 22px; }
.tops div { display: flex; align-items: center; gap: 24px; font-size: 36px; font-weight: 600; }
.tops img { width: 72px; height: 72px; border-radius: 10px; } .tops span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tops b { font-family: var(--disp); color: var(--c); font-size: 40px; }

/* S10 Ring */
.s10 .ring { width: 660px; height: 660px; margin: 50px 0 0; }
.s10 .chip { margin-top: -62px; background: var(--c); color: #06111c; font-size: 84px; padding: 16px 44px 8px; border-radius: 70px; border: 8px solid var(--base); position: relative; }
.s10 h1 { font-size: 86px; margin: 40px 0 18px; } .s10 p { font-size: 38px; color: var(--ink2); }
.unl { display: flex; align-items: center; gap: 24px; text-align: left; background: rgba(8,12,20,.7); border: 2px solid var(--line); border-radius: 22px; padding: 18px 30px 18px 18px; margin: 44px 0 0; }
.unl img { width: 96px; height: 96px; border-radius: 12px; } .unl b { display: block; font-size: 36px; } .unl span { font-size: 26px; color: var(--ink3); }

/* P1 Cover story */
.p1 .scrim { background: linear-gradient(rgba(6,9,14,.6), transparent 26%, transparent 42%, rgba(6,9,14,.96) 82%); }
.p1 .mast { font-family: var(--disp); font-weight: 800; font-size: 172px; letter-spacing: .01em; line-height: .86; text-align: center; margin: 0 -30px; }
.p1 .strap { display: flex; justify-content: space-between; font-family: var(--disp); font-size: 26px; letter-spacing: .16em; text-transform: uppercase; border-top: 3px solid #fff; margin-top: 18px; padding-top: 14px; }
.p1 h1 { font-size: 92px; margin: 14px 0 30px; max-width: 900px; }
.p1 .lines { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 0 44px; margin-bottom: 40px; }
.p1 .lines div { border-left: 4px solid var(--gold); padding-left: 20px; } .p1 .lines .num { font-size: 60px; display: block; } .p1 .lines span { font-size: 25px; color: var(--ink2); display: block; margin-top: 8px; max-width: 280px; line-height: 1.2; }

/* P2 Bento */
.p2 { background: #05070b; }
.bento { position: absolute; inset: 36px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 470px 1fr 1fr 96px; gap: 18px; }
.bento > div { background: var(--panel); border-radius: 30px; overflow: hidden; position: relative; padding: 32px; display: flex; flex-direction: column; }
.bento .a { grid-column: span 4; justify-content: flex-end; } .bento .a img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bento .a::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(5,7,11,.94) 92%); }
.bento .a > :not(img) { position: relative; z-index: 1; } .bento .a h1 { font-size: 72px; margin-top: 10px; } .bento .a .lab { font-size: 24px; }
.bento .b { grid-column: span 2; grid-row: span 2; background: var(--c); color: #06111c; justify-content: space-between; }
.bento .b .num { font-size: 250px; letter-spacing: -.04em; } .bento .b .num small { font-size: 110px; } .bento .b p { font-size: 34px; font-weight: 600; } .bento .b .bar { background: rgba(6,17,28,.2); height: 16px; margin-top: 18px; } .bento .b .bar b { background: #06111c; }
.bento .t { grid-column: span 2; justify-content: space-between; } .bento .t .lab { font-size: 22px; color: var(--ink3); }
.bento .t .num { font-size: 96px; } .bento .t .u { display: flex; gap: 20px; align-items: center; font-size: 34px; font-weight: 600; line-height: 1.15; } .bento .t .u img { width: 96px; height: 96px; border-radius: 14px; }
.bento .t .ic { display: flex; gap: 10px; } .bento .t .ic img { width: 64px; height: 64px; border-radius: 10px; }
.bento .f { grid-column: span 4; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 30px; background: transparent; border: 2px solid var(--line); } .bento .f .lab { font-size: 22px; color: var(--ink3); }

/* P3 Trading card */
.p3 { background: radial-gradient(circle at 50% 30%, #1d2a3f, #05070b 75%); }
.tc { position: absolute; left: 40px; top: 40px; width: 1000px; height: 1270px; border-radius: 40px; padding: 14px; background: linear-gradient(135deg, #f7dc8a, #e5b143 22%, #8a6516 45%, #f3d37a 62%, #b98a22 80%, #f7dc8a); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.tc .in { height: 100%; border-radius: 28px; background: linear-gradient(#141c2b, #0b1019); padding: 0 6px; display: flex; flex-direction: column; }
.tc .nm { display: flex; justify-content: space-between; align-items: center; padding: 26px 26px 22px; } .tc .nm h1 { font-size: 60px; } .tc .nm .num { font-size: 64px; color: var(--gold); }
.tc .win { width: 960px; height: 543px; object-fit: cover; border: 4px solid #e5b143; box-sizing: content-box; margin: 0 -4px; }
.tc .ty { margin: 0 20px; padding: 16px 6px; font-family: var(--disp); font-size: 25px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; }
.tc .mv { display: flex; align-items: center; gap: 26px; padding: 44px 26px 0; } .tc .mv img { width: 128px; height: 128px; } .tc .mv .star { width: 128px; height: 128px; display: grid; place-items: center; font-size: 84px; color: var(--gold); border: 4px solid var(--gold); border-radius: 50%; }
.tc .mv div { flex: 1; } .tc .mv .star, .tc .mv .num { flex: none; } .tc .mv b { font-size: 42px; display: block; } .tc .mv span { font-size: 28px; color: var(--ink3); } .tc .mv .num { font-size: 72px; color: var(--gold); }
.tc .ft { margin-top: auto; padding: 22px 26px 26px; display: flex; justify-content: space-between; align-items: center; font-family: var(--disp); font-size: 24px; letter-spacing: .1em; color: var(--ink3); } .tc .ft .id { font-size: 26px; color: #fff; letter-spacing: 0; } .tc .ft .av { width: 44px; height: 44px; } .tc .ft .mk { width: 30px; height: 30px; }

/* P4 Rarity dots */
.p4 .hero { font-size: 330px; color: var(--gold); margin: 30px 0 0 -10px; letter-spacing: -.04em; } .p4 .hero small { font-size: 150px; }
.p4 .of { font-size: 44px; color: var(--ink2); margin: 14px 0 40px; }
.dots { display: grid; grid-template-columns: repeat(20, 36px); gap: 12px; } .dots i { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.14); } .dots i.on { background: var(--gold); box-shadow: 0 0 26px var(--gold); }
.p4 .key { display: flex; align-items: center; gap: 14px; font-size: 26px; color: var(--ink3); margin-top: 20px; } .p4 .key i { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.2); }
.p4 .what { display: flex; align-items: center; gap: 30px; margin-bottom: 44px; } .p4 .what img { width: 320px; height: 180px; object-fit: cover; border: 3px solid var(--gold); } .p4 .what b { font-size: 50px; display: block; line-height: 1.08; } .p4 .what span { font-size: 30px; color: var(--ink3); display: block; margin-top: 10px; }

/* P5 Ledger: type only */
.p5 { background: #0b0f16; } .p5 .safe { border-top: 6px solid var(--c); padding-top: 30px; }
.p5 h1 { font-size: 76px; margin-top: 12px; } .p5 .hero { font-size: 440px; letter-spacing: -.05em; margin: 30px 0 26px -14px; } .p5 .hero small { font-size: 190px; color: var(--ink3); letter-spacing: -.03em; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; height: 30px; } .segs i { background: rgba(255,255,255,.14); } .segs i.on { background: var(--c); }
.led { margin: 36px 0 34px; } .led div { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0; border-bottom: 2px solid var(--line); font-size: 34px; color: var(--ink3); }
.led b { font-family: var(--disp); font-size: 44px; color: #fff; } .led b em { font-style: normal; color: var(--ink2); font-family: var(--sans); font-size: 32px; font-weight: 600; margin-right: 18px; }

/* P6 Series */
.p6 .band { position: absolute; left: 0; top: 0; width: 1080px; height: 400px; object-fit: cover; } .p6 .scrim { background: linear-gradient(rgba(8,12,20,.25), var(--base) 400px); }
.p6 h1 { font-size: 110px; margin: 150px 0 12px; } .p6 .cnt { font-size: 34px; color: var(--ink2); margin-bottom: 26px; } .p6 .cnt b { color: var(--gold); } .p6 .cnt u { text-decoration: none; color: var(--silver); font-weight: 700; }
.p6 .segs { height: 22px; gap: 6px; } .p6 .segs i.b { background: var(--silver); } .p6 .segs i.s { background: rgba(102,192,244,.5); }
.rows { margin: 30px 0 24px; display: flex; flex-direction: column; gap: 19px; }
.rows > div { display: grid; grid-template-columns: 80px minmax(0, 1fr) 130px; gap: 24px; align-items: center; } .rows span { min-width: 0; display: block; } .rows img { width: 80px; height: 80px; object-fit: cover; }
.rows p { font-size: 32px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 12px; } .rows p small { font-size: 22px; font-family: var(--disp); letter-spacing: .12em; color: var(--ink3); margin-left: 12px; text-transform: uppercase; }
.rows .bar { height: 10px; } .rows .num { font-size: 48px; text-align: right; color: var(--c); }

// Shrinks a title until it fits its lines: data-fit="max,min,lines"
function fit(root) {
  root.querySelectorAll('[data-fit]').forEach(el => { const [max, min, lines] = el.dataset.fit.split(',').map(Number); let s = max; el.style.fontSize = s + 'px';
    const z = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1;
    while ((el.getBoundingClientRect().height / z > parseFloat(getComputedStyle(el).lineHeight) * lines + 2 || el.scrollWidth > el.clientWidth + 1) && s > min) { s -= 2; el.style.fontSize = s + 'px'; } });
}

const q = new URLSearchParams(location.search), root = document.getElementById('root');
if (q.get('d')) {
  const id = q.get('d'); root.innerHTML = `<div class="wrap" style="display:inline-block;${id[0] === 'o' ? 'padding:18px 20px 26px' : ''}">${D[id].html()}</div>`;
} else {
  document.body.className = 'sheet';
  const ids = k => Object.keys(D).filter(id => id[0] === k);
  const cell = (id, cls) => `<div class="cell ${cls}"><div class="z">${D[id].html()}</div><p><b>${id.toUpperCase()} · ${D[id].name}</b>${esc(D[id].note)}</p></div>`;
  const stage = [art.eiyuden.hero, xb.hero, art.so2.hero, I + 'ra-shot-16452.png', art.lego2k.hero, xb.hero, I + 'ra-shot-16244.png', art.lego2k.hero, I + 'ra-shot-16244.png', xb.hero];
  root.innerHTML = `<header><div class="by">Design by Fable 5.2 · 14 Nov 2026</div><h2>Share cards: forty designs</h2>
    <p>Ten stories, ten posts, ten wide cards and ten overlays, each built around a single hero: one number, one picture or one unlock. Every figure is real, read from the data branch on 14 Nov 2026.</p></header>
    <h3>Stories · 1080 × 1920</h3><p>The dashed bands are the 250px Instagram covers with its own UI. Text and identity stay between them; art and texture may run under.</p><div class="grid">${ids('s').map(id => cell(id, 'st')).join('')}</div>
    <h3>Posts · 1080 × 1350</h3><p>The 4 : 5 feed size. Same grammar, more room for lists and grids.</p><div class="grid">${ids('p').map(id => cell(id, 'po')).join('')}</div>
    <h3>Wide · 1200 × 630</h3><p>The landscape size for Facebook, X, LinkedIn and Discord posts, and the link preview (1.91 : 1). Two columns instead of a stack; text stays 56px from the sides.</p><div class="grid g3">${ids('w').map(id => cell(id, 'wi')).join('')}</div>
    <h3>Overlays · transparent, exported at 3×</h3><p>Shown at their real size on a photo. Each brings its own dark fill.</p><div class="grid">${ids('o').map((id, i) => `<div class="cell ovc"><div class="z" style="background-image:url('${stage[i]}')${stage[i].includes('ra-shot') ? ';image-rendering:pixelated' : ''}">${D[id].html()}</div><p><b>${id.toUpperCase()} · ${D[id].name} · ${D[id].size}</b>${esc(D[id].note)}</p></div>`).join('')}</div>`;
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(root); document.body.dataset.ready = '1'; });
