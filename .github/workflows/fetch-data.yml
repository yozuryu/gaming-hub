name: Fetch Data

# Normally triggered by cron-job.org through the workflow_dispatch API:
# `incremental` every 30 min (:15 and :45) and `midnight` at 00:00 UTC. The schedule below is
# only a fallback in case the external cron stops: GitHub delays scheduled runs by hours.
#
# The three pipelines run one after another in one job. A platform that fails doesn't
# stop the others (each pipeline exits before writing when it fails, so its previous
# files stay); the job is marked failed at the end so GitHub still sends the email.
#
# Pipeline output lives on the `data` branch, not main (paths in scripts/data-paths.json):
# each run restores it into data/, runs the pipelines, and commits only to `data`. The
# midnight run squashes `data` into a single commit, so the branch holds at most a day of
# history. A run that changed data then deploys the site (deploy.yml).
run-name: >-
  ${{ github.event_name == 'schedule' && 'Data — fallback incremental' ||
      format('Data — {0} ({1})', inputs.mode, inputs.platforms) }}

on:
  schedule:
    - cron: '43 */6 * * *'  # fallback — incremental every 6h
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental = only writes on activity · midnight = RA full, Steam unlock, Xbox full refresh · full-refresh = every game on every platform · watchlist-only = RA want-to-play list'
        type: choice
        default: incremental
        options:
          - incremental
          - midnight
          - full-refresh
          - watchlist-only
      platforms:
        description: 'Platforms to run'
        type: choice
        default: all
        options:
          - all
          - ra
          - steam
          - xbox

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

env:
  MODE: ${{ inputs.mode || 'incremental' }}
  PLATFORMS: ${{ inputs.platforms || 'all' }}
  # Xbox sync paused (2026-10-10): not playing on Xbox, and OpenXBL intermittently answers 429
  # even with quota left. Scheduled runs (`all`) skip it; a manual run with platforms=xbox still
  # syncs. Set to 'true' to resume.
  XBOX_ENABLED: 'false'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Full history of `data` (at most a day of commits) so the midnight squash can count them
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data
          fetch-depth: 0

      # The pipelines read their previous output (caches, playtime baseline, history) from data/
      - name: Restore data
        run: |
          for p in $(node -p "require('./scripts/data-paths.json').paths.join(' ')"); do
            rm -rf "$p"
            if [ -e "_data/$p" ]; then mkdir -p "$(dirname "$p")"; cp -R "_data/$p" "$p"; fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: RetroAchievements
        id: ra
        if: env.PLATFORMS == 'all' || env.PLATFORMS == 'ra'
        continue-on-error: true
        env:
          RA_USERNAME: ${{ secrets.RA_USERNAME }}
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
        run: |
          case "$MODE" in
            midnight|full-refresh) npm run ra-fetch:full ;;
            watchlist-only)        npm run ra-fetch:watchlist ;;
            *)                     npm run ra-fetch ;;
          esac

      - name: Steam
        id: steam
        if: (env.PLATFORMS == 'all' || env.PLATFORMS == 'steam') && env.MODE != 'watchlist-only'
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
        run: |
          case "$MODE" in
            midnight)     npm run steam-fetch:unlocked ;;
            full-refresh) npm run steam-fetch:full ;;
            *)            npm run steam-fetch ;;
          esac

      - name: Xbox
        id: xbox
        if: (env.PLATFORMS == 'xbox' || (env.PLATFORMS == 'all' && env.XBOX_ENABLED == 'true')) && env.MODE != 'watchlist-only'
        continue-on-error: true
        env:
          XBOX_API_KEY: ${{ secrets.XBOX_API_KEY }}
          XBOX_XUID: ${{ secrets.XBOX_XUID }}
        run: |
          case "$MODE" in
            midnight|full-refresh) npm run xbox-fetch:full ;;
            *)                     npm run xbox-fetch ;;
          esac

      - name: Commit updated data
        id: commit
        if: ${{ !cancelled() }}
        run: |
          # Copy the generated paths back onto the data branch checkout (removals included)
          for p in $(node -p "require('./scripts/data-paths.json').paths.join(' ')"); do
            rm -rf "_data/$p"
            if [ -e "$p" ]; then mkdir -p "_data/$(dirname "$p")"; cp -R "$p" "_data/$p"; fi
          done
          cd _data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          changed=""
          for p in ra steam xbox; do
            git diff --staged --quiet -- "data/$p/" || changed="$changed${changed:+, }$p"
          done
          case "$MODE" in
            midnight)       MSG="chore: midnight refresh data" ;;
            full-refresh)   MSG="chore: full refresh data" ;;
            watchlist-only) MSG="chore: update ra watchlist" ;;
            *)              MSG="chore: update data" ;;
          esac
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          tip="$(git rev-parse HEAD)"

          if [ "$MODE" = "midnight" ]; then
            # Daily squash: the current tree as one parentless commit, replacing the day's commits
            tree="$(git write-tree)"
            if [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ] && [ "$(git rev-list --count HEAD)" = "1" ]; then
              echo "No changes, data branch already a single commit"
              exit 0
            fi
            squashed="$(git commit-tree "$tree" -m "chore: data snapshot ${changed:+($changed) }$STAMP")"
            git push --force-with-lease="data:$tip" origin "$squashed:refs/heads/data"
            [ "$tree" != "$(git rev-parse 'HEAD^{tree}')" ] && echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$MSG ($changed) $STAMP"
          # Only this workflow writes to data, one run at a time (concurrency group), so no rebase
          git push origin HEAD:refs/heads/data
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Report failed platforms
        if: steps.ra.outcome == 'failure' || steps.steam.outcome == 'failure' || steps.xbox.outcome == 'failure'
        run: |
          echo "::error::Failed: RA=${{ steps.ra.outcome }} Steam=${{ steps.steam.outcome }} Xbox=${{ steps.xbox.outcome }}"
          exit 1

  # Publish the new data: the site is main + the data branch (deploy.yml)
  deploy:
    needs: fetch
    if: ${{ !cancelled() && needs.fetch.outputs.deploy == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
