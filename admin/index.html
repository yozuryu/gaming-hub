<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · gaming-hub</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    { "imports": {
        "react":            "https://esm.sh/react@18.2.0",
        "react-dom":        "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react":     "https://esm.sh/lucide-react@0.263.1"
    } }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Admin shell: the site's own palette (CLAUDE.md design system), sharp 3px corners, the site font.
       Sidebar | page header (icon, title, what it edits, Save) | page body: panes of lists and editors */
    :root {
      --bg: #171a21; --panel: #1b2838; --panel2: #202d39; --deep: #131a22; --ink: #101214;
      --line: #2a475e; --line2: #1f2f3d; --text: #c6d4df; --dim: #8f98a0; --mute: #546270;
      --blue: #66c0f4; --gold: #e5b143; --green: #52b043; --red: #ff6b6b; --cyan: #57cbde;
    }
    body { background: var(--bg); color: var(--text); font: 13px/1.45 'Segoe UI', Arial, sans-serif; margin: 0; }
    ::-webkit-scrollbar { width: 8px; height: 8px } ::-webkit-scrollbar-track { background: transparent }
    ::-webkit-scrollbar-thumb { background: #2a475e; border-radius: 4px; border: 2px solid var(--bg) }
    input, textarea, select { color-scheme: dark }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

    .input { height: 32px; background: var(--deep); border: 1px solid var(--line); border-radius: 3px; padding: 0 10px; font-size: 12px; color: var(--text); outline: none; width: 100%; transition: border-color .15s, box-shadow .15s; }
    .input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(102,192,244,0.14); }
    .input::placeholder { color: var(--mute); }
    .search { position: relative; display: flex; align-items: center; width: 100%; }
    .search > svg { position: absolute; left: 9px; color: var(--mute); pointer-events: none; }
    .search .input { padding-left: 30px; padding-right: 28px; }
    .search > button { position: absolute; right: 6px; width: 20px; height: 20px; display: grid; place-items: center; color: var(--mute); border-radius: 2px; }
    .search > button:hover { color: var(--text); background: var(--panel2); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 3px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: background .15s, color .15s, border-color .15s; border: 1px solid transparent; }
    .btn:disabled { cursor: not-allowed; opacity: 0.45; }
    .btn-sm { height: 26px; padding: 0 9px; font-size: 11px; gap: 5px; }
    .btn-primary { background: var(--blue); color: var(--ink); }
    .btn-primary:not(:disabled):hover { background: #84ceff; }
    .btn-primary:disabled { background: var(--line); color: var(--mute); opacity: 1; }
    .btn-outline { border-color: var(--line); color: var(--text); background: transparent; }
    .btn-outline:not(:disabled):hover { border-color: var(--blue); color: #fff; background: rgba(102,192,244,0.06); }
    .btn-ghost { color: var(--dim); background: transparent; border: none; cursor: pointer; font-size: 12px; transition: color .15s, background .15s; }
    .btn-ghost.btn { font-weight: 500; }
    .btn-ghost:hover { color: #fff; }
    .btn-ghost.btn:hover { background: var(--panel2); }
    .btn-danger:hover { color: var(--red) !important; }
    .btn-danger.btn-outline:not(:disabled):hover { border-color: rgba(255,107,107,0.6); background: rgba(255,107,107,0.08); }
    .btn-red { background: #c0392b; color: #fff; }
    .btn-red:hover { background: #d9473a; }
    .icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 3px; color: var(--mute); transition: color .15s, background .15s; flex-shrink: 0; }
    .icon-btn:hover { color: #fff; background: var(--panel2); }

    /* Panes: a list beside an editor. .pane-h is the 48px strip on top of each */
    .pane { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .pane-side { border-right: 1px solid var(--line); background: #182230; }
    .pane-h { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .pane-f { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--mute); flex-shrink: 0; }
    .pane-t { font-size: 14px; font-weight: 600; color: #fff; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub-h { display: flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); background: var(--deep); border-bottom: 1px solid var(--line2); }

    /* List rows: icon, two lines of text, trailing marks. .on = selected */
    .lrow { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 12px; text-align: left; border-left: 2px solid transparent; border-bottom: 1px solid var(--line2); transition: background .12s; }
    .lrow:hover { background: rgba(32,45,57,0.7); }
    .lrow.on { background: rgba(102,192,244,0.09); border-left-color: var(--blue); }
    .lrow.on .lrow-t { color: #fff; }
    .lrow-i { width: 28px; height: 28px; border-radius: 2px; object-fit: cover; background: var(--ink); border: 1px solid var(--ink); flex-shrink: 0; }
    .lrow-b { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .lrow-t { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lrow-s { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
    .card-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .card-b { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .label { font-size: 12px; font-weight: 500; color: var(--dim); }
    .hint { font-size: 11px; color: var(--mute); }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 3px; font-size: 11px; border: 1px solid var(--line); color: var(--dim); background: var(--deep); white-space: nowrap; }
    .chip-gold { color: var(--gold); border-color: rgba(229,177,67,0.4); background: rgba(229,177,67,0.08); }
    .chip-blue { color: var(--blue); border-color: rgba(102,192,244,0.35); background: rgba(102,192,244,0.08); }
    .chip-red { color: var(--red); border-color: rgba(255,107,107,0.35); background: rgba(255,107,107,0.08); }
    .tag-up { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--deep); border: 1px solid var(--line); border-radius: 3px; }
    .seg button { height: 24px; padding: 0 9px; border-radius: 2px; font-size: 11px; font-weight: 600; color: var(--mute); display: inline-flex; align-items: center; gap: 5px; }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: var(--line); color: #fff; }

    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 32px; text-align: center; }
    .empty-i { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--mute); margin-bottom: 4px; }
    .empty-t { font-size: 13px; font-weight: 600; color: var(--dim); }
    .empty-h { font-size: 12px; color: var(--mute); max-width: 320px; }

    .shimmer { background: linear-gradient(90deg, #1b2838 0%, #243445 50%, #1b2838 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 2px; }
    @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

    .nav-i { width: 100%; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 3px; font-size: 12px; color: var(--dim); transition: background .12s, color .12s; position: relative; }
    .nav-i:hover { color: #fff; background: rgba(42,71,94,0.45); }
    .nav-i.on { color: #fff; background: rgba(102,192,244,0.12); }
    .nav-i.on::before { content: ""; position: absolute; left: -8px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 2px 2px 0; background: var(--blue); }
    .nav-i.on svg { color: var(--blue); }
    .nav-g { display: flex; align-items: center; gap: 7px; padding: 14px 10px 6px; font-size: 10px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: 0.08em; }
    .nav-g img { width: 14px; height: 14px; border-radius: 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .kbd { font-size: 10px; color: var(--mute); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; line-height: 15px; }

    /* Motion: copy of the .anim-* classes in assets/motion.css (admin-server.js serves only this page) */
    .anim-in       { animation: motion-in 240ms cubic-bezier(0.2, 0.7, 0.3, 1) backwards; }
    .anim-fade     { animation: motion-fade 180ms ease-out backwards; }
    .anim-pop      { animation: motion-pop 180ms cubic-bezier(0.2, 0.7, 0.3, 1) backwards; }
    .anim-backdrop { animation: motion-fade 160ms ease-out backwards; }
    @keyframes motion-in   { from { opacity: 0; transform: translateY(6px); } }
    @keyframes motion-fade { from { opacity: 0; } }
    @keyframes motion-pop  { from { opacity: 0; transform: translateY(4px) scale(0.97); } }
    @media (prefers-reduced-motion: reduce) { .anim-in, .anim-fade, .anim-pop, .anim-backdrop, .shimmer { animation: none; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
import React, { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext } from 'react';
import { createRoot } from 'react-dom/client';
import { createPortal } from 'react-dom';
import {
    Settings, KeyRound, Play, FileDiff, Layers, Hourglass, Sprout, Image as ImageIcon, Trophy, Save, RotateCw, Power,
    Search, X, Plus, Star, Eye, EyeOff, Lock, ExternalLink, ChevronLeft, Lightbulb, Inbox, Check, Terminal, RefreshCw,
    Download, Bug, ListPlus, FileJson, Clock, Github, Smartphone, Monitor, DownloadCloud, Pause, Loader2, XCircle, CheckCircle2, MinusCircle, Maximize2, Trash2, Pencil, Tag, Globe, LayoutGrid, Server, Square, CircleSlash, Bookmark,
    UploadCloud, GitCommit, CalendarClock, AlertTriangle, ChevronUp, ChevronDown, FolderTree, Wand2,
} from 'lucide-react';

const API       = 'http://localhost:3131/api';
const RA_MEDIA  = 'https://media.retroachievements.org';
const RA_SITE   = 'https://retroachievements.org';
const STEAM_ACH_ICON = (appId, hash) =>
    hash ? `https://steamcdn-a.akamaihd.net/steamcommunity/public/images/apps/${appId}/${hash}` : null;

// ── Generic fetch helpers ─────────────────────────────────────────────────────

const apiGet  = (url)        => fetch(url).then(r => r.json());
const apiData = (file)       => apiGet(`${API}/data?file=${encodeURIComponent(file)}`);
const apiSave = (file, data) => fetch(`${API}/data?file=${encodeURIComponent(file)}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
});

// ── Shared small components ───────────────────────────────────────────────────

const SectionHeader = ({ color = '#66c0f4', children, right }) => (
    <div className="flex items-center gap-2 mb-3">
        <span className="w-[3px] h-[14px] rounded-[1px] shrink-0" style={{ background: color }} />
        <span className="text-[13px] text-white tracking-wide uppercase font-medium flex-1">{children}</span>
        {right}
    </div>
);

// The page header has a slot on the right (App puts it there); modules render their Save into it,
// so every page saves from the same place
const HeaderSlot = createContext(null);
const HeaderActions = ({ children }) => {
    const slot = useContext(HeaderSlot);
    return slot ? createPortal(children, slot) : null;
};

// Save in the page header: unsaved changes are flagged beside it, ⌘S / Ctrl+S saves
const SaveBar = ({ dirty, saving, saved, onSave, extra }) => {
    const ref = useRef({});
    ref.current = { dirty, saving, onSave };
    useEffect(() => {
        const onKey = e => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (ref.current.dirty && !ref.current.saving) ref.current.onSave();
            }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
    }, []);
    return (
        <HeaderActions>
            {extra}
            {dirty && !saving && <span className="flex items-center gap-1.5 text-[12px] text-[#e5b143] anim-fade"><span className="dot bg-[#e5b143]" />Unsaved changes</span>}
            {saved && !dirty && <span className="flex items-center gap-1 text-[12px] text-[#57cbde] anim-fade"><Check size={14} />Saved</span>}
            <button className="btn btn-primary" onClick={onSave} disabled={!dirty || saving} title="Save (⌘S)">
                {saving ? <RotateCw size={14} className="animate-spin" /> : <Save size={14} />}{saving ? 'Saving…' : 'Save'}
            </button>
        </HeaderActions>
    );
};

// Search field with an icon and a clear button
const SearchInput = ({ value, onChange, placeholder, className = '', autoFocus }) => (
    <div className={`search ${className}`}>
        <Search size={14} />
        <input className="input" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} autoFocus={autoFocus} />
        {value && <button onClick={() => onChange('')} aria-label="Clear"><X size={13} /></button>}
    </div>
);

// Nothing selected / nothing to show: an icon, a short title and what to do
const Empty = ({ icon: Icon, title, hint, children }) => (
    <div className="empty anim-fade">
        {Icon && <div className="empty-i"><Icon size={20} /></div>}
        <div className="empty-t">{title}</div>
        {hint && <div className="empty-h">{hint}</div>}
        {children}
    </div>
);

// Loading: shimmer rows in the shape of a list (or cards), never "Loading…"
const SkRows = ({ n = 10, icon = true }) => (
    <div className="flex flex-col" aria-busy="true">
        {Array.from({ length: n }, (_, i) => (
            <div key={i} className="flex items-center gap-2.5 px-3.5 py-2 border-b border-[#1f2f3d]">
                {icon && <div className="shimmer w-7 h-7 shrink-0" />}
                <div className="flex-1 flex flex-col gap-1.5"><div className="shimmer h-2.5" style={{ width: `${45 + ((i * 37) % 40)}%` }} /><div className="shimmer h-2 w-1/4" /></div>
            </div>
        ))}
    </div>
);
const SkPage = () => (
    <div className="p-6 flex flex-col gap-4 max-w-[860px]" aria-busy="true">
        {[180, 120, 160].map((h, i) => <div key={i} className="shimmer w-full" style={{ height: h, borderRadius: 3 }} />)}
    </div>
);
const SkSplit = ({ side = 260 }) => (
    <div className="flex h-full">
        <div className="pane pane-side shrink-0" style={{ width: side }}>
            <div className="pane-h"><div className="shimmer h-8 w-full" /></div>
            <SkRows n={14} />
        </div>
        <div className="flex-1" />
    </div>
);

function useSaver(file) {
    const [data,   setData]   = useState(null);
    const [dirty,  setDirty]  = useState(false);
    const [saving, setSaving] = useState(false);
    const [saved,  setSaved]  = useState(false);

    const load   = useCallback((d) => { setData(d); setDirty(false); setSaved(false); }, []);
    const update = useCallback((next) => { setData(next); setDirty(true); setSaved(false); }, []);

    const save = useCallback(async () => {
        setSaving(true);
        await apiSave(file, data);
        setSaving(false); setDirty(false); setSaved(true);
    }, [file, data]);

    return { data, load, update, dirty, saving, saved, save };
}

// ═══════════════════════════════════════════════════════════════════════════════
// MODULE: Site Config
// ═══════════════════════════════════════════════════════════════════════════════

const TagList = ({ tags, onChange }) => {
    const [input, setInput] = useState('');
    const add = () => {
        const v = input.trim();
        if (v && !tags.includes(v)) { onChange([...tags, v]); }
        setInput('');
    };
    return (
        <div className="flex flex-wrap items-center gap-1.5 p-1.5 min-h-[38px] bg-[#131a22] border border-[#2a475e] rounded-[3px] focus-within:border-[#66c0f4]">
            {tags.map((t, i) => (
                <span key={t} className="flex items-center gap-1 h-[24px] pl-2 pr-1 text-[12px] bg-[#202d39] border border-[#2a475e] rounded-[3px] text-[#c6d4df] anim-fade">
                    {t}
                    <button className="icon-btn !w-[18px] !h-[18px] hover:!text-[#ff6b6b]" onClick={() => onChange(tags.filter((_, j) => j !== i))} aria-label={`Remove ${t}`}><X size={12} /></button>
                </span>
            ))}
            <input className="flex-1 min-w-[120px] h-[24px] bg-transparent outline-none text-[12px] px-1 placeholder:text-[#546270]" value={input}
                onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && add()} placeholder="Add a tag and press Enter" />
        </div>
    );
};

const Toggle = ({ checked, onChange, label }) => (
    <button type="button" role="switch" aria-checked={checked} onClick={() => onChange(!checked)} className="flex items-center gap-2 select-none group">
        <span className={`inline-block w-[34px] h-[18px] rounded-full transition-colors relative shrink-0 ${checked ? 'bg-[#66c0f4]' : 'bg-[#2a475e] group-hover:bg-[#35576f]'}`}>
            <span className={`block absolute top-[2px] left-0 w-[14px] h-[14px] rounded-full bg-white shadow transition-transform ${checked ? 'translate-x-[18px]' : 'translate-x-[2px]'}`} />
        </span>
        {label && <span className={`text-[12px] ${checked ? 'text-[#c6d4df]' : 'text-[#546270]'}`}>{label}</span>}
    </button>
);

const Field = ({ label, hint, children }) => (
    <div className="flex flex-col gap-1.5">
        <label className="label">{label}</label>
        {children}
        {hint && <span className="hint">{hint}</span>}
    </div>
);

// A card with a header: an icon (Lucide component or image URL), a title and an optional note on the right
const Card = ({ icon: Icon, img, title, note, children, className = '' }) => (
    <section className={`card ${className}`}>
        <div className="card-h">
            {img ? <img src={img} alt="" className="w-[18px] h-[18px] rounded-[2px]" /> : Icon && <Icon size={16} className="text-[#66c0f4]" />}
            <span className="text-[13px] text-white font-semibold flex-1">{title}</span>
            {note}
        </div>
        <div className="card-b">{children}</div>
    </section>
);

const PLATFORM_META = {
    retroachievements: { label: 'RetroAchievements', img: '/assets/icon-ra.png' },
    ra:                { label: 'RetroAchievements', img: '/assets/icon-ra.png' },
    steam:             { label: 'Steam',             img: '/assets/icon-steam.png' },
    xbox:              { label: 'Xbox',              img: '/assets/icon-xbox.png' },
};

// Hub sections that can be switched off (config.json `<id>.visible`, read by loadHubProfile() in index.html)
const HUB_SECTIONS = [
    { id: 'playing',     label: 'Playing',         hint: 'Games in rotation, first on the hub',      where: 'all' },
    { id: 'series',      label: 'Series',          hint: 'Shared series cards',                      where: 'all' },
    { id: 'activity',    label: 'Recent activity', hint: 'The feed of play and unlocks per day',     where: 'all' },
    { id: 'completions', label: 'Completions',     hint: 'Totals and the latest completion',         where: 'desktop' },
    { id: 'analytics',   label: 'Analytics',       hint: '30 days of play, unlocks and top game',    where: 'desktop' },
];

function SiteConfigModule() {
    const { data, load, update, dirty, saving, saved, save } = useSaver('data/hub/config.json');
    const [sync, setSync] = useState(null);

    useEffect(() => {
        apiData('data/hub/config.json').then(d => load(d));
        apiGet(`${API}/sync-state`).then(setSync).catch(() => {});
    }, []);

    if (!data || !data.tags) return <SkPage />;

    const set = (path, val) => {
        const next = JSON.parse(JSON.stringify(data));
        const keys = path.split('.');
        let obj = next;
        keys.slice(0, -1).forEach(k => { obj = (obj[k] ??= {}); });
        obj[keys[keys.length - 1]] = val;
        update(next);
    };

    return (
        <div className="h-full overflow-y-auto">
            <SaveBar dirty={dirty} saving={saving} saved={saved} onSave={save} />
            <div className="p-6 grid gap-4 max-w-[1100px] lg:grid-cols-2 items-start">
                <Card icon={Globe} title="Identity">
                    <Field label="Username"><input className="input" value={data.username} onChange={e => set('username', e.target.value)} /></Field>
                    <Field label="Motto" hint="Under the name in the hub header"><input className="input" value={data.motto} onChange={e => set('motto', e.target.value)} /></Field>
                    <Field label="Site URL"><input className="input" value={data.siteUrl} onChange={e => set('siteUrl', e.target.value)} /></Field>
                </Card>

                <Card icon={Tag} title="Tags" note={
                    <button className="btn btn-ghost btn-sm" onClick={() => {
                        const name = prompt('Group name (e.g. "genre"):');
                        if (name?.trim()) set('tags', { ...data.tags, [name.trim()]: [] });
                    }}><Plus size={13} />Group</button>
                }>
                    {Object.entries(data.tags).map(([group, tags]) => (
                        <div key={group} className="flex flex-col gap-1.5 anim-fade">
                            <div className="flex items-center gap-2">
                                <span className="label capitalize flex-1">{group}</span>
                                <button className="icon-btn !w-6 !h-6 hover:!text-[#ff6b6b]" title={`Remove the ${group} group`} onClick={() => {
                                    const next = { ...data.tags };
                                    delete next[group];
                                    set('tags', next);
                                }}><Trash2 size={13} /></button>
                            </div>
                            <TagList tags={tags} onChange={v => set(`tags.${group}`, v)} />
                        </div>
                    ))}
                </Card>

                <Card icon={LayoutGrid} title="Platforms">

// modal: null | { mode: 'add' | 'rename' | 'delete', id?: string, initialValue?: string, suggestedGameIds?: number[] }
function SeriesModal({ mode, seriesName, initialValue, onConfirm, onCancel }) {
    const [value, setValue] = useState(mode === 'rename' ? seriesName : (initialValue ?? ''));
    const inputRef = useRef(null);

    useEffect(() => {
        inputRef.current?.focus();
        inputRef.current?.select();
    }, []);

    const onKey = (e) => {
        if (e.key === 'Enter' && (mode === 'delete' || value.trim())) onConfirm(value.trim());
        if (e.key === 'Escape') onCancel();
    };

    const title = mode === 'add' ? 'New series' : mode === 'rename' ? 'Rename series' : 'Delete series';
    return (
        <div className="fixed inset-0 z-50 flex items-center justify-center" onKeyDown={onKey}>
            <div className="absolute inset-0 bg-black/65 anim-backdrop" onClick={onCancel} />
            <div className="relative z-10 card shadow-2xl w-[380px] flex flex-col anim-pop">
                <div className="card-h">
                    {mode === 'delete' ? <Trash2 size={16} className="text-[#ff6b6b]" /> : mode === 'rename' ? <Pencil size={16} className="text-[#66c0f4]" /> : <Layers size={16} className="text-[#66c0f4]" />}
                    <span className="text-[14px] text-white font-semibold flex-1">{title}</span>
                    <button className="icon-btn" onClick={onCancel} aria-label="Close"><X size={15} /></button>
                </div>
                <div className="card-b">
                    {mode === 'delete' ? (
                        <p className="text-[13px] text-[#8f98a0]">
                            Delete <span className="text-white font-medium">{seriesName}</span>? It's saved at once and can't be undone.
                        </p>
                    ) : (
                        <Field label="Name"><input ref={inputRef} className="input" value={value} onChange={e => setValue(e.target.value)} placeholder="Series name" /></Field>
                    )}
                    <div className="flex justify-end gap-2">
                        <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
                        {mode === 'delete'
                            ? <button className="btn btn-red" onClick={() => onConfirm()}><Trash2 size={13} />Delete</button>
                            : <button className="btn btn-primary" disabled={!value.trim()} onClick={() => onConfirm(value.trim())}>
                                {mode === 'add' ? <><Plus size={13} />Create</> : <><Check size={13} />Rename</>}
                              </button>
                        }
                    </div>
                </div>
            </div>
        </div>
    );
}

// Sort key: symbols first (0), numbers second (1), letters last (2)
const seriesSortKey = name => {
    if (/^[a-zA-Z]/.test(name)) return '2' + name.toLowerCase();
    if (/^\d/.test(name))       return '1' + name.toLowerCase();
    return                             '0' + name.toLowerCase();
};

// Derive a "series key" from a game title by stripping subtitles and trailing numbers/roman numerals
function seriesKey(title) {
    let s = title;
    s = s.replace(/\[.*?\]/g, '');   // [Subset - ...], [E3 Preview], etc.
    s = s.replace(/~[^~]+~/g, '');   // ~Tag~
    s = s.replace(/\s*:\s+.*$/, ''); // ": subtitle"
    s = s.replace(/\s+(XIV|XIII|XII|XI|IX|VIII|VII|VI|IV|III|II|I|XVI|XV|X|V)\s*$/i, '');
    s = s.replace(/\s+\d+(\s*[&]\s*\d+)?\s*$/, '');
    s = s.replace(/[:\-,]+$/, '').trim();
    s = s.replace(/[^a-zA-Z0-9\s]/g, '').trim(); // strip remaining symbols (keep alphanumeric + spaces)
    return s.toLowerCase();
}

function toTitleCase(s) {
    const minor = new Set(['a','an','the','of','in','on','at','and','but','or','for','nor','to']);
    return s.replace(/\S+/g, (w, i) => (i === 0 || !minor.has(w)) ? w[0].toUpperCase() + w.slice(1) : w);
}

function computeRecommendations(allGames, series) {
    const assignedIds = new Set((series || []).flatMap(s => s.gameIds));
    const unassigned  = allGames.filter(g => !assignedIds.has(g.id));
    const groupMap    = new Map();
    unassigned.forEach(g => {
        const key = seriesKey(g.title);
        if (key.length < 4) return;
        if (!groupMap.has(key)) groupMap.set(key, new Map());
        groupMap.get(key).set(g.id, g); // dedupe by id
    });
    return Array.from(groupMap.entries())
        .map(([key, gMap]) => ({ name: toTitleCase(key), games: Array.from(gMap.values()) }))
        .filter(r => r.games.length >= 3)
        .sort((a, b) => b.games.length - a.games.length);
}

// One game row: icon, title (links out), console, watchlist mark, then the row's own controls
const GameRow = ({ g, children, onClick, accent }) => {
    const Tag = onClick ? 'button' : 'div';
    return (
        <Tag onClick={onClick} className={`lrow group ${accent ? '!border-l-[#e5b143]/50' : ''}`}>
            <img src={g.icon} alt="" className="lrow-i" />
            <span className="lrow-b">
                <a href={g.url} target="_blank" rel="noreferrer" className="lrow-t hover:!text-[#66c0f4]" onClick={e => e.stopPropagation()}>{g.title}</a>
                {g.consoleName && <span className="lrow-s">{g.consoleName}</span>}
            </span>
            {g.fromWatchlist && <Bookmark size={12} className="text-[#66c0f4]/70 shrink-0" aria-label="On the want-to-play list"><title>On the want-to-play list</title></Bookmark>}
            {children}
        </Tag>
    );
};

// Sub-series (`groups: [{ id, name, gameIds }]` on a series; the Series page and the RA and Steam Series tabs show them).
// Suggestions: other series whose games sit (80%+) inside this one, then words the titles share after the
// series name, one level finer when the next real word splits them into arcs ("Trails in the Sky", "Trails of Cold Steel")
const suggestSubs = (sel, gameMap, platformSeries) => {
    const taken = new Set((sel.groups ?? []).flatMap(g => g.gameIds));
    const free = sel.gameIds.filter(id => !taken.has(id));
    const out = [], used = new Set();
    const SKIP = /^(the|of|in|to|from|a|an)$/i;
    const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    for (const ps of platformSeries) {
        const inside = ps.gameIds.filter(id => free.includes(id) && !used.has(id));
        // The same series on a platform ("Tales" in "Tales of") is not a sub-series of it
        const a = ps.name.toLowerCase(), b = sel.name.toLowerCase();
        if (a.startsWith(b) && a.length === b.length || b.startsWith(a) || inside.length < 2 || inside.length < ps.gameIds.length * 0.8 || inside.length > sel.gameIds.length * 0.7) continue;
        inside.forEach(id => used.add(id));
        out.push({ name: ps.name.replace(new RegExp(`^${esc(sel.name)}\\s*`, 'i'), '') || ps.name, gameIds: inside, why: `Series "${ps.name}"` });
    }
    const words = id => {
        const t = (gameMap[id]?.title ?? '').replace(/~[^~]+~\s*/g, '');
        const rest = t.toLowerCase().startsWith(sel.name.toLowerCase()) ? t.slice(sel.name.length) : t.replace(/^[^:]*:/, '');
        const ws = rest.replace(/^[\s:\-–]+/, '').split(/\s+/).map(w => w.replace(/[^\p{L}]+$/u, '').replace(/\d+$/, '')).filter(Boolean);
        while (ws.length > 1 && SKIP.test(ws[0])) ws.shift();   // "Tales of the Abyss" groups on "Abyss"
        return ws;
    };
    // Keep adding words while every game shares the next one ("Cold" → "Cold Steel")
    const extend = (ids, name, i) => { while (true) { const next = ids.map(id => words(id)[i]); if (next[0] && next.every(x => x?.toLowerCase() === next[0].toLowerCase()) && !SKIP.test(next[0])) { name = [...name, next[0]]; i++; } else return [name, i]; } };
    const byKey = {};
    for (const id of free.filter(id => !used.has(id))) { const w = words(id)[0]; if (w) (byKey[w.toLowerCase()] ??= { w, ids: [] }).ids.push(id); }
    // A numbered entry with its ports and subsets ("Final Fantasy IV") isn't a sub-series: skip Roman numerals
    // (except X, a sub-series name in its own right) and title groups under 3 games
    const NUMERAL = /^(?!x$)[ivxlc]+$/i;
    for (const { w, ids } of Object.values(byKey)) {
        if (ids.length < 3 || NUMERAL.test(w)) continue;
        const [name, i] = extend(ids, [w], 1);
        const arcs = {};
        for (const id of ids) {
            const ws = words(id).slice(i); let k = 0; while (ws[k] && SKIP.test(ws[k])) k++;
            if (ws[k]) (arcs[ws[k].toLowerCase()] ??= { pre: [...name, ...ws.slice(0, k + 1)], at: i + k + 1, ids: [] }).ids.push(id);
        }
        const big = Object.values(arcs).filter(a => a.ids.length >= 2);
        if (big.length >= 2) { for (const a of big) if (a.ids.length >= 3 || big.every(b => b.ids.length >= 2)) out.push({ name: extend(a.ids, a.pre, a.at)[0].join(' '), gameIds: a.ids, why: 'Same words in the title' }); continue; }
        const label = name.join(' ');
        if (label.toLowerCase() === sel.name.toLowerCase()) continue;
        out.push({ name: label.length <= 2 ? `${sel.name} ${label}` : label, gameIds: ids, why: 'Same words in the title' });
    }
    return out.sort((a, b) => b.gameIds.length - a.gameIds.length);
};

function SeriesModule({ cfg }) {
    const [allGames,        setAllGames]        = useState([]);
    const [series,          setSeries]          = useState(null);
    const [selectedId,      setSelectedId]      = useState(null);
    const [dirty,           setDirty]           = useState(false);
    const [saving,          setSaving]          = useState(false);
    const [saved,           setSaved]           = useState(false);
    const [gameSearch,      setGameSearch]      = useState('');
    const [listSearch,      setListSearch]      = useState('');
    const [addSearch,       setAddSearch]       = useState('');
    const [modal,           setModal]           = useState(null);
    const [showSuggestions,  setShowSuggestions]  = useState(false);
    const [showUnassigned,   setShowUnassigned]   = useState(false);
    const [unassignedSearch, setUnassignedSearch] = useState('');
    const [picked,  setPicked]  = useState(() => new Set());   // games ticked to move between sub-series
    const [editing, setEditing] = useState(null);              // sub-series whose name is being edited
    const [subSug,  setSubSug]  = useState(false);
    const [suggestFrom, setSuggestFrom] = useState([]);        // shared: the RA series as "ra:<id>"; Steam: the shared sub-series
    useEffect(() => {
        const from = cfg.subSuggestFrom;
        if (from) apiData(from.file).then(d => setSuggestFrom((Array.isArray(d) ? d : [])
            // Steam: the shared series' sub-series, their Steam games only ("steam:223870" → 223870)
            .flatMap(x => from.groupsOf ? (x.groups ?? []).map(g => ({ name: g.name, gameIds: g.gameIds.filter(id => id.startsWith(`${from.groupsOf}:`)).map(id => Number(id.split(':')[1])) })) : [x])
            .map(x => ({ ...x, gameIds: from.id ? x.gameIds.map(from.id) : x.gameIds })))).catch(() => {});
    }, []);
    useEffect(() => { setPicked(new Set()); setSubSug(false); setEditing(null); }, [selectedId]);

    useEffect(() => {
        Promise.all([
            cfg.loadGames(),
            apiData(cfg.file),
        ]).then(([g, s]) => {
            setAllGames(g);
            setSeries((Array.isArray(s) ? s : []).sort((a, b) => seriesSortKey(a.name).localeCompare(seriesSortKey(b.name))));
        });
    }, []);

    const selected = series?.find(s => s.id === selectedId) ?? null;

    const save = async () => {
        setSaving(true);
        await apiSave(cfg.file, series);
        setSaving(false); setDirty(false); setSaved(true);
    };

    const update = (next) => { setSeries(next); setDirty(true); setSaved(false); };

    const handleModalConfirm = (value) => {
        const { mode, id, suggestedGameIds } = modal;
        if (mode === 'add') {
            const newEntry = { id: Date.now().toString(36), name: value, gameIds: suggestedGameIds ?? [], ...(cfg.minGames ? { showProgress: true } : {}) };
            update([...(series || []), newEntry].sort((a, b) => seriesSortKey(a.name).localeCompare(seriesSortKey(b.name))));
            setSelectedId(newEntry.id);
            setShowSuggestions(false);
            setShowUnassigned(false);
            setAddSearch('');
        } else if (mode === 'rename') {
            update(series.map(s => s.id === id ? { ...s, name: value } : s).sort((a, b) => seriesSortKey(a.name).localeCompare(seriesSortKey(b.name))));
        } else if (mode === 'delete') {
            const next = series.filter(s => s.id !== id);
            update(next);
            if (selectedId === id) setSelectedId(null);
            apiSave(cfg.file, next);
        }
        setModal(null);
    };

    const addGame = (gameId) => {
        if (!selected || selected.gameIds.includes(gameId)) return;
        update(series.map(s => s.id === selectedId ? { ...s, gameIds: [...s.gameIds, gameId] } : s));
    };

    const removeGame = (gameId) => {
        update(series.map(s => s.id === selectedId ? { ...s, gameIds: s.gameIds.filter(id => id !== gameId), ...(s.groups ? { groups: s.groups.map(g => ({ ...g, gameIds: g.gameIds.filter(id => id !== gameId) })) } : {}) } : s));
    };

    const gameMap = Object.fromEntries(allGames.map(g => [g.id, g]));
    const groups = selected?.groups ?? [];
    // An empty list is stored as no `groups` at all
    const setGroups = fn => update(series.map(s => { if (s.id !== selectedId) return s; const { groups: g0, ...rest } = s; const g = fn(g0 ?? []); return g.length ? { ...rest, groups: g } : rest; }));
    const moveTo = (ids, gid) => setGroups(gs => gs.map(g => ({ ...g, gameIds: [...g.gameIds.filter(x => !ids.includes(x)), ...(g.id === gid ? ids : [])] })));
    const addGroup = (name = 'New sub-series', ids = []) => { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5); setGroups(gs => [...gs.map(g => ({ ...g, gameIds: g.gameIds.filter(x => !ids.includes(x)) })), { id, name, gameIds: ids }]); return id; };
    const moveGroup = (gid, d) => setGroups(gs => { const i = gs.findIndex(g => g.id === gid), j = i + d; if (j < 0 || j >= gs.length) return gs; const n = [...gs]; [n[i], n[j]] = [n[j], n[i]]; return n; });
    const togglePick = id => setPicked(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; });

    const filteredList = (series || []).filter(s =>
        !listSearch || s.name.toLowerCase().includes(listSearch.toLowerCase())
    );

    const assignedIds = new Set(selected?.gameIds ?? []);
    const addCandidates = allGames.filter(g =>
        !assignedIds.has(g.id) &&
        (!addSearch || g.title.toLowerCase().includes(addSearch.toLowerCase()))
    );

    const filteredAssigned = (selected?.gameIds ?? [])
        .map(id => gameMap[id])
        .filter(g => g && (!gameSearch || g.title.toLowerCase().includes(gameSearch.toLowerCase())));

    const recommendations  = series ? computeRecommendations(allGames, series) : [];
    const allAssignedIds   = new Set((series || []).flatMap(s => s.gameIds));
    const allUnassigned    = allGames.filter(g => !allAssignedIds.has(g.id));
    const filteredUnassigned = unassignedSearch
        ? allUnassigned.filter(g => g.title.toLowerCase().includes(unassignedSearch.toLowerCase()))
        : allUnassigned;

    // Games not assigned to THIS series whose seriesKey overlaps with this series' key (bidirectional prefix)
    const selectedKey = selected ? seriesKey(selected.name) : '';
    const seriesSuggestions = selected
        ? allGames.filter(g => {
            if (assignedIds.has(g.id)) return false;
            const gKey = seriesKey(g.title);
            if (gKey === selectedKey) return true;
            // game key is longer: "summon night swordcraft story 2" matches series "summon night swordcraft story"
            if (gKey.startsWith(selectedKey + ' ')) return true;
            // game key is shorter: "summon night" (from "Summon Night: Swordcraft Story") matches series "summon night swordcraft story"
            if (selectedKey.startsWith(gKey + ' ') || selectedKey === gKey) return true;
            return false;
          })
        : [];

    if (!series) return <SkSplit side={260} />;

    const modalSeries = modal?.id ? series.find(s => s.id === modal.id) : null;
    const short = cfg.minGames ? (n) => n < cfg.minGames : () => false;
    const openList = (which) => { setShowUnassigned(which === 'unassigned'); setShowSuggestions(which === 'suggestions'); if (which) setSelectedId(null); setUnassignedSearch(''); };

    return (
        <div className="flex h-full overflow-hidden relative">
            <SaveBar dirty={dirty} saving={saving} saved={saved} onSave={save} />
            {modal && (
                <SeriesModal
                    mode={modal.mode}
                    seriesName={modalSeries?.name ?? ''}
                    initialValue={modal.initialValue}
                    onConfirm={handleModalConfirm}
                    onCancel={() => setModal(null)}
                />
            )}

            {/* ── Left: series list ── */}
            <div className="pane pane-side w-[260px] shrink-0">
                <div className="pane-h">
                    <SearchInput value={listSearch} onChange={setListSearch} placeholder="Search series" />
                    <button className="btn btn-primary !px-2.5 shrink-0" onClick={() => setModal({ mode: 'add' })} title="New series"><Plus size={15} /></button>
                </div>
                <div className="flex-1 overflow-y-auto">
                    {filteredList.map(s => {
                        const isSel = s.id === selectedId && !showSuggestions && !showUnassigned;
                        return (
                            <button key={s.id} onClick={() => { setSelectedId(s.id); setShowSuggestions(false); setShowUnassigned(false); setAddSearch(''); setGameSearch(''); }}
                                className={`lrow !py-2 ${isSel ? 'on' : ''}`}>
                                <span className="lrow-t flex-1">{s.name}</span>
                                {s.showProgress && <Star size={11} className="text-[#e5b143] shrink-0" fill="currentColor" aria-label="Shows progress" />}
                                {s.groups?.length > 0 && <FolderTree size={11} className="text-[#66c0f4]/70 shrink-0" aria-label={`${s.groups.length} sub-series`} />}
                                <span className={`text-[11px] tabular-nums shrink-0 min-w-[16px] text-right ${short(s.gameIds.length) ? 'text-[#ff6b6b]' : 'text-[#546270]'}`}
                                    title={short(s.gameIds.length) ? `Shown on the site from ${cfg.minGames} games` : undefined}>{s.gameIds.length}</span>
                            </button>
                        );
                    })}
                    {filteredList.length === 0 && <Empty icon={Layers} title={listSearch ? 'No match' : 'No series yet'} hint={listSearch ? undefined : 'Create one with +, or start from a suggestion below'} />}
                </div>
                <div className="pane-f">
                    <span className="flex-1">{series.length} series · {series.reduce((n, s) => n + s.gameIds.length, 0)} games</span>
                    {allUnassigned.length > 0 && (
                        <button onClick={() => openList(showUnassigned ? null : 'unassigned')} title="Games in no series"
                            className={`chip cursor-pointer ${showUnassigned ? '!bg-[#8f98a0] !text-[#101214] !border-[#8f98a0]' : 'hover:!border-[#8f98a0]'}`}>
                            <Inbox size={11} />{allUnassigned.length}
                        </button>
                    )}
                    {recommendations.length > 0 && (
                        <button onClick={() => openList(showSuggestions ? null : 'suggestions')} title="Suggested series"
                            className={`chip chip-gold cursor-pointer ${showSuggestions ? '!bg-[#e5b143] !text-[#101214]' : 'hover:!border-[#e5b143]'}`}>
                            <Lightbulb size={11} />{recommendations.length}
                        </button>
                    )}
                </div>
            </div>

            {/* ── Right: editor, unassigned, or suggestions (fades in when it switches) ── */}
            <div key={showUnassigned ? 'unassigned' : showSuggestions ? 'suggestions' : selectedId ?? 'none'} className="pane flex-1 anim-fade">
                {showUnassigned ? (
                    <>
                        <div className="pane-h">
                            <button className="icon-btn" onClick={() => setShowUnassigned(false)} title="Back"><ChevronLeft size={16} /></button>
                            <Inbox size={16} className="text-[#8f98a0]" />
                            <span className="pane-t flex-1">In no series <span className="text-[#546270] font-normal">· {allUnassigned.length} game{allUnassigned.length !== 1 ? 's' : ''}</span></span>
                            <SearchInput value={unassignedSearch} onChange={setUnassignedSearch} placeholder="Search these games" className="!w-[260px]" />
                        </div>
                        <div className="flex-1 overflow-y-auto">
                            {filteredUnassigned.length === 0 && <Empty icon={Check} title={unassignedSearch ? 'No match' : 'Every game is in a series'} />}
                            {filteredUnassigned.map(g => (
                                <GameRow key={g.id} g={g}>
                                    <button className="btn btn-outline btn-sm shrink-0" onClick={() => setModal({ mode: 'add', initialValue: g.title, suggestedGameIds: [g.id] })}><Plus size={12} />New series</button>
                                </GameRow>
                            ))}
                        </div>
                    </>
                ) : showSuggestions ? (
                    <>
                        <div className="pane-h">
                            <button className="icon-btn" onClick={() => setShowSuggestions(false)} title="Back"><ChevronLeft size={16} /></button>
                            <Lightbulb size={16} className="text-[#e5b143]" />
                            <span className="pane-t flex-1">Suggestions <span className="text-[#546270] font-normal">· {recommendations.length} possible series</span></span>
                            <span className="hint">Games in no series that share a name</span>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 grid gap-3 content-start" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))' }}>
                            {recommendations.map((rec, i) => (
                                <div key={i} className="card overflow-hidden flex flex-col">
                                    <div className="flex items-center gap-2 px-3 py-2.5 border-b border-[#2a475e]">
                                        <span className="text-[13px] text-white font-semibold flex-1 truncate">{rec.name}</span>
                                        <span className="chip">{rec.games.length} games</span>
                                        <button className="btn btn-primary btn-sm shrink-0" onClick={() => setModal({ mode: 'add', initialValue: rec.name, suggestedGameIds: rec.games.map(g => g.id) })}><Plus size={12} />Create</button>
                                    </div>
                                    <div className="flex flex-col py-1">
                                        {rec.games.map(g => (
                                            <div key={g.id} className="flex items-center gap-2 px-3 py-1">
                                                <img src={g.icon} alt="" className="w-5 h-5 rounded-[2px] object-cover bg-black shrink-0" />
                                                <a href={g.url} target="_blank" rel="noreferrer" className="text-[12px] text-[#8f98a0] hover:text-[#66c0f4] truncate flex-1">{g.title}</a>
                                                {g.fromWatchlist && <Bookmark size={11} className="text-[#66c0f4] shrink-0" />}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </>
                ) : !selected ? (
                    <Empty icon={Layers} title="Pick a series" hint={`${series.length} series on the left.${allUnassigned.length ? ` ${allUnassigned.length} games are in none yet.` : ''}`}>
                        <div className="flex gap-2 mt-3">
                            <button className="btn btn-primary btn-sm" onClick={() => setModal({ mode: 'add' })}><Plus size={12} />New series</button>
                            {recommendations.length > 0 && <button className="btn btn-outline btn-sm" onClick={() => openList('suggestions')}><Lightbulb size={12} />{recommendations.length} suggestions</button>}
                        </div>
                    </Empty>
                ) : (
                    <>
                        {/* Header */}
                        <div className="pane-h">
                            <span className="pane-t flex-1">{selected.name}</span>
                            {short(selected.gameIds.length) && <span className="chip chip-red">Needs {cfg.minGames}+ games to show</span>}
                            <button onClick={() => update(series.map(s => s.id === selectedId ? { ...s, showProgress: !s.showProgress } : s))}
                                title="Show in the Series Progress tab"
                                className={`btn btn-sm ${selected.showProgress ? 'bg-[#e5b143] text-[#101214]' : 'btn-outline'}`}>
                                <Star size={12} fill={selected.showProgress ? 'currentColor' : 'none'} />Show progress
                            </button>
                            <button className="icon-btn" onClick={() => setModal({ mode: 'rename', id: selected.id })} title="Rename"><Pencil size={14} /></button>
                            <button className="icon-btn hover:!text-[#ff6b6b]" onClick={() => setModal({ mode: 'delete', id: selected.id })} title="Delete"><Trash2 size={14} /></button>
                        </div>

                        <div className="flex flex-1 overflow-hidden">
                            {/* Assigned games: in their sub-series where the site shows them (shared, RA, Steam), else one list */}
                            {cfg.subSeries ? (
                            <div className="pane flex-1 border-r border-[#2a475e]">
                                <div className="sub-h">
                                    {picked.size > 0 ? <>
                                        <span className="text-[#66c0f4] normal-case tracking-normal">{picked.size} selected</span>
                                        <select className="input !h-7 !w-[170px] !text-[12px] normal-case tracking-normal font-normal" value="" onChange={e => { const v = e.target.value; const ids = [...picked]; if (v === '__new') { setEditing(addGroup('New sub-series', ids)); } else moveTo(ids, v || null); setPicked(new Set()); }}>
                                            <option value="" disabled>Move to…</option>
                                            {groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                            <option value="">No sub-series</option>
                                            <option value="__new">+ New sub-series</option>
                                        </select>
                                        <button className="btn btn-sm btn-outline normal-case tracking-normal" onClick={() => setPicked(new Set())}>Clear</button>
                                        <span className="flex-1" />
                                    </> : <>
                                        <span className="flex-1 whitespace-nowrap">{selected.gameIds.length} games{groups.length > 0 && <span className="normal-case tracking-normal font-normal text-[#546270]"> · {groups.length} sub</span>}</span>
                                        <button className={`btn btn-sm normal-case tracking-normal ${subSug ? 'bg-[#e5b143] text-[#101214]' : 'btn-outline'}`} onClick={() => setSubSug(v => !v)}><Wand2 size={12} />Suggest</button>
                                        <button className="btn btn-sm btn-outline normal-case tracking-normal" onClick={() => setEditing(addGroup())}><Plus size={12} />Sub-series</button>
                                    </>}
                                    <SearchInput value={gameSearch} onChange={setGameSearch} placeholder="Filter" className="!w-[110px] normal-case tracking-normal font-normal" />
                                </div>
                                <div className="flex-1 overflow-y-auto">
                                    {subSug && (() => {
                                        const sug = suggestSubs(selected, gameMap, cfg.subSuggestFrom ? suggestFrom : series);
                                        return (
                                            <div className="p-3 flex flex-col gap-2 border-b border-[#2a475e] bg-[#182230] anim-fade">
                                                <div className="flex items-center gap-2 text-[12px]"><Wand2 size={13} className="text-[#e5b143]" /><span className="text-white font-semibold flex-1">Suggested sub-series · {sug.length}</span>
                                                    {sug.length > 0 && <button className="btn btn-sm btn-primary" onClick={() => { sug.forEach(x => addGroup(x.name, x.gameIds)); setSubSug(false); }}><Check size={12} />Add all</button>}</div>
                                                {sug.length === 0 && <span className="text-[12px] text-[#546270]">Nothing to suggest: every game is in a sub-series, or no names repeat.</span>}
                                                {sug.map(x => (
                                                    <div key={x.name} className="card flex items-center gap-2 px-3 py-2">
                                                        <span className="flex -space-x-1.5 shrink-0">{x.gameIds.slice(0, 4).map(id => <img key={id} src={gameMap[id]?.icon} alt="" className="w-6 h-6 rounded-[2px] object-cover border border-[#101214] bg-black" />)}</span>
                                                        <span className="flex flex-col min-w-0 flex-1"><span className="text-[12px] text-white truncate">{x.name} <span className="text-[#546270]">· {x.gameIds.length} games</span></span><span className="text-[11px] text-[#8f98a0] truncate">{x.why} · {x.gameIds.slice(0, 3).map(id => gameMap[id]?.title).join(', ')}{x.gameIds.length > 3 ? '…' : ''}</span></span>
                                                        <button className="btn btn-sm btn-outline shrink-0" onClick={() => addGroup(x.name, x.gameIds)}><Plus size={12} />Add</button>
                                                    </div>
                                                ))}
                                            </div>
                                        );
                                    })()}
                                    {selected.gameIds.length === 0 && <Empty icon={Plus} title="No games yet" hint="Add games from the panel on the right" />}
                                    {[...groups.map(g => ({ ...g, real: true })), { id: '', name: groups.length ? 'No sub-series' : null, gameIds: selected.gameIds.filter(id => !groups.some(g => g.gameIds.includes(id))) }].map((gr, gi) => {
                                        const rows = gr.gameIds.map(id => gameMap[id]).filter(g => g && (!gameSearch || g.title.toLowerCase().includes(gameSearch.toLowerCase())));
                                        if (!gr.real && !rows.length && groups.length) return null;
                                        return (
                                            <div key={gr.id || 'none'}>
                                                {gr.name && (
                                                    <div className="flex items-center gap-1.5 px-3 h-9 bg-[#131a22] border-b border-[#2a475e] group">
                                                        <FolderTree size={13} className={gr.real ? 'text-[#66c0f4]' : 'text-[#546270]'} />
                                                        {editing === gr.id
                                                            ? <input autoFocus className="input !h-7 !text-[12px] !w-[220px]" defaultValue={gr.name} onFocus={e => e.target.select()} onBlur={e => { const v = e.target.value.trim(); setGroups(gs => gs.map(g => g.id === gr.id ? { ...g, name: v || g.name } : g)); setEditing(null); }} onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') setEditing(null); }} />
                                                            : <span className={`text-[12px] font-semibold ${gr.real ? 'text-white' : 'text-[#8f98a0]'}`} onDoubleClick={() => gr.real && setEditing(gr.id)}>{gr.name}</span>}
                                                        <span className="text-[11px] text-[#546270] tabular-nums">{gr.gameIds.length}</span>
                                                        <span className="flex-1" />
                                                        {gr.real && <>
                                                            <button className="icon-btn !w-7 !h-7" title="Move up" disabled={gi === 0} onClick={() => moveGroup(gr.id, -1)}><ChevronUp size={14} /></button>
                                                            <button className="icon-btn !w-7 !h-7" title="Move down" disabled={gi === groups.length - 1} onClick={() => moveGroup(gr.id, 1)}><ChevronDown size={14} /></button>
                                                            <button className="icon-btn !w-7 !h-7" title="Rename" onClick={() => setEditing(gr.id)}><Pencil size={13} /></button>
                                                            <button className="icon-btn !w-7 !h-7 hover:!text-[#ff6b6b]" title="Remove the sub-series (its games stay in the series)" onClick={() => setGroups(gs => gs.filter(g => g.id !== gr.id))}><Trash2 size={13} /></button>
                                                        </>}
                                                    </div>
                                                )}
                                                {gr.real && !rows.length && <div className="px-4 py-3 text-[12px] text-[#546270] border-b border-[#1e2a35]">No games yet: select games below and move them here</div>}
                                                {rows.map(g => {
                                                    const isCover = g.id === selected.coverGameId;
                                                    return (
                                                        <div key={g.id} className={`flex items-center ${picked.has(g.id) ? 'bg-[rgba(102,192,244,0.08)]' : ''}`}>
                                                            <input type="checkbox" className="ml-3 shrink-0 accent-[#66c0f4]" checked={picked.has(g.id)} onChange={() => togglePick(g.id)} aria-label={`Select ${g.title}`} />
                                                            <div className="flex-1 min-w-0">
                                                                <GameRow g={g}>
                                                                    <button title={isCover ? 'Cover game (click to unset)' : 'Use as cover'}
                                                                        onClick={() => update(series.map(s => s.id === selectedId ? { ...s, coverGameId: isCover ? null : g.id } : s))}
                                                                        className={`icon-btn !w-7 !h-7 ${isCover ? '!text-[#e5b143]' : 'opacity-0 group-hover:opacity-100 hover:!text-[#e5b143]'}`}>
                                                                        <Star size={14} fill={isCover ? 'currentColor' : 'none'} />
                                                                    </button>
                                                                    <button className="icon-btn !w-7 !h-7 opacity-0 group-hover:opacity-100 hover:!text-[#ff6b6b]" title="Remove from the series" onClick={() => removeGame(g.id)}><X size={14} /></button>
                                                                </GameRow>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            ) : (
                            <div className="pane flex-1 border-r border-[#2a475e]">
                                <div className="sub-h">
                                    <span className="flex-1">In this series · {selected.gameIds.length}</span>
                                    <SearchInput value={gameSearch} onChange={setGameSearch} placeholder="Filter" className="!w-[160px] normal-case tracking-normal font-normal" />
                                </div>
                                <div className="flex-1 overflow-y-auto">
                                    {filteredAssigned.length === 0 && <Empty icon={Plus} title={selected.gameIds.length === 0 ? 'No games yet' : 'No match'} hint={selected.gameIds.length === 0 ? 'Add games from the panel on the right' : undefined} />}
                                    {filteredAssigned.map(g => {
                                        const isCover = g.id === selected.coverGameId;
                                        return (
                                            <GameRow key={g.id} g={g}>
                                                <button title={isCover ? 'Cover game (click to unset)' : 'Use as cover'}
                                                    onClick={() => update(series.map(s => s.id === selectedId ? { ...s, coverGameId: isCover ? null : g.id } : s))}
                                                    className={`icon-btn !w-7 !h-7 ${isCover ? '!text-[#e5b143]' : 'opacity-0 group-hover:opacity-100 hover:!text-[#e5b143]'}`}>
                                                    <Star size={14} fill={isCover ? 'currentColor' : 'none'} />
                                                </button>
                                                <button className="icon-btn !w-7 !h-7 opacity-0 group-hover:opacity-100 hover:!text-[#ff6b6b]" title="Remove from the series" onClick={() => removeGame(g.id)}><X size={14} /></button>
                                            </GameRow>
                                        );
                                    })}
                                </div>
                            </div>
                            )}

                            {/* Add games panel */}
                            <div className="pane w-[320px] shrink-0 bg-[#182230]">
                                <div className="pane-h"><SearchInput value={addSearch} onChange={setAddSearch} placeholder="Search games to add" /></div>
                                <div className="flex-1 overflow-y-auto">
                                    {addSearch === '' && seriesSuggestions.length > 0 && (
                                        <>
                                            <div className="sub-h !text-[#e5b143]"><Lightbulb size={12} />Suggested <span className="normal-case tracking-normal font-normal text-[#546270]">· {seriesSuggestions.length} with a matching name</span></div>
                                            {seriesSuggestions.map(g => (
                                                <GameRow key={g.id} g={g} accent onClick={() => addGame(g.id)}><Plus size={14} className="text-[#e5b143] shrink-0" /></GameRow>
                                            ))}
                                        </>
                                    )}
                                    {addSearch === '' && seriesSuggestions.length === 0 && <Empty icon={Search} title="Find games to add" hint="Type a title above" />}
                                    {addSearch !== '' && addCandidates.length === 0 && <Empty icon={Search} title="No match" />}
                                    {addSearch !== '' && addCandidates.map(g => (
                                        <GameRow key={g.id} g={g} onClick={() => addGame(g.id)}><Plus size={14} className="text-[#546270] group-hover:text-[#66c0f4] shrink-0" /></GameRow>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </>
                )}
            </div>
        </div>
    );
}

// MODULE: Steam Win Conditions
// ═══════════════════════════════════════════════════════════════════════════════

function WinConditionsModule({ cfg }) {
    const [gameIndex,     setGameIndex]     = useState(null);
    const [winConditions, setWinConditions] = useState(null);
    const [selected,      setSelected]      = useState(null);
    const [gameData,      setGameData]      = useState(null);
    const [loadingGame,   setLoadingGame]   = useState(false);
    const [search,        setSearch]        = useState('');
    const [achSearch,     setAchSearch]     = useState('');
    const [dirty,         setDirty]         = useState(false);
    const [saving,        setSaving]        = useState(false);
    const [saved,         setSaved]         = useState(false);

    useEffect(() => {
        Promise.all([
            apiData(`data/${cfg.platform}/games/index.json`),
            apiData(`data/${cfg.platform}/win-conditions.json`).catch(() => ({})),
        ]).then(([idx, wc]) => {
            setGameIndex(idx);
            setWinConditions(wc || {});
        });
    }, []);

    useEffect(() => {
        if (!selected) return;
        setGameData(null);
        setAchSearch('');
        setLoadingGame(true);
        apiGet(cfg.gameUrl(selected[cfg.idKey]))
            .then(d => { setGameData(d); setLoadingGame(false); })
            .catch(() => { setGameData({}); setLoadingGame(false); });
    }, [selected?.[cfg.idKey]]);

    const save = async () => {
        setSaving(true);
        await apiSave(`data/${cfg.platform}/win-conditions.json`, winConditions);
        setSaving(false); setDirty(false); setSaved(true);
    };

    const getEntry = (id) => {
        const val = winConditions[String(id)];
        if (!val) return { mode: 'or', achievements: [] };
        if (Array.isArray(val)) return { mode: 'or', achievements: val };
        return { mode: val.mode || 'or', achievements: val.achievements || [] };
    };

    const toggleWinCond = (id, apiName) => {
        const key = String(id);
        const entry = getEntry(id);
        const nextAchs = entry.achievements.includes(apiName)
            ? entry.achievements.filter(n => n !== apiName)
            : [...entry.achievements, apiName];
        const updated = { ...winConditions };
        if (nextAchs.length === 0) delete updated[key];
        else updated[key] = { mode: entry.mode, achievements: nextAchs };
        setWinConditions(updated); setDirty(true); setSaved(false);
    };

    const toggleMode = (id) => {
        const key = String(id);
        const entry = getEntry(id);
        if (!entry.achievements.length) return;
        setWinConditions({ ...winConditions, [key]: { mode: entry.mode === 'or' ? 'and' : 'or', achievements: entry.achievements } });
        setDirty(true); setSaved(false);
    };

    const clearWinConds = (id) => {
        const updated = { ...winConditions };
        delete updated[String(id)];
        setWinConditions(updated); setDirty(true); setSaved(false);
    };

    const games = useMemo(() => {
        if (!gameIndex?.achievementProgress) return [];
        return Object.values(gameIndex.achievementProgress)
            .filter(g => g.hasAchievements && g.preview?.length > 0)
            .sort((a, b) => a.gameName.localeCompare(b.gameName));
    }, [gameIndex]);

    const filtered = useMemo(() => {
        if (!search) return games;
        const q = search.toLowerCase();
        return games.filter(g => g.gameName.toLowerCase().includes(q) || String(g[cfg.idKey]).includes(q));
    }, [games, search]);

    const sortedAch = useMemo(() => {
        if (!gameData?.achievements?.length) return [];
        return [...gameData.achievements].sort((a, b) => {
            if (a.unlocked !== b.unlocked) return a.unlocked ? -1 : 1;
            if (a.unlocked && b.unlocked) return new Date(b.unlockedAt) - new Date(a.unlockedAt);
            return 0;
        });
    }, [gameData]);

    const filteredAch = useMemo(() => {
        if (!achSearch) return sortedAch;
        const q = achSearch.toLowerCase();
        return sortedAch.filter(a =>
            a.displayName.toLowerCase().includes(q) ||
            (a.description || '').toLowerCase().includes(q)
        );
    }, [sortedAch, achSearch]);

    const currentEntry    = selected ? getEntry(selected[cfg.idKey]) : { mode: 'or', achievements: [] };
    const currentWinConds = currentEntry.achievements;
    const currentMode     = currentEntry.mode;
    const winCondCount = winConditions ? Object.keys(winConditions).length : 0;

    if (!gameIndex || !winConditions) return <SkSplit side={280} />;

    return (
        <div className="flex h-full overflow-hidden">
            <SaveBar dirty={dirty} saving={saving} saved={saved} onSave={save} />
            {/* Games */}
            <div className="pane pane-side w-[280px] shrink-0">
                <div className="pane-h"><SearchInput value={search} onChange={setSearch} placeholder={`Search ${games.length} games`} /></div>
                <div className="flex-1 overflow-y-auto">
                    {filtered.map(g => {
                        const hasWC = getEntry(g[cfg.idKey]).achievements.length > 0;
                        const isSel = selected?.[cfg.idKey] === g[cfg.idKey];
                        return (
                            <button key={g[cfg.idKey]} onClick={() => setSelected(g)} className={`lrow ${isSel ? 'on' : ''}`}>
                                <img src={g.iconUrl} alt="" className="lrow-i" />
                                <span className="lrow-b">
                                    <span className="lrow-t">{g.gameName}</span>
                                    <span className="lrow-s tabular-nums">{g.unlocked ?? 0} / {g.total} unlocked</span>
                                </span>
                                {hasWC && <Trophy size={13} className="text-[#e5b143] shrink-0" aria-label="Has a win condition" />}
                            </button>
                        );
                    })}
                    {filtered.length === 0 && <Empty icon={Search} title="No match" />}
                </div>
                <div className="pane-f"><Trophy size={12} className="text-[#e5b143]" />{winCondCount} game{winCondCount !== 1 ? 's' : ''} with a win condition</div>
            </div>

            {/* Detail (fades in on each selection) */}
            <div key={selected?.[cfg.idKey] ?? 'none'} className="pane flex-1 anim-fade">
                {!selected ? (
                    <Empty icon={Trophy} title="Pick a game" hint="Then tap the achievements that mean you beat it: the ending, the final boss. Beaten games show silver on the site." />
                ) : (
                    <>
                        <div className="flex items-center gap-3 px-4 py-3 border-b border-[#2a475e] shrink-0">
                            <img src={selected.iconUrl} alt={selected.gameName} className="w-11 h-11 rounded-[2px] border border-[#101214] object-cover bg-black shrink-0" />
                            <div className="flex-1 min-w-0">
                                <div className="text-[15px] text-white font-semibold truncate">{selected.gameName}</div>
                                <div className="flex items-center gap-2 mt-1">
                                    <span className="chip mono h-[18px] text-[10px]">{cfg.idLabel} {selected[cfg.idKey]}</span>
                                    <span className="text-[12px] text-[#546270]">{selected.total} achievements</span>
                                    {currentWinConds.length > 0 && <span className="chip chip-gold h-[18px] text-[10px] anim-fade"><Trophy size={10} />{currentWinConds.length} win condition{currentWinConds.length !== 1 ? 's' : ''}</span>}
                                </div>
                            </div>
                        </div>

                        {loadingGame ? (
                            <SkRows n={8} />
                        ) : !gameData?.achievements?.length ? (
                            <Empty icon={CircleSlash} title="No achievement data" hint="Run a full pipeline refresh to load this game's achievements." />
                        ) : (
                            <>
                                <div className="pane-h">
                                    <SearchInput value={achSearch} onChange={setAchSearch} placeholder={`Search ${gameData.achievements.length} achievements`} />
                                    {currentWinConds.length > 1 && (
                                        <div className="seg shrink-0 anim-fade" title="Any one of them, or all of them">
                                            {[['or', 'Any'], ['and', 'All']].map(([m, l]) => (
                                                <button key={m} onClick={() => currentMode !== m && toggleMode(selected[cfg.idKey])} className={currentMode === m ? 'on' : ''}>{l}</button>
                                            ))}
                                        </div>
                                    )}
                                    {currentWinConds.length > 0 && (
                                        <button onClick={() => clearWinConds(selected[cfg.idKey])} className="btn btn-outline btn-danger btn-sm shrink-0 anim-fade"><X size={12} />Clear</button>
                                    )}
                                </div>
                                <div className="flex-1 overflow-y-auto anim-fade">
                                    {filteredAch.length === 0 && <Empty icon={Search} title="No match" />}
                                    {filteredAch.map(ach => {
                                        const isWC = currentWinConds.includes(ach.apiName);
                                        const iconSrc = cfg.achIcon(selected, ach);
                                        return (
                                            <button key={ach.apiName}
                                                onClick={() => toggleWinCond(selected[cfg.idKey], ach.apiName)}
                                                className={`lrow !py-2 ${isWC ? '!bg-[#e5b143]/10 !border-l-[#e5b143]' : ''}`}>
                                                {iconSrc
                                                    ? <img src={iconSrc} alt="" className="w-9 h-9 rounded-[2px] shrink-0 object-cover bg-black" style={{ opacity: ach.unlocked ? 1 : 0.35 }} />
                                                    : <div className="w-9 h-9 rounded-[2px] shrink-0 bg-[#2a475e]" />
                                                }
                                                <span className="lrow-b">
                                                    <span className={`lrow-t !text-[13px] ${isWC ? '!text-[#e5b143] font-medium' : ''}`}>{ach.displayName}</span>
                                                    {ach.description && <span className="lrow-s">{ach.description}</span>}
                                                </span>
                                                <span className="flex items-center gap-2.5 shrink-0">
                                                    {ach.unlocked && ach.unlockedAt && (
                                                        <span className="text-[11px] text-[#57cbde] tabular-nums">
                                                            {new Date(ach.unlockedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}
                                                        </span>
                                                    )}
                                                    {ach.globalPct != null && <span className="text-[11px] text-[#546270] tabular-nums w-[38px] text-right">{ach.globalPct.toFixed(1)}%</span>}
                                                    <span className={`w-6 h-6 grid place-items-center rounded-[3px] border ${isWC ? 'bg-[#e5b143] border-[#e5b143] text-[#101214]' : 'border-[#2a475e] text-transparent'}`}><Trophy size={12} /></span>
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </>
                )}

}

const ago = (iso) => {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.floor(m / 60)}h ${m % 60 ? `${m % 60}m ` : ''}ago` : `${Math.floor(m / 1440)}d ago`;
};
const runTime = (r) => {
    if (!r.started) return null;
    const s = Math.round(((r.status === 'completed' ? Date.parse(r.updated) : Date.now()) - Date.parse(r.started)) / 1000);
    return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
};
const RUN_STATE = (r) => r.status !== 'completed'
