// cron-job.org: the schedule that starts the data runs. lastStatus codes from its API
const CRON_STATUS = { 0: null, 1: { ok: true, label: 'OK' }, 2: 'DNS error', 3: "Couldn't connect", 4: 'HTTP error', 5: 'Timed out', 6: 'Response too large', 7: 'Invalid URL', 8: 'cron-job.org error', 9: 'Failed' };
const pad2 = (n) => String(n).padStart(2, '0');
const cronWhen = (sch) => {
    const mins = sch.minutes.filter(m => m >= 0);
    if (sch.hours[0] === -1) return `Every hour at ${mins.map(m => `:${pad2(m)}`).join(' and ')}`;
    const d = new Date(Date.UTC(2000, 0, 1, sch.hours[0], mins[0] ?? 0));
    return `Daily ${pad2(sch.hours[0])}:${pad2(mins[0] ?? 0)} UTC · ${pad2(d.getHours())}:${pad2(d.getMinutes())} here`;
};
const untilText = (sec) => {
    const m = Math.round((sec * 1000 - Date.now()) / 60000);
    return m < 1 ? 'any moment' : m < 60 ? `in ${m}m` : `in ${Math.floor(m / 60)}h ${m % 60 ? `${m % 60}m` : ''}`.trim();
};

function CronJobs({ onStarted }) {
    const [jobs,    setJobs]    = useState(null);
    const [err,     setErr]     = useState(null);
    const [confirm, setConfirm] = useState(null);   // job id waiting for Run now
    const [busy,    setBusy]    = useState({});     // id → 'run' | 'toggle'
    const [msg,     setMsg]     = useState({});     // id → { ok, text }

    const load = useCallback(() => {
        apiGet(`${API}/cron/jobs`).then(d => { if (d?.error) setErr(d.error); else { setJobs(d); setErr(null); } }).catch(e => setErr(e.message));
    }, []);
    useEffect(() => { load(); }, []);

    const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json()).then(r => { if (r.error) throw new Error(r.error); return r; });

    const runNow = async (j) => {
        setConfirm(null); setBusy(b => ({ ...b, [j.id]: 'run' }));
        try { await post(`${API}/cron/run`, { id: j.id }); setMsg(m => ({ ...m, [j.id]: { ok: true, text: 'Started on GitHub' } })); onStarted(); }
        catch (e) { setMsg(m => ({ ...m, [j.id]: { ok: false, text: e.message } })); }
        setBusy(b => ({ ...b, [j.id]: null }));
    };
    const toggle = async (j, enabled) => {
        setBusy(b => ({ ...b, [j.id]: 'toggle' }));
        try { await post(`${API}/cron/enable`, { id: j.id, enabled }); setJobs(js => js.map(x => x.id === j.id ? { ...x, enabled } : x)); setMsg(m => ({ ...m, [j.id]: null })); }
        catch (e) { setMsg(m => ({ ...m, [j.id]: { ok: false, text: e.message } })); }
        setBusy(b => ({ ...b, [j.id]: null }));
    };

    return (
        <div className="p-3 border-b border-[#2a475e] flex flex-col gap-2.5">
            <div className="flex items-center gap-2 px-0.5">
                <CalendarClock size={14} className="text-[#c6d4df]" />
                <span className="text-[11px] text-[#8f98a0] font-bold uppercase tracking-[0.07em] flex-1">Schedule</span>
                <a className="text-[11px] text-[#546270] hover:text-[#66c0f4] flex items-center gap-1" href="https://console.cron-job.org/jobs" target="_blank" rel="noreferrer">cron-job.org<ExternalLink size={10} /></a>
                <button className="icon-btn !w-6 !h-6" onClick={load} title="Refresh"><RotateCw size={12} /></button>
            </div>
            {err && <span className="chip chip-red !h-auto py-1 whitespace-normal">{err}</span>}
            {!err && !jobs && <div className="flex flex-col gap-1.5">{[0, 1].map(i => <div key={i} className="shimmer h-[74px] rounded-[3px]" />)}</div>}
            {jobs?.map(j => {
                const st = CRON_STATUS[j.lastStatus];
                const mode = GH_MODES.find(m => m.id === j.inputs?.mode);
                return (
                    <div key={j.id} className={`flex flex-col gap-2 p-2.5 rounded-[3px] border bg-[#1b2838] anim-fade ${j.enabled ? 'border-[#2a475e]' : 'border-[#e5b143]/40'}`}>
                        <div className="flex items-start gap-2">
                            <span className="flex flex-col min-w-0 flex-1">
                                <span className="text-[12px] text-white font-medium">{mode?.label ?? j.title}{j.inputs?.platforms && j.inputs.platforms !== 'all' ? ` · ${j.inputs.platforms}` : ''}</span>
                                <span className="text-[11px] text-[#546270]">{cronWhen(j.schedule)}</span>
                            </span>
                            <span title={j.enabled ? 'Pause this schedule' : 'Resume this schedule'} className={busy[j.id] === 'toggle' ? 'opacity-50 pointer-events-none' : ''}>
                                <Toggle checked={j.enabled} onChange={v => toggle(j, v)} />
                            </span>
                        </div>
                        <div className="flex items-center gap-2 text-[11px] tabular-nums">
                            {j.lastExecution ? (
                                <span className="flex items-center gap-1" style={{ color: st?.ok ? '#57cbde' : st ? '#ff6b6b' : '#8f98a0' }} title={j.lastDuration ? `${j.lastDuration} ms` : undefined}>
                                    {st?.ok ? <CheckCircle2 size={12} /> : st ? <XCircle size={12} /> : <MinusCircle size={12} />}
                                    {st?.ok ? 'Sent' : st ?? 'Ran'} {ago(new Date(j.lastExecution * 1000).toISOString())}
                                </span>
                            ) : <span className="text-[#546270]">Never ran</span>}
                            <span className="flex-1" />
                            {j.enabled
                                ? <span className="text-[#8f98a0] flex items-center gap-1"><Clock size={11} />{untilText(j.nextExecution)}</span>
                                : <span className="text-[#e5b143] flex items-center gap-1"><Pause size={11} />Paused</span>}
                        </div>
                        {confirm === j.id ? (
                            <div className="flex flex-col gap-2 anim-fade">
                                <span className="text-[11px] text-[#c6d4df]">Send this job's request to GitHub now? It starts a {mode?.label.toLowerCase() ?? ''} run, same as the schedule.</span>
                                <div className="flex gap-1.5">
                                    <button className="btn btn-primary btn-sm flex-1" onClick={() => runNow(j)}><Play size={12} />Run now</button>
                                    <button className="btn btn-ghost btn-sm" onClick={() => setConfirm(null)}>Cancel</button>
                                </div>
                            </div>
                        ) : (
                            <button className="btn btn-outline btn-sm w-full" disabled={busy[j.id] === 'run' || !j.inputs} onClick={() => { setMsg(m => ({ ...m, [j.id]: null })); setConfirm(j.id); }}>
                                {busy[j.id] === 'run' ? <Loader2 size={12} className="animate-spin" /> : <Play size={12} />}Run now
                            </button>
                        )}
                        {msg[j.id] && <span className={`chip ${msg[j.id].ok ? 'chip-blue' : 'chip-red'} self-start !h-auto py-1 whitespace-normal anim-fade`}>{msg[j.id].ok && <Check size={11} />}{msg[j.id].text}</span>}
                    </div>
                );
            })}
        </div>
    );
}

function PipelinesModule() {
    const [status,   setStatus]   = useState(null); // null = not yet loaded
    const [log,      setLog]      = useState([]);
    const [running,  setRunning]  = useState(false);
    const [jobId,    setJobId]    = useState(null);
    const [mode,     setMode]     = useState(null);
    const [view,     setView]     = useState('github');   // right pane: GitHub runs or the local log
    const [runs,     setRuns]     = useState(null);
    const [runsErr,  setRunsErr]  = useState(null);
    const [runsBusy, setRunsBusy] = useState(false);
    const [ghMode,   setGhMode]   = useState('incremental');
    const [ghPlat,   setGhPlat]   = useState('all');
    const [confirm,  setConfirm]  = useState(false);
    const [dispatch, setDispatch] = useState(null);     // null | 'sending' | 'sent' | error text
    const [sync,     setSync]     = useState(null);
    const logRef  = useRef(null);
    const esRef   = useRef(null);

    const loadRuns = useCallback(() => {
        setRunsBusy(true);
        apiGet(`${API}/gh/runs`).then(d => { if (d?.error) { setRunsErr(d.error); setRuns(null); } else { setRuns(d); setRunsErr(null); } })
            .catch(e => setRunsErr(e.message)).finally(() => setRunsBusy(false));
    }, []);

    // Load current status on mount
    useEffect(() => {
        fetch(`${API}/pipeline/status`).then(r => r.json()).then(s => {
            setStatus(s);
            setRunning(s.running);
            if (s.id) { setJobId(s.id); setLog(s.lines ?? []); setMode(s.mode ?? null); }
            if (s.running) { connectStream(s.id); setView('local'); }
        });
        loadRuns();
        apiGet(`${API}/sync-state`).then(setSync).catch(() => {});
        return () => esRef.current?.close();
    }, []);

    // While a GitHub run is queued or running, check again every 15 s
    const active = runs?.some(r => r.status !== 'completed');
    useEffect(() => {
        if (!active) return;
        const t = setInterval(loadRuns, 15000);
        return () => clearInterval(t);
    }, [active]);

    // Auto-scroll log
    useEffect(() => {
        if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
    }, [log]);

    const connectStream = (id) => {
        esRef.current?.close();
        const es = new EventSource(`${API}/pipeline/stream?id=${id}`);
        esRef.current = es;
        es.onmessage = (e) => {
            const line = JSON.parse(e.data);
            if (line.type === 'exit') { setRunning(false); es.close(); }
            setLog(prev => [...prev, line]);
        };
        es.onerror = () => { setRunning(false); es.close(); };
    };

    const run = async (id) => {
        setMode(id); setView('local');
        setLog([]);
        setRunning(true);
        const res = await fetch(`${API}/pipeline/start`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: id }),
        });
        const data = await res.json();
        if (data.error) { setLog([{ type: 'err', text: data.error }]); setRunning(false); return; }
        setJobId(data.id);
        connectStream(data.id);
    };

    const stop = () => fetch(`${API}/pipeline/stop`, { method: 'POST' });

    // Start a run on GitHub, after a confirm step (it publishes data and uses API quota)
    const sendDispatch = async () => {
        setConfirm(false); setDispatch('sending'); setView('github');
        try {
            const r = await fetch(`${API}/gh/dispatch`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: ghMode, platforms: ghPlat }) }).then(r => r.json());
            if (r.error) throw new Error(r.error);
            setDispatch('sent');
            setTimeout(loadRuns, 4000);   // GitHub lists the new run after a few seconds
            setTimeout(() => setDispatch(d => (d === 'sent' ? null : d)), 8000);
        } catch (e) { setDispatch(e.message); }
    };

    const lineColor = (type) => {
        if (type === 'err')  return '#ff6b6b';
        if (type === 'exit') return '#8f98a0';
        return '#c6d4df';
    };
    const exit = log.find(l => l.type === 'exit');
    const failed = exit && !/code 0\b/.test(exit.text);
    const ghModeInfo = GH_MODES.find(m => m.id === ghMode);
    const xboxSkipped = sync && !sync.xbox && ghPlat === 'all' && ghMode !== 'watchlist-only';

    return (
        <div className="flex h-full overflow-hidden">
            {/* Left: start a run */}
            <div className="pane pane-side w-[300px] shrink-0 overflow-y-auto">
                {/* cron-job.org: what starts the runs on its own */}
                <CronJobs onStarted={() => { setView('github'); setTimeout(loadRuns, 4000); }} />

                {/* GitHub Actions: the real runs, published to the data branch */}
                <div className="p-3 border-b border-[#2a475e] flex flex-col gap-2.5">
                    <div className="flex items-center gap-2 px-0.5">
                        <Github size={14} className="text-[#c6d4df]" />
                        <span className="text-[11px] text-[#8f98a0] font-bold uppercase tracking-[0.07em] flex-1">Run on GitHub</span>
                        <span className="chip chip-blue h-[18px] text-[10px]">Publishes</span>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5">
                        {GH_MODES.map(m => (
                            <button key={m.id} onClick={() => { setGhMode(m.id); setConfirm(false); }}
                                className={`h-8 rounded-[3px] border text-[12px] font-medium transition-colors ${ghMode === m.id ? 'border-[#66c0f4] bg-[#66c0f4]/10 text-white' : 'border-[#2a475e] text-[#8f98a0] hover:text-white'}`}>{m.label}</button>
                        ))}
                    </div>
                    <span className="hint px-0.5 -mt-1 min-h-[30px]">{ghModeInfo.desc}</span>
                    <div className={`seg w-full ${ghMode === 'watchlist-only' ? 'opacity-40 pointer-events-none' : ''}`}>
                        {GH_PLATFORMS.map(([id, l]) => (
                            <button key={id} onClick={() => { setGhPlat(id); setConfirm(false); }} className={`flex-1 justify-center ${ghPlat === id ? 'on' : ''}`}>{l}</button>
                        ))}
                    </div>
                    {xboxSkipped && <span className="hint px-0.5 flex items-center gap-1.5"><Pause size={11} className="text-[#e5b143]" />Xbox sync is paused: All skips it, pick Xbox to run it</span>}
                    {!confirm ? (
                        <button className="btn btn-primary w-full" disabled={dispatch === 'sending'} onClick={() => setConfirm(true)}>
                            {dispatch === 'sending' ? <Loader2 size={14} className="animate-spin" /> : <Play size={14} />}Run {ghModeInfo.label.toLowerCase()}{ghMode !== 'watchlist-only' && ghPlat !== 'all' ? ` · ${GH_PLATFORMS.find(p => p[0] === ghPlat)[1]}` : ''}
                        </button>
                    ) : (
                        <div className="flex flex-col gap-2 p-2.5 rounded-[3px] border border-[#e5b143]/40 bg-[#e5b143]/[0.06] anim-fade">
                            <span className="text-[12px] text-[#c6d4df]">Start <b className="text-white">{ghModeInfo.label.toLowerCase()}</b> ({ghMode === 'watchlist-only' ? 'RA' : GH_PLATFORMS.find(p => p[0] === ghPlat)[1]}) on GitHub? When data changes it commits to the data branch and redeploys the site.</span>
                            <div className="flex gap-1.5">
                                <button className="btn btn-primary btn-sm flex-1" onClick={sendDispatch}><Play size={12} />Start</button>
                                <button className="btn btn-ghost btn-sm" onClick={() => setConfirm(false)}>Cancel</button>
                            </div>
                        </div>
                    )}
                    {dispatch === 'sent' && <span className="chip chip-blue self-start anim-fade"><Check size={11} />Started: it shows up in the list in a few seconds</span>}
                    {dispatch && dispatch !== 'sending' && dispatch !== 'sent' && <span className="chip chip-red self-start !h-auto py-1 whitespace-normal anim-fade">{dispatch}</span>}
                </div>

                {/* Local: tools, then test runs that write data/ here only */}
                {PIPELINE_MODES.map(({ platform, img, icon: GIcon, test, modes }, gi) => (
                    <div key={platform} className="p-3 border-b border-[#2a475e]">
                        {gi === 1 && (
                            <div className="flex items-start gap-2 mb-3 -mt-0.5 px-2.5 py-2 rounded-[3px] bg-[#131a22] border border-[#2a475e] text-[11px] text-[#8f98a0]">
                                <Terminal size={13} className="shrink-0 mt-[1px]" />
                                <span>Local test runs: they write <code className="mono text-[#66c0f4]">data/</code> in this checkout only, never the live site</span>
                            </div>
                        )}
                        <div className="flex items-center gap-2 mb-2.5 px-0.5">
                            {img ? <img src={img} alt="" className="w-4 h-4 rounded-[2px]" /> : GIcon && <GIcon size={14} className="text-[#c6d4df]" />}
                            <span className="text-[11px] text-[#8f98a0] font-bold uppercase tracking-[0.07em] flex-1">{platform}</span>
                            {platform === 'Xbox' && sync && !sync.xbox && <span className="chip chip-gold h-[18px] text-[10px]" title="XBOX_ENABLED is 'false' in fetch-data.yml"><Pause size={10} />Paused on GitHub</span>}
                        </div>
                        <div className="flex flex-col gap-1.5">

                                 : null}

                                {log.length > 0 && !running && <button onClick={() => { setLog([]); setMode(null); }} className="btn btn-ghost btn-sm anim-fade"><Trash2 size={13} />Clear</button>}
                            </div>
                            {log.length === 0 && !running
                                ? <Empty icon={Terminal} title="No local run yet" hint="Local tools and test runs on the left stream their output here. Files they write show up in Data Diff." />
                                : (
                                    <div ref={logRef} className="flex-1 overflow-y-auto px-4 py-3 mono text-[12px] leading-relaxed bg-[#101214]">
                                        {log.map((line, i) => (
                                            <div key={i} className="whitespace-pre-wrap break-words" style={{ color: lineColor(line.type) }}>{line.text}</div>
                                        ))}

                                    </div>

                        </>
                    )}
                </div>
            </div>
        </div>
    );
}

// Parses unified diff lines into side-by-side row pairs
// Returns [{ type: 'hunk'|'same'|'change'|'add'|'del', left, right, leftNo, rightNo }]
function parseSideBySide(lines) {
    const rows = [];
    let leftNo = 0, rightNo = 0;

    // Strip file header lines (diff --git, index, ---, +++)
    const diffLines = lines.filter(l =>
        !l.startsWith('diff ') && !l.startsWith('index ') &&
        !l.startsWith('--- ') && !l.startsWith('+++ ')
    );

    let i = 0;
    while (i < diffLines.length) {
        const line = diffLines[i];
        if (line.startsWith('@@')) {
            const m = line.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
            if (m) { leftNo = parseInt(m[1]); rightNo = parseInt(m[2]); }
            rows.push({ type: 'hunk', left: line, right: '' });
            i++; continue;
        }

        // Collect a block of removals then additions to pair them
        const dels = [], adds = [];
        while (i < diffLines.length && diffLines[i].startsWith('-')) { dels.push(diffLines[i].slice(1)); i++; }
        while (i < diffLines.length && diffLines[i].startsWith('+')) { adds.push(diffLines[i].slice(1)); i++; }

        if (dels.length || adds.length) {
            const len = Math.max(dels.length, adds.length);
            for (let j = 0; j < len; j++) {
                const hasDel = j < dels.length, hasAdd = j < adds.length;
                rows.push({
                    type:    hasDel && hasAdd ? 'change' : hasDel ? 'del' : 'add',
                    left:    hasDel ? dels[j] : null,
                    right:   hasAdd ? adds[j] : null,
                    leftNo:  hasDel ? leftNo++  : null,
                    rightNo: hasAdd ? rightNo++ : null,
                });
            }
            continue;
        }

        // Context line
        if (line.startsWith(' ') || line === '') {
            rows.push({ type: 'same', left: line.slice(1), right: line.slice(1), leftNo: leftNo++, rightNo: rightNo++ });
        }
        i++;
    }
    return rows;
}

const BG = {
    hunk:   { cell: '#1a2535', line: '#1a2535' },
    same:   { cell: 'transparent', line: 'transparent' },
    del:    { left: 'rgba(255,107,107,0.15)', right: 'rgba(255,107,107,0.04)', leftLine: 'rgba(255,107,107,0.3)', rightLine: 'transparent' },
    add:    { left: 'rgba(87,203,222,0.04)',  right: 'rgba(87,203,222,0.15)', leftLine: 'transparent', rightLine: 'rgba(87,203,222,0.3)' },
    change: { left: 'rgba(255,107,107,0.15)', right: 'rgba(87,203,222,0.15)', leftLine: 'rgba(255,107,107,0.3)', rightLine: 'rgba(87,203,222,0.3)' },
};

const SideBySideRow = ({ row }) => {
    if (row.type === 'hunk') return (
        <tr style={{ background: BG.hunk.cell }}>
            <td colSpan={4} className="px-3 py-0.5 mono text-[11px]" style={{ color: '#e5b143' }}>{row.left}</td>
        </tr>
    );
    const bg     = BG[row.type];
    const leftBg = row.type === 'same' ? 'transparent' : (bg.left  ?? bg.cell);
    const rightBg= row.type === 'same' ? 'transparent' : (bg.right ?? bg.cell);
    const leftLn = row.type === 'same' ? 'transparent' : (bg.leftLine  ?? 'transparent');
    const rightLn= row.type === 'same' ? 'transparent' : (bg.rightLine ?? 'transparent');
    return (
        <tr>
            <td className="select-none text-right pr-2 pl-1 mono text-[11px] w-[32px] shrink-0" style={{ color: '#546270', background: leftLn, borderRight: '1px solid #2a475e' }}>
                {row.leftNo ?? ''}
            </td>
            <td className="mono text-[11px] px-2 whitespace-pre" style={{ color: row.left === null ? '#546270' : '#c6d4df', background: leftBg, borderRight: '1px solid #2a475e', minWidth: 0, maxWidth: '50%', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                {row.left ?? ''}
            </td>
            <td className="select-none text-right pr-2 pl-1 mono text-[11px] w-[32px] shrink-0" style={{ color: '#546270', background: rightLn, borderRight: '1px solid #2a475e' }}>
                {row.rightNo ?? ''}
            </td>
            <td className="mono text-[11px] px-2 whitespace-pre" style={{ color: row.right === null ? '#546270' : '#c6d4df', background: rightBg, minWidth: 0 }}>
                {row.right ?? ''}
            </td>
        </tr>
    );
};

// Data Diff shows three kinds of change: hand-edited data files not committed yet, commits GitHub's
// main doesn't have (a push sends them all and deploys the site), and pipeline output from local
// runs (on the data branch, never published from here)
const DiffTable = ({ lines }) => (
    <table className="w-full border-collapse" style={{ tableLayout: 'fixed' }}>
        <colgroup><col style={{ width: 40 }} /><col style={{ width: '50%' }} /><col style={{ width: 40 }} /><col style={{ width: '50%' }} /></colgroup>
        <tbody>{parseSideBySide(lines).map((row, i) => <SideBySideRow key={i} row={row} />)}</tbody>
    </table>
);
const diffCounts = (lines) => {
    const rows = parseSideBySide(lines);
    return { adds: rows.filter(r => r.type === 'add' || r.type === 'change').length, dels: rows.filter(r => r.type === 'del' || r.type === 'change').length };
};
const AddDel = ({ lines }) => {
    const { adds, dels } = diffCounts(lines);
    return <><span className="chip mono" style={{ color: '#57cbde', borderColor: 'rgba(87,203,222,0.35)' }}>+{adds}</span><span className="chip chip-red mono">−{dels}</span></>;
};
const GroupHead = ({ icon: GIcon, color, title, count }) => (
    <div className="flex items-center gap-2 px-3.5 pt-3 pb-1.5">
        <GIcon size={13} style={{ color }} />
        <span className="text-[11px] text-[#8f98a0] font-bold uppercase tracking-[0.07em] flex-1">{title}</span>
        <span className="text-[11px] text-[#546270] tabular-nums">{count}</span>
    </div>
);

// Who commits and who pushes, as this checkout would
function GitIdentity() {
    const [id, setId] = useState(null);
    useEffect(() => { apiGet(`${API}/git/identity`).then(setId).catch(e => setId({ error: e.message })); }, []);
    const key = id?.keys?.[0]?.split('/').pop();
    return (
        <div className="p-3 border-t border-[#2a475e] flex flex-col gap-2 text-[11px]">
            {!id ? <><div className="shimmer h-[14px] rounded-[2px]" /><div className="shimmer h-[14px] w-2/3 rounded-[2px]" /></> : id.error ? <span className="text-[#ff6b6b]">{id.error}</span> : (
                <>
                    <span className="flex items-start gap-2 anim-fade" title={`git config user.name / user.email (${id.scope ?? 'not set'})`}>
                        <GitCommit size={13} className="text-[#546270] shrink-0 mt-[1px]" />
                        <span className="min-w-0">
                            <span className="text-[#8f98a0]">Commits as </span>
                            {id.name ? <b className="text-white font-medium">{id.name}</b> : <b className="text-[#ff6b6b]">no name set</b>}
                            <span className="block text-[#546270] truncate">{id.email ?? 'no email set'}{id.scope ? ` · ${id.scope === 'local' ? 'this repo' : id.scope} config` : ''}</span>
                        </span>
                    </span>
                    <span className="flex items-start gap-2 anim-fade" title={id.remote}>
                        <KeyRound size={13} className="text-[#546270] shrink-0 mt-[1px]" />
                        <span className="min-w-0">
                            <span className="text-[#8f98a0]">Pushes as </span>
                            {id.transport === 'ssh'
                                ? (id.githubUser ? <b className="text-white font-medium">@{id.githubUser}</b> : <b className="text-[#ff6b6b]">unknown</b>)
                                : <b className="text-white font-medium">{id.transport === 'https' ? 'HTTPS' : 'a local folder'}</b>}
                            <span className="block text-[#546270] truncate">
                                {id.transport === 'ssh' ? `SSH key ${key ?? '(default)'} · ${id.sshHost}` : id.transport === 'https' ? `credential helper ${id.helper ?? 'none'}` : id.remote}

                        </span>

}

const GIT_ACTIONS = {
    publish: { label: 'Publish', icon: UploadCloud, url: 'publish',    busy: 'Publishing…', text: 'Commit and push to main: the site redeploys in about a minute.' },
    commit:  { label: 'Commit',  icon: GitCommit,   url: 'git/commit', busy: 'Committing…', text: 'Commit on this laptop only. Push later to make it live.' },
    push:    { label: 'Push',    icon: UploadCloud, url: 'git/push',   busy: 'Pushing…',    text: 'Push to main: the site redeploys in about a minute.' },
};

function GitActions({ edits, st, onDone }) {
    const [open,  setOpen]  = useState(null);   // action waiting for its confirm
    const [state, setState] = useState(null);   // null | { busy } | { ok, action, commit, pushed } | { error }
    const commits = st?.commits ?? [];
    const pushBlock = !st ? 'Checking GitHub…' : st.branch !== 'main' ? `On branch ${st.branch}` : st.behind ? `GitHub has ${st.behind} newer commit${st.behind > 1 ? 's' : ''}: pull first` : null;
    const can = { commit: !!st && edits.length > 0, push: !!st && !pushBlock && commits.length > 0, publish: !!st && !pushBlock && (edits.length > 0 || commits.length > 0) };
    const busy = state?.busy;

    const go = async (action) => {
        setOpen(null); setState({ busy: action });
        try {
            const r = await fetch(`${API}/${GIT_ACTIONS[action].url}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ files: action === 'push' ? [] : edits }) }).then(r => r.json());
            if (r.error) throw new Error(r.error);
            setState({ ok: true, action, ...r });
            onDone();
        } catch (e) { setState({ error: e.message }); }
    };

    const btn = (action, cls, extra = '') => {
        const A = GIT_ACTIONS[action], Icon = busy === action || (!st && action !== 'commit') ? Loader2 : A.icon;
        return (
            <button className={`btn ${cls}`} disabled={!can[action] || !!busy} onClick={() => { setState(null); setOpen(action); }}>
                <Icon size={13} className={Icon === Loader2 ? 'animate-spin' : ''} />{busy === action ? A.busy : `${A.label}${extra}`}
            </button>
        );
    };

    return (
        <div className="p-3 border-b border-[#2a475e] flex flex-col gap-2">
            {btn('publish', 'btn-primary w-full', edits.length ? ` ${edits.length} file${edits.length > 1 ? 's' : ''}` : commits.length ? ` ${commits.length} commit${commits.length > 1 ? 's' : ''}` : '')}
            <div className="grid grid-cols-2 gap-1.5">
                {btn('commit', 'btn-outline btn-sm', edits.length ? ` ${edits.length}` : '')}
                {btn('push', 'btn-outline btn-sm', commits.length ? ` ${commits.length}` : '')}
            </div>
            {pushBlock && st && <span className="chip chip-gold !h-auto py-1 whitespace-normal anim-fade"><AlertTriangle size={11} className="shrink-0" />{pushBlock}</span>}
            {open && (
                <div className="flex flex-col gap-2 p-2.5 rounded-[3px] border border-[#e5b143]/40 bg-[#e5b143]/[0.06] anim-fade">
                    <span className="text-[12px] text-[#c6d4df]">{GIT_ACTIONS[open].text}</span>
                    {open !== 'push' && edits.length > 0 && (
                        <div className="flex flex-col gap-0.5">
                            <span className="text-[10px] text-[#8f98a0] uppercase tracking-[0.07em] font-bold">Commits</span>
                            {edits.map(f => <span key={f} className="mono text-[11px] text-[#66c0f4] truncate">{f.replace(/^data\//, '')}</span>)}
                        </div>
                    )}
                    {open !== 'commit' && commits.length > 0 && (
                        <div className="flex flex-col gap-0.5">
                            <span className="text-[10px] text-[#8f98a0] uppercase tracking-[0.07em] font-bold">{open === 'push' ? 'Pushes' : 'Also pushes'} {commits.length} commit{commits.length > 1 ? 's' : ''}</span>
                            {commits.slice(0, 5).map(c => <span key={c.sha} className="mono text-[10px] text-[#c6d4df] truncate"><span className="text-[#546270]">{c.sha}</span> {c.subject}</span>)}
                            {commits.length > 5 && <span className="text-[10px] text-[#546270]">+{commits.length - 5} more</span>}
                        </div>
                    )}
                    <div className="flex gap-1.5">
                        <button className="btn btn-primary btn-sm flex-1" onClick={() => go(open)}>{React.createElement(GIT_ACTIONS[open].icon, { size: 12 })}{GIT_ACTIONS[open].label}</button>
                        <button className="btn btn-ghost btn-sm" onClick={() => setOpen(null)}>Cancel</button>
                    </div>
                </div>
            )}
            {state?.ok && (state.action === 'commit'
                ? <span className="chip chip-blue self-start anim-fade"><Check size={11} />Committed {state.commit} · not pushed</span>
                : <a className="chip chip-blue self-start anim-fade" href="https://github.com/yozuryu/gaming-hub/actions/workflows/deploy.yml" target="_blank" rel="noreferrer">
                    <Check size={11} />Pushed {state.pushed} commit{state.pushed > 1 ? 's' : ''} · deploying<ExternalLink size={10} />
                  </a>)}
            {state?.error && <span className="chip chip-red !h-auto py-1 whitespace-normal anim-fade">{state.error}</span>}
        </div>
    );
}

    if (!c) return <SkPage />;
    if (c.error) return <Empty icon={XCircle} title="Couldn't read the commit" hint={c.error} />;
    // Code commits: made outside the admin, so the details only (message, files, line counts)
    if (c.code) return (
        <>
            <div className="pane-h">
                <GitCommit size={15} className="text-[#8f98a0] shrink-0" />
                <span className="pane-t flex-1 truncate">{c.subject}</span>
                <span className="chip shrink-0"><Terminal size={11} />Code</span>

            <div className="flex-1 overflow-y-auto p-5">
                <div className="max-w-[760px] flex flex-col gap-4">

                            <span className="text-[11px] text-[#8f98a0] font-bold uppercase tracking-[0.07em] flex-1">Files</span>
                            <span className="text-[11px] text-[#546270] tabular-nums">{c.stat.length}</span>
                        </div>
                        {c.stat.map(f => (
                            <div key={f.file} className="flex items-center gap-2 px-4 py-2 border-b border-[#2a475e]/50 last:border-0">
                                <FileJson size={13} className="text-[#546270] shrink-0" />
                                <span className="mono text-[12px] text-[#c6d4df] flex-1 truncate">{f.file}</span>
                                {f.add === null ? <span className="chip">binary</span> : <>
                                    <span className="mono text-[11px] text-[#57cbde] tabular-nums">+{f.add}</span>
                                    <span className="mono text-[11px] text-[#ff6b6b] tabular-nums w-12 text-right">−{f.del}</span>

                        ))}
                    </div>

        </>
    );
    return (
        <>
            <div className="pane-h">
                <GitCommit size={15} className="text-[#e5b143] shrink-0" />
                <span className="pane-t flex-1 truncate">{c.subject}</span>
                <span className="text-[11px] text-[#546270] mono shrink-0">{c.sha} · {c.author} · {ago(c.date)}</span>
            </div>
            <div className="flex-1 overflow-auto bg-[#131a22]">
                {c.diffs.map(d => (
                    <div key={d.file}>
                        <div className="sticky top-0 z-[1] flex items-center gap-2 px-3 py-1.5 bg-[#1b2838] border-y border-[#2a475e]">
                            <FileJson size={13} className="text-[#546270]" />
                            <span className="mono text-[11px] text-[#c6d4df] flex-1 truncate">{d.file}</span>
                            <AddDel lines={d.lines} />
                        </div>
                        <DiffTable lines={d.lines} />
                    </div>
                ))}
            </div>
        </>
    );
}

function DataDiffModule() {
    const [files,    setFiles]    = useState([]);
    const [st,       setSt]       = useState(null);   // /publish/status: commits not pushed (fetches first: a few seconds)
    const [loading,  setLoading]  = useState(true);
    const [selected, setSelected] = useState(null);   // { file } | { sha }

    const load = () => {
        setLoading(true); setSt(null);
        fetch(`${API}/diff`).then(r => r.json()).then(d => {
            const list = d.files ?? [];
            setFiles(list);
            setSelected(sel => (sel?.file && list.find(f => f.file === sel.file)) ? { file: sel.file } : list.find(f => f.kind === 'edit') ? { file: list.find(f => f.kind === 'edit').file } : list[0] ? { file: list[0].file } : null);
            setLoading(false);
        });
        apiGet(`${API}/publish/status`).then(s => {
            setSt(s);
            setSelected(sel => sel ?? (s.commits?.[0] ? { sha: s.commits[0].sha } : null));
        }).catch(e => setSt({ error: e.message, commits: [] }));
    };
    useEffect(() => { load(); }, []);

    const edits  = files.filter(f => f.kind === 'edit');
    const local  = files.filter(f => f.kind === 'local');
    const commits = st?.commits ?? [];
    const file = selected?.file ? files.find(f => f.file === selected.file) : null;
    const total = edits.length + commits.length + local.length;

    const FileRow = ({ f }) => {
        const parts = f.file.replace('data/', '').split('/');
        return (
            <button onClick={() => setSelected({ file: f.file })} className={`lrow ${selected?.file === f.file ? 'on' : ''}`}>
                <FileJson size={15} className={`shrink-0 ${f.kind === 'edit' ? 'text-[#e5b143]' : 'text-[#546270]'}`} />
                <span className="lrow-b">
                    <span className="lrow-t mono text-[11px]">{parts.pop()}</span>
                    <span className="lrow-s mono text-[10px]">{parts.join('/') || 'data'}{f.isNew ? ' · new' : ''}</span>
                </span>
            </button>
        );
    };

    return (
        <div className="flex h-full overflow-hidden">
            <div className="pane pane-side w-[280px] shrink-0">
                <div className="pane-h">
                    <span className="text-[12px] text-[#8f98a0] flex-1">{loading ? 'Comparing…' : total ? `${total} change${total !== 1 ? 's' : ''}` : 'No changes'}</span>
                    <button onClick={load} className="icon-btn" title="Compare again"><RotateCw size={14} className={loading || !st ? 'animate-spin' : ''} /></button>
                </div>
                {!loading && <GitActions edits={edits.map(f => f.file)} st={st?.error ? null : st} onDone={load} />}
                {st?.error && <span className="chip chip-red m-3 !h-auto py-1 whitespace-normal">{st.error}</span>}
                <div className="flex-1 overflow-y-auto">
                    {loading && <SkRows n={6} icon={false} />}
                    {!loading && edits.length > 0 && (
                        <div className="anim-fade">
                            <GroupHead icon={FileDiff} color="#e5b143" title="Not committed" count={edits.length} />
                            {edits.map(f => <FileRow key={f.file} f={f} />)}
                        </div>
                    )}
                    {!loading && !st && <><GroupHead icon={UploadCloud} color="#66c0f4" title="Ready to push" count="…" /><SkRows n={2} icon={false} /></>}
                    {!loading && commits.length > 0 && (
                        <div className="anim-fade">
                            <GroupHead icon={UploadCloud} color="#66c0f4" title="Ready to push" count={commits.length} />
                            {commits.map(c => {
                                const data = c.files.every(f => f.startsWith('data/'));
                                return (
                                    <button key={c.sha} onClick={() => setSelected({ sha: c.sha })} className={`lrow ${selected?.sha === c.sha ? 'on' : ''}`} title={c.files.join('\n')}>
                                        <GitCommit size={15} className={`shrink-0 ${data ? 'text-[#66c0f4]' : 'text-[#8f98a0]'}`} />
                                        <span className="lrow-b">
                                            <span className="lrow-t text-[12px]">{c.subject}</span>
                                            <span className="lrow-s mono text-[10px]">{c.sha} · {c.files.length} file{c.files.length !== 1 ? 's' : ''}{data ? '' : ' · code'} · {ago(c.date)}</span>
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                    )}
                    {!loading && local.length > 0 && (
                        <div className="anim-fade">
                            <GroupHead icon={Terminal} color="#546270" title="Local only" count={local.length} />
                            {local.map(f => <FileRow key={f.file} f={f} />)}
                        </div>
                    )}
                    {!loading && st && !total && <Empty icon={Check} title="No changes" hint="Everything is on GitHub, data/ matches the last pull" />}
                </div>
                <GitIdentity />
            </div>

            <div key={selected?.file ?? selected?.sha ?? 'none'} className="pane flex-1 anim-fade">
                {selected?.sha ? <CommitView sha={selected.sha} /> : file ? (
                    <>
                        <div className="pane-h">
                            <span className="pane-t mono text-[12px] flex-1">{file.file}</span>
                            {file.kind === 'edit'
                                ? <span className="chip chip-gold"><FileDiff size={11} />Not committed</span>
                                : <span className="chip"><Terminal size={11} />Local only: never published</span>}
                            <AddDel lines={file.lines} />
                        </div>
                        <div className="flex-1 overflow-auto bg-[#131a22]"><DiffTable lines={file.lines} /></div>
                    </>
                ) : (
                    !loading && <Empty icon={FileDiff} title={total ? 'Pick a change' : 'Nothing to compare'} hint="Data edits not committed, commits not on GitHub yet, and local pipeline output" />
                )}
            </div>
        </div>
    );
}

// MODULE: Idle Games
// Games left running (idle / clicker games): their playtime isn't play, so Analytics and the hub's
// Analytics strip leave them out by default ("Hide idle"). RA and Steam only: Xbox has no playtime.
// data/hub/idle-games.json: { games: ["ra:45053", "steam:123"] }
// ═══════════════════════════════════════════════════════════════════════════════

function IdleGamesModule() {
    const { data, load, update, dirty, saving, saved, save } = useSaver('data/hub/idle-games.json');
    const [games, setGames] = useState(null);
    const [search, setSearch] = useState('');

    useEffect(() => {
        apiData('data/hub/idle-games.json').catch(() => null).then(d => load({ games: d?.games ?? [] }));
        Promise.all(['ra', 'steam'].map(p => SERIES_CONFIGS[p].loadGames().catch(() => []).then(gs => gs.map(g => ({

    );
}

// MODULE: Farm Games
// Achievement farms are detected on Steam (FARM_* in analytics/utils.js: 10+ unlocks, more than 15 an
// hour of playtime). Here: mark more by hand (any platform) or overrule a detected one. Analytics, the
// hub's Analytics strip and Playing read data/hub/farm-games.json: { farms: [...], notFarms: [...] }
// ═══════════════════════════════════════════════════════════════════════════════

const FARM_PER_HOUR = 15, FARM_MIN_UNLOCKS = 10;   // keep in step with analytics/utils.js and assets/playing.js

// A game that can be flagged (idle, farm): tap toggles it; the right side says its state
const GameFlagRow = ({ g, on, label, onClick, extra, tone = 'blue' }) => (
    <button onClick={onClick} className={`lrow group ${on ? (tone === 'gold' ? '!border-l-[#e5b143]' : '!border-l-[#66c0f4]') : ''}`}>
        {g.icon ? <img src={g.icon} alt="" className="lrow-i" /> : <span className="lrow-i" />}
        <span className="lrow-b">
            <span className="lrow-t">{g.title}</span>
            <span className="lrow-s">{g.consoleName}{extra && <> · {extra}</>}</span>
        </span>
        <span className={`chip shrink-0 ${on ? (tone === 'gold' ? 'chip-gold' : 'chip-blue') : 'group-hover:!text-white'}`}>
            {on ? <Check size={11} /> : <Plus size={11} />}{label}
        </span>
    </button>
);

function FarmGamesModule() {
    const { data, load, update, dirty, saving, saved, save } = useSaver('data/hub/farm-games.json');
    const [games, setGames] = useState(null);
    const [detected, setDetected] = useState(null);
    const [search, setSearch] = useState('');

    useEffect(() => {
        apiData('data/hub/farm-games.json').catch(() => null).then(d => load({ farms: d?.farms ?? [], notFarms: d?.notFarms ?? [] }));
        apiData('data/steam/games/index.json').catch(() => null).then(d => setDetected(Object.values(d?.achievementProgress ?? {})
            .map(g => ({ ...g, rate: g.unlocked / Math.max((g.playtimeForever ?? 0) / 60, 0.1) }))
            .filter(g => g.unlocked >= FARM_MIN_UNLOCKS && g.rate > FARM_PER_HOUR)
            .sort((a, b) => b.rate - a.rate)
            .map(g => ({ id: `steam:${g.appId}`, title: g.gameName ?? `App ${g.appId}`, icon: g.iconUrl, consoleName: 'Steam',
                extra: `${g.unlocked} unlocks in ${Math.round((g.playtimeForever ?? 0) / 6) / 10}h · ${Math.round(g.rate)}/h` }))));
        Promise.all(['ra', 'steam', 'xbox'].map(p => SERIES_CONFIGS[p].loadGames().catch(() => []).then(gs => gs.map(g => ({
            ...g, id: `${p}:${g.id}`, consoleName: g.consoleName ? `${PLATFORM_LABEL[p]} · ${g.consoleName}` : PLATFORM_LABEL[p],
        }))))).then(lists => setGames(lists.flat().sort((a, b) => a.title.localeCompare(b.title))));
    }, []);

    if (!data || !games || !detected) return <SkPage />;
    const marked = new Set(data.farms), overruled = new Set(data.notFarms), auto = new Set(detected.map(g => g.id));
    const toggleList = (key, id) => update({ ...data, [key]: data[key].includes(id) ? data[key].filter(x => x !== id) : [...data[key], id] });
    const byId = Object.fromEntries(games.map(g => [g.id, g]));
    const q = search.trim().toLowerCase();
    const found = q ? games.filter(g => g.title.toLowerCase().includes(q) && !auto.has(g.id)).slice(0, 60) : [];
    const farmCount = detected.length - detected.filter(g => overruled.has(g.id)).length + data.farms.length;

    return (
        <div className="h-full overflow-y-auto">
            <SaveBar dirty={dirty} saving={saving} saved={saved} extra={<span className="chip"><Sprout size={11} />{farmCount} farms</span>} onSave={save} />
            <div className="p-6 grid gap-4 max-w-[1100px] lg:grid-cols-2 items-start">
                <Card icon={Sprout} title="Detected" note={<span className="chip mono">Steam · {FARM_MIN_UNLOCKS}+ unlocks · &gt;{FARM_PER_HOUR}/h</span>}>
                    <p className="text-[12px] text-[#8f98a0] -mt-1">Found by the rule. Tap one that's a real game to keep it in the numbers.</p>
                    <div className="flex flex-col -mx-4 -mb-4 border-t border-[#1f2f3d]">
                        {detected.length === 0 && <Empty icon={Check} title="Nothing detected" />}
                        {detected.map(g => (
                            <GameFlagRow key={g.id} g={g} extra={g.extra} on={!overruled.has(g.id)} tone="gold"
                                label={overruled.has(g.id) ? 'Not a farm' : 'Farm'} onClick={() => toggleList('notFarms', g.id)} />
                        ))}
                    </div>
                </Card>
                <Card icon={Plus} title="Marked by hand" note={<span className="hint">Any platform</span>}>
                    <SearchInput value={search} onChange={setSearch} placeholder="Search RA, Steam and Xbox games" />
                    <div key={q} className="flex flex-col -mx-4 -mb-4 border-t border-[#1f2f3d] anim-fade">
                        {!q && data.farms.length === 0 && <Empty icon={Sprout} title="None marked" hint="Search for a game the rule misses, like an easy 1,000G Xbox game" />}
                        {!q && data.farms.map(id => <GameFlagRow key={id} g={byId[id] ?? { title: id, consoleName: '' }} on tone="gold" label="Farm" onClick={() => toggleList('farms', id)} />)}
                        {q && found.length === 0 && <Empty icon={Search} title="No match" />}
                        {found.map(g => <GameFlagRow key={g.id} g={g} on={marked.has(g.id)} tone="gold" label={marked.has(g.id) ? 'Farm' : 'Mark'} onClick={() => toggleList('farms', g.id)} />)}
                    </div>
                </Card>
            </div>
        </div>
    );
}

// ═══════════════════════════════════════════════════════════════════════════════
// MODULE: RA Art (SteamGridDB)
// Wide art for RA games, which only have a square icon and a screenshot: pick a banner grid
// (thumb for rows and tiles) and optionally a hero (blurred behind sheet headers) per game.
// data/ra/art.json stores URLs only: { games: { [raId]: { sgdbGameId, sgdbName, grid, hero } } }.
// Lookups go through the admin server (scripts/lib/steamgriddb.js); the key never reaches this page.
// ═══════════════════════════════════════════════════════════════════════════════

const raBaseTitle = t => (t ?? '').replace(/~[^~]+~\s*/g, '').replace(/\s*\[Subset[^\]]*\]\s*$/, '').trim();
const pickImage = x => x && { id: x.id, url: x.url, thumb: x.thumb, width: x.width, height: x.height };

function RAArtModule() {
    const [games,   setGames]   = useState([]);
    const [art,     setArt]     = useState(null);
    const [filter,  setFilter]  = useState('marked');
    const [search,  setSearch]  = useState('');
    const [selected, setSelected] = useState(null);
    const [dirty,   setDirty]   = useState(false);
    const [saving,  setSaving]  = useState(false);
    const [saved,   setSaved]   = useState(false);
    // SteamGridDB state for the selected game
    const [query,   setQuery]   = useState('');
    const [results, setResults] = useState(null);
    const [sgGame,  setSgGame]  = useState(null);
    const [grids,   setGrids]   = useState(null);
    const [heroes,  setHeroes]  = useState(null);
    const [error,   setError]   = useState(null);
    const [busy,    setBusy]    = useState(false);
    const [zoom,    setZoom]    = useState(null);   // { img, kind } shown full size in an overlay

    useEffect(() => {
        if (!zoom) return;
        const onKey = e => { if (e.key === 'Escape') setZoom(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
    }, [zoom]);

    useEffect(() => {
        Promise.all([apiGet(`${API}/games/ra`), apiData('data/ra/art.json')]).then(([g, a]) => {
            // Played games first (they're on the profile lists), then want-to-play
            setGames(g.map(x => ({ ...x, icon: `${RA_MEDIA}${x.imageIcon}`, url: `${RA_SITE}/game/${x.id}` }))
                .sort((x, y) => (!!y.played - !!x.played) || x.title.localeCompare(y.title)));
            setArt(a?.games ? a : { metadata: a?.metadata ?? {}, games: {} });
        });
    }, []);

    const sgdb = (p) => apiGet(`${API}/sgdb/${p}`).then(d => { if (d?.error) throw new Error(d.error); return d; });
    const loadImages = async (g) => {
        setSgGame(g); setGrids(null); setHeroes(null); setError(null);
        try {
            const [gr, he] = await Promise.all([sgdb(`images?gameId=${g.id}&kind=grid`), sgdb(`images?gameId=${g.id}&kind=hero`)]);
            setGrids(gr); setHeroes(he);
        } catch (e) { setError(e.message); }
    };
    const runSearch = async (q) => {
        if (!q.trim()) return;
        setBusy(true); setResults(null); setSgGame(null); setGrids(null); setHeroes(null); setError(null);
        try {
            const r = await sgdb(`search?q=${encodeURIComponent(q.trim())}`);
            setResults(r);
            if (r[0]) await loadImages(r[0]);   // suggestion: the top match, nothing saved until Save
        } catch (e) { setError(e.message); }
        setBusy(false);
    };

    // Selecting a game searches SteamGridDB for its title (tags and subset names stripped)
    useEffect(() => {
        if (!selected) return;
        const cur = art?.games?.[selected.id];
        const q = cur?.sgdbName || raBaseTitle(selected.title);
        setQuery(q);
        runSearch(q);
    }, [selected?.id]);

    const entry = selected ? art?.games?.[selected.id] : null;
    const setEntry = (patch) => {
        setArt(a => {
            const prev = a.games[selected.id] ?? {};
            const next = { ...prev, ...patch };
            const games = { ...a.games };
            if (!next.grid && !next.hero) delete games[selected.id]; else games[selected.id] = next;
            return { ...a, games };
        });
        setDirty(true); setSaved(false);
    };
    const choose = (kind, img) => setEntry({
        sgdbGameId: sgGame?.id ?? entry?.sgdbGameId, sgdbName: sgGame?.name ?? entry?.sgdbName,
        [kind]: entry?.[kind]?.id === img.id ? null : pickImage(img),   // tap the picked one again to clear it
    });
    const save = async () => {
        setSaving(true);
        await apiSave('data/ra/art.json', { ...art, metadata: { ...(art.metadata ?? {}), updatedAt: new Date().toISOString() } });
        setSaving(false); setDirty(false); setSaved(true);
    };

    if (!art) return <SkSplit side={320} />;

    const withArt = id => !!art.games[id];
    // art.marked: games worth picking art for, with why (marked by Claude from the data, or by hand here)
    const marks = art.marked ?? {};
    const isMarked = id => !!marks[id];
    const list = games.filter(g =>
        (filter === 'all' || (filter === 'with' ? withArt(g.id) : filter === 'marked' ? isMarked(g.id) : !withArt(g.id))) &&
        (!search || g.title.toLowerCase().includes(search.toLowerCase())))
        // Marked: the ones still without art first
        .sort((a, b) => filter === 'marked' ? (withArt(a.id) - withArt(b.id)) : 0);
    const counts = { all: games.length, with: games.filter(g => withArt(g.id)).length, marked: Object.keys(marks).length };
    counts.without = counts.all - counts.with;
    const markedLeft = Object.keys(marks).filter(id => !withArt(id)).length;
    // Clear the marks of games that already have art (they're done), and save at once: the Save button only
    // shows with a game selected. Saving writes the whole file, so unsaved picks are saved along with it
    const markedDone = Object.keys(marks).filter(id => withArt(id)).length;
    const unmarkDone = async () => {
        const next = { ...art, marked: Object.fromEntries(Object.entries(art.marked ?? {}).filter(([id]) => !art.games[id])),
            metadata: { ...(art.metadata ?? {}), updatedAt: new Date().toISOString() } };
        setArt(next); setSaving(true);
        await apiSave('data/ra/art.json', next);
        setSaving(false); setDirty(false); setSaved(true);
    };
    const toggleMark = () => {
        setArt(a => {
            const m = { ...(a.marked ?? {}) };
            if (m[selected.id]) delete m[selected.id]; else m[selected.id] = ['Marked by hand'];
            return { ...a, marked: m };
        });
        setDirty(true); setSaved(false);
    };

    const Thumb = ({ img, kind, wide }) => {
        const on = entry?.[kind]?.id === img.id;
        return (
            <div className="relative group">
                <button onClick={() => choose(kind, img)} title={`${img.width}×${img.height}${img.style ? ` · ${img.style}` : ''}${img.author ? ` · by ${img.author}` : ''}${img.score ? ` · ${img.score} votes` : ''}`}
                    className={`relative w-full rounded-[3px] overflow-hidden border-2 transition-colors ${on ? 'border-[#e5b143]' : 'border-transparent hover:border-[#66c0f4]'}`}
                    style={{ aspectRatio: wide ? '1920 / 620' : '460 / 215' }}>
                    <img src={img.thumb} alt="" loading="lazy" className="w-full h-full object-cover bg-[#101214]" />
                    {on && <span className="absolute top-1.5 left-1.5 chip !h-[18px] !bg-[#e5b143] !text-[#101214] !border-[#e5b143] tag-up"><Check size={10} />Picked</span>}
                    <span className="absolute bottom-1.5 left-1.5 text-[10px] text-white bg-black/65 px-1.5 rounded-[2px] tabular-nums">{img.width}×{img.height}</span>
                </button>
                {/* Full size: its own button so a tap on the image still picks it */}
                <button onClick={() => setZoom({ img, kind })} title="View full size"
                    className="absolute bottom-1.5 right-1.5 w-7 h-7 grid place-items-center rounded-[3px] bg-black/70 text-white opacity-0 group-hover:opacity-100 hover:bg-[#66c0f4] hover:text-[#101214] transition"><Maximize2 size={13} /></button>
            </div>
        );
    };

    return (
        <div className="flex h-full overflow-hidden">
            <SaveBar dirty={dirty} saving={saving} saved={saved} onSave={save} />
            {/* Full-size view: click outside or Escape closes; Pick / Unpick from here too */}
            {zoom && (
                <div className="fixed inset-0 z-50 bg-black/85 flex flex-col items-center justify-center gap-3 p-6 anim-backdrop" onClick={() => setZoom(null)}>
                    <img src={zoom.img.url} alt="" className="max-w-full max-h-[80vh] object-contain rounded-[3px] shadow-2xl anim-pop" onClick={e => e.stopPropagation()} />
                    <div className="flex items-center gap-3 text-[12px] text-[#c6d4df]" onClick={e => e.stopPropagation()}>
                        <span>{zoom.img.width}×{zoom.img.height}{zoom.img.style ? ` · ${zoom.img.style}` : ''}{zoom.img.author ? ` · by ${zoom.img.author}` : ''}</span>
                        <button className="btn btn-primary btn-sm" onClick={() => { choose(zoom.kind, zoom.img); setZoom(null); }}><Check size={12} />{entry?.[zoom.kind]?.id === zoom.img.id ? 'Unpick' : `Pick as ${zoom.kind === 'grid' ? 'banner' : 'hero'}`}</button>
                        <button className="btn btn-ghost btn-sm" onClick={() => setZoom(null)}><X size={12} />Close</button>
                    </div>
                </div>
            )}

            {/* ── Left: RA games ── */}
            <div className="pane pane-side w-[320px] shrink-0">
                <div className="p-3 flex flex-col gap-2 border-b border-[#2a475e]">
                    <SearchInput value={search} onChange={setSearch} placeholder={`Search ${games.length} RA games`} />
                    <div className="seg w-full">
                        {[['marked', 'Marked'], ['all', 'All'], ['with', 'Art'], ['without', 'No art']].map(([v, l]) => (
                            <button key={v} onClick={() => setFilter(v)} title={v === 'marked' ? `${markedLeft} of ${counts.marked} still without art` : undefined}
                                className={`flex-1 justify-center !px-1.5 whitespace-nowrap ${filter === v ? 'on' : ''}`}>{l}<span className="text-[10px] opacity-60 tabular-nums">{v === 'marked' ? `${markedLeft}/${counts.marked}` : counts[v]}</span></button>
                        ))}
                    </div>
                </div>
                <div key={filter} className="flex-1 overflow-y-auto anim-fade">
                    {list.length === 0 && <Empty icon={ImageIcon} title="No games here" />}
                    {list.map(g => (
                        <button key={g.id} onClick={() => setSelected(g)} className={`lrow ${selected?.id === g.id ? 'on' : ''}`}>
                            <img src={g.icon} alt="" className="lrow-i" />
                            <span className="lrow-b">
                                <span className="lrow-t">{g.title}</span>
                                <span className="lrow-s">{g.consoleName}{g.played ? '' : ' · want to play'}</span>
                                {isMarked(g.id) && <span className="lrow-s !text-[#e5b143]">{marks[g.id].join(' · ')}</span>}
                            </span>
                            {withArt(g.id) && <img src={art.games[g.id].grid?.thumb || art.games[g.id].hero?.thumb} alt="" className="w-[52px] h-[24px] rounded-[2px] object-cover shrink-0 border border-[#101214]" />}
                        </button>
                    ))}
                </div>
                <div className="pane-f">
                    <ImageIcon size={12} /><span className="flex-1">{counts.with} games with art</span>
                    {markedDone > 0 && <button className="btn btn-ghost btn-sm" onClick={unmarkDone} title="Remove the mark from every game that already has art (saves at once)"><Check size={12} />Unmark {markedDone} done</button>}
                </div>
            </div>

            {/* ── Right: the selected game ── */}
            {!selected ? (
                <Empty icon={ImageIcon} title="Pick an RA game" hint="RA games only have a square icon and a screenshot. Pick a banner (rows, tiles, Playing) and optionally a hero (blurred behind sheet headers) from SteamGridDB." />
            ) : (
                <div key={selected.id} className="pane flex-1 anim-fade">
                    <div className="flex items-center gap-3 px-4 py-3 border-b border-[#2a475e]">
                        <img src={selected.icon} alt="" className="w-11 h-11 rounded-[2px] border border-[#101214] object-cover" />
                        <div className="flex flex-col min-w-0 flex-1">
                            <a href={selected.url} target="_blank" rel="noreferrer" className="text-[15px] text-white font-semibold truncate hover:text-[#66c0f4]">{selected.title}</a>
                            <span className="text-[12px] text-[#546270] truncate">{selected.consoleName}{entry?.sgdbName ? ` · SteamGridDB: ${entry.sgdbName}` : ''}</span>
                        </div>
                        {/* Current pick, at row size and as the header background */}
                        {entry?.grid && <img src={entry.grid.thumb} alt="" title="Banner (rows, tiles)" className="w-[120px] h-[56px] rounded-[2px] object-cover border border-[#e5b143]" />}
                        {entry?.hero && <img src={entry.hero.thumb} alt="" title="Hero (header background)" className="w-[150px] h-[48px] rounded-[2px] object-cover border border-[#e5b143]" />}
                        <button className={`btn btn-sm ${isMarked(selected.id) ? 'chip-gold border' : 'btn-outline'}`} onClick={toggleMark} title={isMarked(selected.id) ? marks[selected.id].join(' · ') : 'Add to the Marked list'}>
                            <Bookmark size={12} fill={isMarked(selected.id) ? 'currentColor' : 'none'} />{isMarked(selected.id) ? 'Marked' : 'Mark'}
                        </button>
                        {entry && <button className="icon-btn hover:!text-[#ff6b6b]" onClick={() => setEntry({ grid: null, hero: null })} title="Remove the picked art"><Trash2 size={14} /></button>}
                    </div>

                    <div className="flex flex-1 overflow-hidden">
                        {/* SteamGridDB search: the top match is loaded as a suggestion */}
                        <div className="pane w-[270px] shrink-0 border-r border-[#2a475e] bg-[#182230]">
                            <form className="pane-h" onSubmit={e => { e.preventDefault(); runSearch(query); }}>
                                <SearchInput value={query} onChange={setQuery} placeholder="Search SteamGridDB" />
                                <button className="btn btn-primary btn-sm !h-8" type="submit">Find</button>
                            </form>
                            <div className="flex-1 overflow-y-auto">
                                {busy && !results && <SkRows n={5} icon={false} />}
                                {results?.length === 0 && <Empty icon={Search} title="No match on SteamGridDB" hint="Try a shorter or English title" />}
                                {results?.map(r => (
                                    <button key={r.id} onClick={() => loadImages(r)} className={`lrow ${sgGame?.id === r.id ? 'on' : ''}`}>
                                        <span className="lrow-b">
                                            <span className="lrow-t">{r.name}</span>
                                            {(r.year || r.verified) && <span className="lrow-s">{r.year}{r.year && r.verified ? ' · ' : ''}{r.verified ? 'verified' : ''}</span>}
                                        </span>
                                        {r.verified && <Check size={13} className="text-[#57cbde] shrink-0" />}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Images of the chosen SteamGridDB game: tap to pick, tap again to clear */}
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-5">
                            {error && <div className="chip chip-red self-start">{error}</div>}
                            {!sgGame && !error && !busy && <Empty icon={ImageIcon} title="Pick a SteamGridDB match" />}
                            {sgGame && (
                                <>
                                    <div>
                                        <SectionHeader color="#66c0f4" right={<span className="hint">rows, tiles, Playing</span>}>Banner · {grids ? grids.length : '…'}</SectionHeader>
                                        {!grids && <div className="grid grid-cols-3 gap-2">{[0, 1, 2].map(i => <div key={i} className="shimmer" style={{ aspectRatio: '460 / 215' }} />)}</div>}
                                        {grids?.length === 0 && <div className="hint">No banner-shaped grids for this game.</div>}
                                        <div className="grid grid-cols-3 gap-2">{grids?.map(img => <Thumb key={img.id} img={img} kind="grid" />)}</div>
                                    </div>
                                    <div>
                                        <SectionHeader color="#66c0f4" right={<span className="hint">blurred behind sheet headers · optional</span>}>Hero · {heroes ? heroes.length : '…'}</SectionHeader>
                                        {!heroes && <div className="grid grid-cols-2 gap-2">{[0, 1].map(i => <div key={i} className="shimmer" style={{ aspectRatio: '1920 / 620' }} />)}</div>}
                                        {heroes?.length === 0 && <div className="hint">No heroes for this game.</div>}
                                        <div className="grid grid-cols-2 gap-2">{heroes?.map(img => <Thumb key={img.id} img={img} kind="hero" wide />)}</div>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const MODULES = [
    { id: 'config',      label: 'Site Config',   icon: Settings,  group: 'General', component: SiteConfigModule,
      desc: 'Name, motto, genre tags and which platforms and pages show', file: 'data/hub/config.json' },
    { id: 'credentials', label: 'Credentials',   icon: KeyRound,  group: 'General', component: CredentialsModule,
      desc: 'API keys the pipelines use', file: '.env' },
    { id: 'pipelines',   label: 'Pipelines',     icon: Terminal,  group: 'General', component: PipelinesModule,
      desc: 'The schedule, data runs on GitHub, live data pulls and local test runs' },
    { id: 'data-diff',   label: 'Data Diff',     icon: FileDiff,  group: 'General', component: DataDiffModule,
      desc: 'Data edits to commit, commits to push to GitHub, and local pipeline output' },
    { id: 'hub-series',  label: 'Shared Series', icon: Layers,    group: 'Lists', component: HubSeriesModule,
      desc: 'Series across platforms, for the hub and the Series page', file: 'data/hub/series.json' },
    { id: 'idle-games',  label: 'Idle Games',    icon: Hourglass, group: 'Lists', component: IdleGamesModule,
      desc: 'Games left running: Analytics hides their playtime', file: 'data/hub/idle-games.json' },
    { id: 'farm-games',  label: 'Farm Games',    icon: Sprout,    group: 'Lists', component: FarmGamesModule,
      desc: 'Achievement farms: detected on Steam, marked or overruled here', file: 'data/hub/farm-games.json' },
    { id: 'ra-series',            label: 'Series',         icon: Layers,    group: 'RetroAchievements', component: RASeriesModule,
      desc: 'Series on the RA profile', file: 'data/ra/series.json' },
    { id: 'ra-art',               label: 'Art',            icon: ImageIcon, group: 'RetroAchievements', component: RAArtModule,
      desc: 'Wide art from SteamGridDB for RA games', file: 'data/ra/art.json' },
    { id: 'steam-win-conditions', label: 'Win Conditions', icon: Trophy,    group: 'Steam', component: SteamWinConditionsModule,
      desc: 'The achievements that mean a Steam game is beaten', file: 'data/steam/win-conditions.json' },
    { id: 'steam-series',         label: 'Series',         icon: Layers,    group: 'Steam', component: SteamSeriesModule,
      desc: 'Series on the Steam profile', file: 'data/steam/series.json' },
    { id: 'xbox-win-conditions',  label: 'Win Conditions', icon: Trophy,    group: 'Xbox', component: XboxWinConditionsModule,
      desc: 'The achievements that mean an Xbox game is beaten', file: 'data/xbox/win-conditions.json' },
    { id: 'xbox-series',          label: 'Series',         icon: Layers,    group: 'Xbox', component: XboxSeriesModule,
      desc: 'Series on the Xbox profile', file: 'data/xbox/series.json' },
];

const GROUPS = [...new Set(MODULES.map(m => m.group))];
const GROUP_ICON = { RetroAchievements: '/assets/icon-ra.png', Steam: '/assets/icon-steam.png', Xbox: '/assets/icon-xbox.png' };

// ═══════════════════════════════════════════════════════════════════════════════
// App shell
// ═══════════════════════════════════════════════════════════════════════════════

export default function App() {
    const getIdFromHash = () => {
        const hash = location.hash.slice(1);
        return MODULES.find(m => m.id === hash) ? hash : MODULES[0].id;
    };
    const [activeId,      setActiveId]      = useState(getIdFromHash);
    const [error,         setError]         = useState(null);
    const [serverStatus,  setServerStatus]  = useState('online'); // 'online' | 'stopping' | 'restarting' | 'offline'
    const [slot,          setSlot]          = useState(null);    // header actions (Save), filled by the module

    useEffect(() => {
        const onHash = () => setActiveId(getIdFromHash());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
    }, []);

    const stopServer = async () => {
        if (!confirm('Stop the admin server?')) return;
        setServerStatus('stopping');
        await fetch(`${API}/server/stop`, { method: 'POST' }).catch(() => {});
        setServerStatus('offline');
    };

    const restartServer = async () => {
        setServerStatus('restarting');
        await fetch(`${API}/server/restart`, { method: 'POST' }).catch(() => {});
        // Poll until back up
        const poll = setInterval(async () => {
            try {
                const r = await fetch(`${API}/health`);
                if (r.ok) { clearInterval(poll); setServerStatus('online'); }
            } catch {}
        }, 500);
    };

    useEffect(() => {
        fetch(`${API}/data?file=data/hub/config.json`)
            .catch(() => setError('Could not connect to the admin server. Is it running?'));
    }, []);

    const active = MODULES.find(m => m.id === activeId);
    const ActiveComponent = active?.component;
    const ActiveIcon = active?.icon;

    if (error) return (
        <div className="flex items-center justify-center h-screen">
            <Empty icon={Server} title="Connection error" hint={error}>
                <code className="mono text-[#66c0f4] text-[12px] mt-2 px-2 py-1 bg-[#131a22] border border-[#2a475e] rounded-[3px]">npm run admin</code>
            </Empty>
        </div>
    );

    const status = {
        online:     { color: '#52b043', text: 'Server online' },
        stopping:   { color: '#e5b143', text: 'Stopping…' },
        restarting: { color: '#e5b143', text: 'Restarting…' },
        offline:    { color: '#ff6b6b', text: 'Server stopped' },
    }[serverStatus];

    return (
        <div className="flex h-screen overflow-hidden">
            {/* Sidebar */}
            <aside className="w-[232px] shrink-0 flex flex-col border-r border-[#2a475e] bg-[#131a22]">
                <div className="flex items-center gap-2.5 px-4 h-[60px] border-b border-[#2a475e] shrink-0">
                    <img src="/assets/appicon.svg" alt="" className="w-8 h-8 rounded-[4px]" />
                    <div className="flex flex-col leading-tight min-w-0">
                        <span className="text-[14px] text-white font-semibold">Admin</span>
                        <span className="text-[11px] text-[#546270]">gaming-hub</span>
                    </div>
                    <a href="https://yozuryu.github.io/gaming-hub/" target="_blank" rel="noreferrer" className="icon-btn ml-auto" title="Open the live site"><ExternalLink size={14} /></a>
                </div>
                <nav className="flex-1 overflow-y-auto px-2 pb-3 min-h-0">
                    {GROUPS.map(group => (
                        <div key={group}>
                            <div className="nav-g">{GROUP_ICON[group] && <img src={GROUP_ICON[group]} alt="" />}{group}</div>
                            {MODULES.filter(m => m.group === group).map(m => {
                                const Icon = m.icon;
                                return (
                                    <button key={m.id} data-nav onClick={() => { location.hash = m.id; }} className={`nav-i ${activeId === m.id ? 'on' : ''}`}>
                                        <Icon size={15} />{m.label}
                                    </button>
                                );
                            })}
                        </div>
                    ))}
                </nav>
                {/* Server status and controls */}
                <div className="px-3 py-3 border-t border-[#2a475e] flex items-center gap-2">
                    <span className="dot" style={{ background: status.color, boxShadow: `0 0 0 3px ${status.color}22` }} />
                    <span className="flex-1 text-[11px] text-[#8f98a0] anim-fade" key={serverStatus}>{status.text}<span className="text-[#546270]"> · :3131</span></span>
                    <button onClick={restartServer} disabled={serverStatus !== 'online'} className="icon-btn disabled:opacity-40" title="Restart the server (reloads its code)"><RotateCw size={14} /></button>
                    <button onClick={stopServer} disabled={serverStatus !== 'online'} className="icon-btn hover:!text-[#ff6b6b] disabled:opacity-40" title="Stop the server"><Power size={14} /></button>
                </div>
            </aside>

            {/* Main: page header (icon, title, what it edits, Save), then the page */}
            <main className="flex-1 flex flex-col overflow-hidden min-w-0">
                <header className="flex items-center gap-3 px-5 h-[60px] border-b border-[#2a475e] shrink-0 bg-[#171a21]">
                    <div key={`head-${activeId}`} className="flex items-center gap-3 min-w-0 flex-1 anim-fade">
                        <span className="w-9 h-9 rounded-[3px] grid place-items-center bg-[#1b2838] border border-[#2a475e] text-[#66c0f4] shrink-0">{ActiveIcon && <ActiveIcon size={17} />}</span>
                        <div className="flex flex-col min-w-0">
                            <div className="flex items-center gap-2 min-w-0">
                                <span className="text-[15px] text-white font-semibold truncate">{active?.label}</span>
                                <span className="text-[11px] text-[#546270] shrink-0">{active?.group}</span>
                            </div>
                            <div className="flex items-center gap-2 min-w-0 text-[12px] text-[#8f98a0]">
                                <span className="truncate">{active?.desc}</span>
                                {active?.file && <span className="chip mono shrink-0 h-[18px] text-[10px]"><FileJson size={11} />{active.file}</span>}
                            </div>
                        </div>
                    </div>
                    <div ref={setSlot} className="flex items-center gap-3 shrink-0" />
                </header>
                <HeaderSlot.Provider value={slot}>
                    <div key={activeId} className="flex-1 overflow-hidden anim-in">
                        {ActiveComponent && <ActiveComponent />}
                    </div>
                </HeaderSlot.Provider>
            </main>
        </div>
    );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
